// 5問。まだ「とけた」でない型は重み3、とけた は1。同じ型を続けない
function wdPick(rng, states, levels, n) {
  const keys = wdKeysFor(levels);
  if (!keys.length) return [];
  const st = states || {};
  const w = (k) => (wdDone(st[k]) ? 1 : 3);
  const out = [];
  let prev = null;
  while (out.length < n) {
    const cands = keys.length >= 2 ? keys.filter((k) => k !== prev) : keys;
    const total = cands.reduce((a, k) => a + w(k), 0);
    let r = rng.int(total);
    let pick = cands[cands.length - 1];
    for (const k of cands) {
      r -= w(k);
      if (r < 0) { pick = k; break; }
    }
    out.push({ key: 'wd:' + pick, isWord: true, isCheck: false, isProbe: false });
    prev = pick;
  }
  return out;
}

// ---- src/logic/clock.js ----
// clock.js — じかん の セクション（秒・分・時間・日、時刻と時間）。設計 §13.20、D-016
// 倍率は 10 のべき乗ではない。ここ（CK_FACTORS）に1か所だけ置き、テストで独立した正解表と照合する。答えはすべて整数。

// 1 大きい単位 ＝ f 小さい単位
const CK_FACTORS = { '日>時間': 24, '時間>分': 60, '分>秒': 60 };
const CK_SESSION_SIZE = 5;
const CK_MAX_CHECKS = 2;

const CK_ITEMS = [
  { id: 'c1', kind: 'conv', from: '分', to: '秒', dir: 'x', pair: '分>秒', label: '分 → 秒' },
  { id: 'c2', kind: 'conv', from: '秒', to: '分', dir: 'd', pair: '分>秒', label: '秒 → 分' },
  { id: 'c3', kind: 'conv', from: '時間', to: '分', dir: 'x', pair: '時間>分', label: '時間 → 分' },
  { id: 'c4', kind: 'conv', from: '分', to: '時間', dir: 'd', pair: '時間>分', label: '分 → 時間' },
  { id: 'c5', kind: 'conv', from: '日', to: '時間', dir: 'x', pair: '日>時間', label: '日 → 時間' },
  { id: 'c6', kind: 'conv', from: '時間', to: '日', dir: 'd', pair: '日>時間', label: '時間 → 日' },
  { id: 'c7', kind: 'mix', label: '時間と分 → 分' },
  { id: 'c8', kind: 'split', label: '分 → 時間と分' },
  { id: 'c9', kind: 'after', label: 'なん分後の 時こく' },
  { id: 'c10', kind: 'diff', label: '時こくと 時こくの あいだ' },
];

function ckById(id) {
  const it = CK_ITEMS.find((x) => x.id === id);
  if (!it) throw new Error('ckById: 未知の項目 ' + id);
  return it;
}

function ckOpLabel(op) {
  return (op.dir === 'x' ? '×' : '÷') + op.f;
}

const ckR = (rng, lo, hi, step = 1) => lo + step * rng.int(Math.floor((hi - lo) / step) + 1);
const ckTime = (h, m) => h + '時' + (m ? m + '分' : '');

// ①の4択: 正解、向きの逆（dir）、10進法との取り違え（dec: ×100 など）、ほかの倍率（mag: 60 と 24）
function ckOptions(rng, it) {
  const f = CK_FACTORS[it.pair];
  const other = f === 60 ? 24 : 60;
  const opp = it.dir === 'x' ? 'd' : 'x';
  const list = [
    { dir: it.dir, f, correct: true, t: null },
    { dir: opp, f, correct: false, t: 'dir' },
    { dir: it.dir, f: 100, correct: false, t: 'dec' },
    { dir: it.dir, f: other, correct: false, t: 'mag' },
  ];
  return qShuffle(rng, list).map((o) => ({ ...o, label: ckOpLabel(o) }));
}

// 問題。support 2 は小さい数（1〜5）、それ以外は 1〜12。答えはすべて整数
// 返す: { id, kind, text, fields: [{ unit }], answers: [整数], steps, options（conv だけ）, op（conv だけ） }
function ckMakeQuestion(rng, id, support) {
  const it = ckById(id);
  if (it.kind === 'conv') {
    const f = CK_FACTORS[it.pair];
    const n = ckR(rng, 1, support >= 2 ? 5 : 12);
    const value = it.dir === 'x' ? n : n * f;
    const answer = it.dir === 'x' ? n * f : n;
    return {
      id, kind: 'conv', text: value + ' ' + it.from + ' は なん ' + it.to + '？', value, from: it.from, to: it.to,
      fields: [{ unit: it.to }], answers: [answer], op: { dir: it.dir, f }, options: ckOptions(rng, it),
      steps: ['1 ' + (it.dir === 'x' ? it.from : it.to) + ' ＝ ' + f + ' ' + (it.dir === 'x' ? it.to : it.from), value + ' ' + ckOpLabel({ dir: it.dir, f }) + ' ＝ ' + answer],
    };
  }
  if (it.kind === 'mix') {
    const h = ckR(rng, 1, 5);
    const m = ckR(rng, 5, 55, 5);
    const ans = h * 60 + m;
    return { id, kind: 'mix', text: h + '時間' + m + '分 は なん分？', params: { h, m }, fields: [{ unit: '分' }], answers: [ans],
      steps: ['1時間 ＝ 60分 だから ' + h + '時間 ＝ ' + h * 60 + '分', h * 60 + ' ＋ ' + m + ' ＝ ' + ans + '分'] };
  }
  if (it.kind === 'split') {
    const h = ckR(rng, 1, 4);
    const m = ckR(rng, 5, 55, 5);
    const total = h * 60 + m;
    return { id, kind: 'split', text: total + '分 は なん時間なん分？', params: { total }, fields: [{ unit: '時間' }, { unit: '分' }], answers: [h, m],
      steps: ['60分 ＝ 1時間。' + total + ' の 中に 60 が ' + h + 'こ（' + h * 60 + '分）', total + ' − ' + h * 60 + ' ＝ ' + m + ' だから ' + h + '時間' + m + '分'] };
  }
  if (it.kind === 'after') {
    const H = ckR(rng, 7, 10);
    const M = ckR(rng, 0, 55, 5);
    const d = ckR(rng, 10, 50, 5);
    const t = H * 60 + M + d; // 10時55分 ＋ 50分 ＝ 11時45分 なので 12時をこえない
    const h2 = Math.floor(t / 60);
    const m2 = t % 60;
    const toNext = 60 - M;
    const steps = M + d < 60
      ? [M + ' ＋ ' + d + ' ＝ ' + (M + d) + '分（60分に ならない）', 'こたえは ' + ckTime(h2, m2)]
      : [ckTime(H, M) + ' から ' + (H + 1) + '時 まで ' + toNext + '分', d + ' − ' + toNext + ' ＝ ' + (d - toNext) + '分 だから ' + ckTime(h2, m2)];
    return { id, kind: 'after', text: ckTime(H, M) + ' の ' + d + '分後は なん時なん分？', params: { H, M, d }, fields: [{ unit: '時' }, { unit: '分' }], answers: [h2, m2], steps };
  }
  if (it.kind === 'diff') {
    const H = ckR(rng, 8, 10);
    const M = ckR(rng, 0, 55, 5);
    const d = ckR(rng, 15, 55, 5);
    const t = H * 60 + M + d;
    const h2 = Math.floor(t / 60);
    const m2 = t % 60;
    const steps = h2 === H
      ? [m2 + ' − ' + M + ' ＝ ' + d + '分']
      : [ckTime(H, M) + ' から ' + h2 + '時 まで ' + (60 - M) + '分', h2 + '時 から ' + ckTime(h2, m2) + ' まで ' + m2 + '分', (60 - M) + ' ＋ ' + m2 + ' ＝ ' + d + '分'];
    if (steps.length === 1) steps.unshift('おなじ ' + H + '時の あいだ');
    return { id, kind: 'diff', text: ckTime(H, M) + ' から ' + ckTime(h2, m2) + ' までは なん分？', params: { H, M, h2, m2 }, fields: [{ unit: '分' }], answers: [d], steps };
  }
  throw new Error('ckMakeQuestion: 未知の種類');
}

// ---------- 1問の流れ（必ず終わる。§5 と同じ記録の種類） ----------
// stage: 's1'（①を選ぶ）/ 's2'（②を計算）/ 'direct'（直接）/ 'input'（組み合わせの入力）/ 'done'
function ckFlowStart(q, support) {
  let stage;
  if (q.kind !== 'conv') stage = 'input';
  else stage = support === 0 ? 'direct' : 's1';
  return { stage, disabled: [], first: null, inputErrors: 0, hint: false, showAnswer: false, feedback: null, wentS1: false };
}

function ckFlowHint(f) {
  return { ...f, hint: true };
}

function ckFlowChoose(f, q, i) {
  if (f.stage !== 's1') return f;
  const o = q.options[i];
  if (!o || f.disabled.includes(i)) return { ...f, feedback: { kind: 'disabled' } };
  if (o.correct) return { ...f, stage: 's2', feedback: { kind: 'ok1' } };
  return { ...f, disabled: [...f.disabled, i], first: f.first || { stage: 's1', t: o.t }, feedback: { kind: 'ng1', t: o.t } };
}

// values: 入力の文字列の配列。数でなければ 'invalid'
function ckFlowInput(f, q, values) {
  if (!['s2', 'direct', 'input'].includes(f.stage)) return f;
  const nums = values.map((v) => {
    const s = String(v || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).trim();
    return /^\d+$/.test(s) ? Number(s) : null;
  });
  if (nums.length !== q.answers.length || nums.some((x) => x === null)) return { ...f, feedback: { kind: 'invalid' } };
  const ok = nums.every((x, i) => x === q.answers[i]);
  if (ok) return { ...f, stage: 'done', feedback: { kind: 'ok' } };
  if (f.stage === 'direct') {
    // 直接で誤り: ①から（§5 の段階0と同じ）
    return { ...f, stage: 's1', wentS1: true, first: f.first || { stage: 'direct', t: null }, feedback: { kind: 'ng0' } };
  }
  const n = f.inputErrors + 1;
  const first = f.first || { stage: f.stage === 's2' ? 's2' : 'input', t: null };
  if (n >= 2) return { ...f, inputErrors: n, first, stage: 'done', showAnswer: true, feedback: { kind: 'ng2' } };
  return { ...f, inputErrors: n, first, feedback: { kind: 'ng2' } };
}

// 記録（§5 と同じ形）。最初の誤りの段階で決める
function ckFlowRecord(f, support) {
  let r = 'ok';
  let t = null;
  if (f.first) {
    if (f.first.stage === 'direct' || support === 0) r = 'e0';
    else if (f.first.stage === 's1') { r = 'e1'; t = f.first.t; }
    else r = 'e2';
  }
  return { r, t, s: support, h: f.hint };
}

function ckFirstRecord(f, support) {
  return f.first ? ckFlowRecord(f, support) : null;
}

// ---------- 出題 ----------
function ckPick(rng, states, today) {
  const st = states || {};
  const keys = CK_ITEMS.map((x) => x.id);
  const due = keys.filter((k) => pgIsCheckDue(st[k], today));
  const out = [];
  const pool = due.slice();
  while (out.length < CK_MAX_CHECKS && pool.length) out.push({ key: pool.splice(rng.int(pool.length), 1)[0], isCheck: true });
  let prev = out.length ? out[out.length - 1].key : null;
  while (out.length < CK_SESSION_SIZE) {
    let cands = keys.filter((k) => k !== prev);
    const w = (k) => pgWeight(st[k]);
    if (!cands.some((k) => w(k) > 0)) cands = keys.some((k) => w(k) > 0) ? keys : cands;
    const any = cands.some((k) => w(k) > 0);
    const total = cands.reduce((a, k) => a + (any ? w(k) : 1), 0);
    let r = rng.int(total);
    let pick = cands[cands.length - 1];
    for (const k of cands) {
      r -= any ? w(k) : 1;
      if (r < 0) { pick = k; break; }
    }
    out.push({ key: pick, isCheck: false });
    prev = pick;
  }
  return out.map((x) => ({ ...x, key: 'ck:' + x.key, isClock: true, isProbe: false }));
}

function ckHasWork(states, today) {
  const st = states || {};
  return CK_ITEMS.some((it) => {
    const s = st[it.id];
    return !s || s.support > 0 || s.weak || pgIsCheckDue(s, today);
  });
}

function ckPickLabel(id) {
  return ckById(id).label;
}


// ---- src/logic/memtest.js ----
// memtest.js — きおくテスト（1日1回、できた から古い順に5問、ヒントなし）と、ログイン・週のスタンプ。設計 §13.21、D-017

// 最初の答えで正解した数 → 点。5問中 5 → 40、4 → 20、それ以下 → 5
const MT_POINTS = [5, 5, 5, 5, 20, 40];
const MT_MIN_MASTERED = 5;
const MT_LOGIN_BONUS = 10;
const MT_WEEK_STAMPS = 5;
const MT_WEEK_BONUS = 50;

function mtPoints(correct, n) {
  if (!Number.isInteger(correct) || correct < 0 || correct > n || n !== PG_SESSION_SIZE) throw new Error('mtPoints: 正解数が不正 ' + correct + '/' + n);
  return MT_POINTS[correct];
}

// できた の項目: [{ key, lastSeen }]。レベル1〜3は単位のキー、じかん は 'ck:cN'
function mtCandidates(items, clock) {
  const out = [];
  for (const it of unitItemsAll()) if (pgMastered((items || {})[it.key])) out.push({ key: it.key, lastSeen: items[it.key].lastSeen });
  for (const it of CK_ITEMS) if (pgMastered((clock || {})[it.id])) out.push({ key: 'ck:' + it.id, lastSeen: clock[it.id].lastSeen });
  return out;
}

function mtAvailable(items, clock) {
  return mtCandidates(items, clock).length >= MT_MIN_MASTERED;
}

function mtDoneToday(sessions, today) {
  return (sessions || []).some((s) => s.date === today && s.mode === 'memtest');
}

// 5問。lastSeen が古い順（記録が無ければいちばん古い扱い）。同じ日は乱数で並べる。同じ項目は1回だけ
function mtPick(rng, items, clock, today) {
  const c = mtCandidates(items, clock);
  if (c.length < MT_MIN_MASTERED) return [];
  const age = (x) => (x.lastSeen ? pgDaysBetween(x.lastSeen, today) : 100000);
  const tagged = c.map((x) => ({ x, a: age(x), r: rng.int(1000000) }));
  tagged.sort((p, q) => q.a - p.a || p.r - q.r);
  return tagged.slice(0, PG_SESSION_SIZE).map(({ x }) => (x.key.startsWith('ck:')
    ? { key: x.key, isClock: true, isCheck: true, isProbe: false, isMemtest: true }
    : { key: x.key, isCheck: true, isProbe: false, isMemtest: true }));
}

// その日の週（月曜はじまり）の月曜日
function mtWeekStart(day) {
  const [y, m, d] = day.split('-').map(Number);
  const t = Date.UTC(y, m - 1, d);
  const dow = new Date(t).getUTCDay(); // 0 日曜
  const mon = new Date(t - ((dow + 6) % 7) * 86400000);
  const p = (n) => String(n).padStart(2, '0');
  return mon.getUTCFullYear() + '-' + p(mon.getUTCMonth() + 1) + '-' + p(mon.getUTCDate());
}

// 今週のスタンプの数（きおくテストを受けた日の数）
function mtWeekStamps(sessions, today) {
  const w = mtWeekStart(today);
  const days = new Set((sessions || []).filter((s) => s.mode === 'memtest' && s.date && mtWeekStart(s.date) === w).map((s) => s.date));
  return days.size;
}

// 回を足した後の sessions で、まだもらっていないボーナス: [{ id, points, kind: 'login'|'week' }]
function mtDueBonuses(sessions, today) {
  const ss = sessions || [];
  const has = (id) => ss.some((s) => s.id === id);
  const out = [];
  if (ss.some((s) => s.date === today && s.mode !== 'bonus') && !has('login-' + today)) out.push({ id: 'login-' + today, points: MT_LOGIN_BONUS, kind: 'login' });
  const wid = 'week-' + mtWeekStart(today);
  if (mtWeekStamps(ss, today) >= MT_WEEK_STAMPS && !has(wid)) out.push({ id: wid, points: MT_WEEK_BONUS, kind: 'week' });
  return out;
}

// ---- src/logic/challenge.js ----
// challenge.js — タイムチャレンジ（60秒・4択）。問題、得点、1日のポイントの回数。設計 §13.8、D-010

const TC_SECONDS = 60;
const TC_DAILY_MAX = 1; // D-017（D-011 は 3）
const TC_UNLOCK_MASTERED = 8;
const TC_WRONG_SHOW_MS = 1000;

// 1問。masteredKeys: できた 項目、prefixKeys: おぼえた（box 3）接頭語の問題、prevKey: 直前の問題のキー
// 返す: { key, kind: 'conv'|'prefix', text, options: [{ label, correct }] }
function tcMakeQuestion(rng, masteredKeys, prefixKeys, prevKey) {
  let pk = prefixKeys.filter((k) => k !== prevKey);
  let mk = masteredKeys.filter((k) => k !== prevKey);
  if (!pk.length && !mk.length) {
    pk = prefixKeys.slice();
    mk = masteredKeys.slice();
  }
  const usePrefix = pk.length > 0 && (mk.length === 0 || rng.int(4) === 0);
  if (usePrefix) {
    const q = prefixMakeQuestion(rng, qPick(rng, pk));
    return { key: q.key, kind: 'prefix', text: q.text, options: q.options.map((o) => ({ label: o.label, correct: o.correct })) };
  }
  if (!mk.length) throw new Error('tcMakeQuestion: 出せる問題が無い');
  const item = unitItemByKey(qPick(rng, mk));
  const q = qMakeQuestion(rng, item, 1);
  const options = q.options.map((o) => ({ label: decToString(qApplyOp(q.value, o)) + ' ' + item.to, correct: o.correct }));
  return { key: item.key, kind: 'conv', text: decToString(q.value) + ' ' + item.from + ' は なん ' + item.to + '？', options };
}

// 1問の得点。combo はその直前までの連続正解数
function tcPoints(combo) {
  return 2 + Math.min(3, Math.floor(combo / 5));
}

// 答えの列（true/false）から得点と式を作る
function tcScore(results) {
  let combo = 0;
  let correct = 0;
  let bonus = 0;
  for (const ok of results) {
    if (ok) {
      bonus += tcPoints(combo) - 2;
      correct += 1;
      combo += 1;
    } else {
      combo = 0;
    }
  }
  const score = correct * 2 + bonus;
  return { n: results.length, correct, bonus, score, formula: 'せいかい ' + correct + ' × 2 ＋ コンボ ' + bonus + ' ＝ ' + score };
}

// 今日すでに終えたタイムチャレンジの回数（最初の TC_DAILY_MAX 回だけポイントになる）
function tcCountToday(sessions, today) {
  return (sessions || []).filter((s) => s.mode === 'time' && s.date === today).length;
}

// ポイントは得点の 1/3 を四捨五入（0.5 切り上げ）。D-011、保護者の決定
function tcPointsFromScore(score) {
  return Math.floor((2 * score + 3) / 6);
}

function tcPointsFor(score, sessions, today) {
  return tcCountToday(sessions, today) < TC_DAILY_MAX ? tcPointsFromScore(score) : 0;
}

function tcReady(items) {
  return pgMasteredKeys(items).length >= TC_UNLOCK_MASTERED;
}

// ---- src/logic/coach.js ----
// coach.js — きょうの れんしゅう（おすすめ）、回の終わりの出来事、解放。設計 §13.5〜13.8、D-010

// じかん の クリア: 10項目がすべて できた（D-016。段位の「クリア」には数えない）
function coClockCleared(p) {
  return CK_ITEMS.every((it) => pgMastered((p.clock || {})[it.id]));
}
function coClockMastered(p) {
  return CK_ITEMS.filter((it) => pgMastered((p.clock || {})[it.id])).length;
}

// 文章題を出せるレベル: できた が半分以上（D-015）
function coWordLevels(p) {
  return [1, 2, 3].filter((lv) => {
    const g = pgLevelProgress(p.items, lv);
    return g.mastered >= Math.ceil(g.total / 2);
  });
}

// レベルのクリア: 換算の項目がすべて できた、かつ 意味の問題がすべて「わかった」（D-014）
function coLevelCleared(p, level) {
  const g = pgLevelProgress(p.items, level);
  return g.mastered === g.total && mnLevelDone(p.meaning, level);
}

const CO_RECENT_DAYS = 7;
const CO_ERR_MIN = 3;

function coDoneToday(p, today, mode) {
  return (p.sessions || []).some((s) => s.date === today && s.mode === mode);
}

// 最近（lastSeen が7日以内）の項目の recent にある e1・e2 の件数
function coRecentErrors(items, today) {
  const c = { e1: 0, e2: 0 };
  for (const it of unitItemsAll()) {
    const st = items[it.key];
    if (!st || !st.lastSeen || pgDaysBetween(st.lastSeen, today) > CO_RECENT_DAYS) continue;
    for (const r of st.recent) if (r.r === 'e1' || r.r === 'e2') c[r.r] += 1;
  }
  return c;
}

// そのレベルで今日すすめられることがあるか（段階1・2、記録なし、今日の確認）
function coLevelHasWork(items, level, today) {
  return unitItems(level).some((it) => {
    const st = items[it.key];
    return !st || st.support > 0 || pgIsCheckDue(st, today);
  });
}

function coL4Available(p) {
  return !!(p.unlocked && p.unlocked.L4) || pgL4Ready(p.items);
}

function coTimeAvailable(p) {
  return !!(p.unlocked && p.unlocked.time) || tcReady(p.items);
}

// きょうの れんしゅう。返す: { mode, level, reason, rest? }
function coRecommend(p, today) {
  const items = p.items;
  // きおくテスト（D-017）: 使えて今日まだなら、いちばん初めに
  if (mtAvailable(items, p.clock) && !mtDoneToday(p.sessions, today)) return { mode: 'memtest', level: null, reason: 'きょうの きおくテスト' };
  if (pgWeakKeys(items).length > 0 && !coDoneToday(p, today, 'review')) return { mode: 'review', level: null, reason: 'がんばり中を なおそう' };
  const err = coRecentErrors(items, today);
  if (err.e1 >= CO_ERR_MIN && prefixLearned(p.prefix) < prefixKeys().length && !coDoneToday(p, today, 'prefix')) {
    return { mode: 'prefix', level: null, reason: 'たんいの なまえを おぼえよう' };
  }
  if (err.e2 >= CO_ERR_MIN && !coDoneToday(p, today, 'drill')) return { mode: 'drill', level: 1, reason: '×10 の けいさんを きたえよう' };
  // じかん（D-016）: クリアしておらず、今日すすめられることがあり、今日まだなら（1日1回）

  if (e.kind === 'word') { const w = WORD.find((x) => x.id === e.key); return 'ぶんしょうだい「' + (w ? w.title : e.key) + '」が とけた！'; }
  if (e.kind === 'meaning') { const m = MEANING.find((x) => x.id === e.key); return (m ? m.short : e.key) + ' が わかった！'; }
  if (e.kind === 'rank') return (CO_RANKS[Number(e.key)] ? CO_RANKS[Number(e.key)].name : '') + ' に なった！';
  if (e.kind === 'unlock') return (e.key === 'L4' ? 'レベル4 ごちゃまぜ' : 'タイムチャレンジ') + ' が えらべるように なった！';
  if (e.kind === 'prefix') {

    const pr = prefixById(id);
    return 'おぼえた: ' + (kind === 'sym' ? pr.sym + ' ＝ ' + pr.name : pr.name + ' ＝ ' + prefixFactorLabel(pr.exp));
  }
  const l = uiItemLabel(e.key);
  if (e.kind === 'nofig') return l + ' は ずつきで れんぞく せいかい！ つぎは ずなしで チャレンジ';
  if (e.kind === 'direct') return l + ' は ずなしで れんぞく せいかい！ つぎは いきなり こたえる もんだいに チャレンジ';
  if (e.kind === 'jump') return l + ' に いきなり こたえられた！';
  if (e.kind === 'mastered') return l + ' が できるように なった！';
  if (e.kind === 'overcome') return l + ' の がんばり中を クリア！';

// ---------- 学習の回 ----------
function uiStart(mode, level, fromRec) {
  const p = uiProfile();
  const today = pgToday();
  if (mode === 'rec') {
    const rec = coRecommend(p, today);
    uiStart(rec.mode, rec.level, true);
    return;
  }
  if (mode === 'time') {
    uiTimeStart();
    return;
  }
  let list;
  if (mode === 'normal') list = pgPickNormal(uiRng, p.items, level, today);
  else if (mode === 'review') list = pgPickReview(uiRng, p.items);
  else if (mode === 'prefix') list = prefixPick(uiRng, p.prefix);
  else if (mode === 'l4') list = pgPickL4(uiRng, p.items, today);
  else if (mode === 'jump') list = pgPickJump(uiRng, p.items, level);
  else if (mode === 'word') list = wdPick(uiRng, p.word, coWordLevels(p), PG_SESSION_SIZE);
  else if (mode === 'clock') list = ckPick(uiRng, p.clock, today);
  else if (mode === 'memtest') list = mtDoneToday(p.sessions, today) ? [] : mtPick(uiRng, p.items, p.clock, today);
  else list = Array.from({ length: PG_SESSION_SIZE }, () => ({ key: 'drill', isCheck: false }));
  if (!list.length) return;
  // 意味の問題（D-014）: 通常の回で、そのレベルに「わかった」でない問題があり今日まだ答えていなければ、確認でない最後の1問と入れ替える
  if (mode === 'normal') {
    const mid = mnNextFor(p.meaning, level, today);
    let j = list.length - 1;
    while (j > 0 && list[j].isCheck) j -= 1;
    if (mid && !list[j].isCheck) list[j] = { key: 'mn:' + mid, isMeaning: true, isCheck: false, isProbe: false };
  }
  uiS.play = { rec: !!fromRec, before: storeClone(p), events: [], id: uiTabId + '-' + Date.now(), mode, level, list, idx: 0, correct: 0, retried: 0, missed: [], q: null, flow: null, support: 2, placeAid: false, drillTries: 0, drillShow: false };
  uiNextQ();
  uiS.screen = 'play';
}

function uiNextQ() {
  const pl = uiS.play;
  const p = uiProfile();
  const entry = pl.list[pl.idx];
  pl.isMeaning = !!entry.isMeaning;
  pl.isWord = !!entry.isWord;
  pl.isClock = !!entry.isClock;
  uiS.lastInput = 'ans';
  if (pl.isClock) {
    const id = entry.key.slice(3);
    const st = (p.clock || {})[id] || pgNewItem();
    pl.support = st.support;
    pl.q = ckMakeQuestion(uiRng, id, pl.support);
    pl.ck = ckFlowStart(pl.q, pl.support);
    pl.flow = null;
    pl.recorded = false;
    pl.counted = false;
    return;
  }
  if (pl.isWord) {
    pl.q = wdMakeQuestion(uiRng, entry.key.slice(3));
    pl.flow = null;
    pl.drillHint = false;
    pl.wd = { tries: 0, show: false, fb: null };
    return;
  }
  if (pl.isMeaning) {
    pl.q = mnMakeQuestion(uiRng, entry.key.slice(3));
    pl.flow = null;
    pl.drillHint = false;
    pl.pf = { disabled: [], wrongs: 0, done: false, lastWrong: null };
    return;
  }
  if (pl.mode === 'prefix') {
    pl.q = prefixMakeQuestion(uiRng, entry.key);
    pl.flow = null;
    pl.drillHint = false;
    pl.pf = { disabled: [], wrongs: 0, done: false, lastWrong: null };
    return;
  }
  if (pl.mode === 'drill') {
    pl.q = qMakeDrill(uiRng, pl.level);
    pl.flow = null;
    pl.drillTries = 0;
    pl.drillShow = false;
    pl.drillFb = null;
    pl.drillHint = false;
    return;
  }
  const item = unitItemByKey(entry.key);
  const st = p.items[entry.key] || pgNewItem();
  pl.isProbe = !!entry.isProbe;
  pl.isJump = !!entry.isJump;
  pl.support = pl.isProbe || pl.isJump ? 0 : st.support; // ためし問題・ほじょなしで チャレンジは段階0で出す（設計 §13.2・13.13）
  pl.placeAid = st.placeAid;
  pl.q = qMakeQuestion(uiRng, item, pl.support);
  pl.flow = qFlowStart(pl.q, pl.support);
  pl.recorded = false;
  pl.placeDone = false;
  pl.counted = false;
}

// flow が変わるたびに呼ぶ。最初の誤答の時点で記録し（途中でやめても残る）、②の成否で位取り表を切り替える
function uiAfterFlow() {
  const pl = uiS.play;
  const f = pl.flow;
  const entry = pl.list[pl.idx];
  const today = pgToday();
  let st = uiProfile().items[entry.key];
  let changed = false;
  if (!pl.recorded) {
    const rec = f.stage === 'done' ? qFlowRecord(f, pl.support) : qFlowFirstRecord(f, pl.support);
    if (rec) {
      if (pl.isJump) {
        const before = st;
        st = pgRecordJump(st, rec, today);
        // ほじょなしで チャレンジは、実際に直接答えて正解したので「いきなり こたえられた」（R-007）
        if (before && before.support > 0 && st.support === 0) pl.events.push({ date: today, kind: 'jump', key: entry.key });
      } else if (pl.isProbe) {
        st = pgRecordProbe(rec, today);
      } else {
        const before = st;
        st = pgRecord(st, rec, today, entry.isCheck);
        for (const kind of pgEvents(before, st)) pl.events.push({ date: today, kind, key: entry.key });
        if (rec.r !== 'ok' && pl.missed) pl.missed.push(entry.key);
      }
      pl.recorded = true;
      changed = true;
    }
  }
  if (!pl.placeDone && (f.s2Errors > 0 || f.stage === 'done')) {
    st = pgPlace(st, f.s2Errors === 0, f.hint);
    pl.placeDone = true;
    changed = true;
  }
  if (changed) uiSave(storeSetItem(uiS.data, uiS.pid, entry.key, st));
  if (f.stage === 'done' && !pl.counted) {
    pl.counted = true;
    // スロットの正解数はヒントありも数える（ヒントを使うことを罰しない）。段位の「全問正解」は clean（最初の1回・ヒントなし）で数える（R-007）
    if (!f.first) pl.correct += 1;
    else if (qFlowRetried(f)) pl.retried += 1;
    if (!f.first && !f.hint) pl.clean = (pl.clean || 0) + 1;
  }
}

function uiQText(q) {
  return '<span>' + decToString(q.value) + '</span> <span class="u">' + uiEsc(q.from) + '</span> は なん <span class="u">' + uiEsc(q.to) + '</span>？';
}

// レベル3で L・dL・mL・cm³ どうしの問題なら、りっぽー（いっぺん 10 cm の りっぽうたい ＝ 1 L）の図を出す（D-007）
const UI_LITER_UNITS = ['L', 'dL', 'mL', 'cm³'];
function uiLiterFig(q) {
  return q.level === 3 && UI_LITER_UNITS.includes(q.from) && UI_LITER_UNITS.includes(q.to) ? '<div class="figure">' + charaLiterSvg() + '</div>' : '';
}

// 問題の画面の「fb ok」「fb hint」の箱に、キャラクターを添える（正解は happy、それ以外は think）
function uiCharaId(pl, q) {
  if (pl.mode === 'prefix') return 'shikaku';
  if (pl.mode === 'drill') return pl.level === 2 ? 'shikaku' : 'naga';
  return charaForLevel(q.level).id;
}
function uiWithChara(h, id) {
  return h
    .replaceAll('<div class="fb ok">', '<div class="fb ok say">' + charaSvg(id, 'happy', 72))
    .replaceAll('<div class="fb hint">', '<div class="fb hint say">' + charaSvg(id, 'think', 72) + '<b>いっしょに ずを みよう。</b> ');
}

function uiExplain(q, t) {
  if (t === 'dim' && q.dim) return '<div class="fb hint">おしい！ ながさ と ちがって、' + (q.level === 3 ? 'たいせき' : 'めんせき') + 'は かけざんを かさねるよ。' + uiDimFigure(q) + '</div>';
  if (t === 'dir') return '<div class="fb hint">おしい！ むきを みてみよう。大きい たんい → 小さい たんい は かずが 大きく なる（×）。小さい たんい → 大きい たんい は かずが 小さく なる（÷）。<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>' + uiLiterFig(q) + '</div>';
  return '<div class="fb hint">おしい！ となりどうしの ばいりつを たどってみよう。<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>' + uiLiterFig(q) + '</div>';
}

function uiPlay() {
  const pl = uiS.play;
  const q = pl.q;
  let h = '<div class="row"><span class="progress">' + (pl.idx + 1) + ' / ' + pl.list.length + '</span>';
  if (pl.mode === 'review') h += '<span class="tag">にがて ふくしゅう</span>';
  if (pl.mode === 'memtest') h += '<span class="tag">きおくテスト（ヒントなし）</span>';
  else if (pl.mode === 'l4') h += '<span class="tag">ごちゃまぜ</span>';
  else if (pl.list[pl.idx].isCheck) h += '<span class="tag">たしかめ</span>';
  if (pl.list[pl.idx].isProbe) h += '<span class="tag">ためし もんだい</span>';
  if (pl.mode === 'jump') h += '<span class="tag">ほじょなしで チャレンジ</span>';
  h += '<span style="flex:1"></span>';
  if (pl.mode !== 'memtest') h += '<button class="small" data-act="hint">ヒント</button>';
  h += '<button class="small" data-act="quit">やめる</button></div>';
  if (pl.mode === 'drill') return uiWithChara(h + uiDrill(), uiCharaId(pl, q));
  if (pl.mode === 'prefix') return uiWithChara(h + uiPrefix(), uiCharaId(pl, q));
  if (pl.isMeaning) return uiWithChara(h + uiMeaning(), charaForLevel(q.level).id);
  if (pl.isWord) return uiWithChara(h + uiWord(), charaForLevel(q.level).id);
  if (pl.isClock) return uiWithChara(h + uiClock(), 'timmy');
  const f = pl.flow;
  const showFig = pl.support === 2 || f.hint;
  h += '<div class="qtext">' + uiQText(q) + '</div>';
  if (f.stage === 's1') {
    h += '<p>① ' + uiEsc(q.from) + ' を ' + uiEsc(q.to) + ' に するには、どれ？</p><div class="options">';
    q.options.forEach((o, i) => {
      h += '<button data-act="choose" data-i="' + i + '"' + (f.disabled.includes(i) ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + o.label + '</button>';
    });
    h += '</div>';
    if (f.feedback && f.feedback.kind === 'ng1') h += uiExplain(q, f.feedback.t);
    else if (f.feedback && f.feedback.kind === 'ng0') h += '<div class="fb hint">おしい！ ①から いっしょに やってみよう。</div>';
    else if (showFig) h += '<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>' + uiLiterFig(q);
  } else if (f.stage === 's2' || f.stage === 'direct') {
    if (f.stage === 's2') {
      h += '<div class="fb ok">① ' + qOpLabel(q.op) + ' で せいかい！</div>';
      h += '<p>② けいさん しよう</p><div class="answer-row">' + decToString(q.value) + ' ' + qOpLabel(q.op).replace('（そのまま）', '') + ' ＝ ';
    } else {
      h += '<div class="answer-row">' + decToString(q.value) + ' ' + uiEsc(q.from) + ' ＝ ';
    }
    h += '<input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="こたえ"> ' + (f.stage === 'direct' ? uiEsc(q.to) : '') + '<button class="primary" data-act="submit">けってい</button></div>';
    h += uiTenkey();
    if (f.feedback && f.feedback.kind === 'invalid') h += '<div class="fb info">すうじで いれてね。</div>';
    if (f.feedback && f.feedback.kind === 'ng2') h += '<div class="fb hint">おしい！ くらいどりの ひょうを みてみよう。' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
    else if (f.stage === 's2' && (pl.support === 2 || pl.placeAid || f.hint)) h += '<div class="fb info">くらいどりの ひょう' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
    if (f.stage === 'direct' && f.hint) h += '<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>';
  } else {
    const fb = f.feedback || {};
    if (f.showAnswer) h += '<div class="fb hint">こたえは <b>' + decToString(q.answer) + ' ' + uiEsc(q.to) + '</b> だよ。ひょうで たしかめよう。' + uiPlaceTable(q.value, q.answer, q.op) + '</div>';
    else h += '<div class="fb ok">せいかい！ ' + decToString(q.value) + ' ' + uiEsc(q.from) + ' ＝ <b>' + decToString(q.answer) + ' ' + uiEsc(q.to) + '</b>' + (f.first ? '（やりなおして できたね）' : '') + uiPlaceTable(q.value, q.answer, q.op) + '</div>';
    void fb;
    h += '<p><button class="primary big" data-act="next">つぎへ（Enter）</button></p>';
  }
  return uiWithChara(h, uiCharaId(pl, q));
}

function uiTenkey() {

  else if (pl.drillHint) h += '<div class="fb info">ヒント: ' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
  return h;
}

// ---------- じかん（D-016） ----------
function uiClockFig() {
  return '<div class="figure clock-fig"><b>1日 ＝ 24時間</b>　→　<b>1時間 ＝ 60分</b>　→　<b>1分 ＝ 60秒</b><div class="muted">じかんは 60（1日は 24）で くりあがるよ。100 では ないよ。</div></div>';
}

function uiClockInputs(q) {
  return q.fields.map((fd, i) => '<input id="' + (i === 0 ? 'ans' : 'ans' + (i + 1)) + '" type="text" inputmode="numeric" autocomplete="off" aria-label="こたえ' + (i + 1) + '" class="ck-in"> ' + uiEsc(fd.unit)).join(' ');
}

function uiClock() {
  const pl = uiS.play;
  const q = pl.q;
  const f = pl.ck;
  const steps = (list) => '<ol class="steps">' + list.map((x) => '<li>' + uiEsc(x) + '</li>').join('') + '</ol>';
  const showFig = pl.support === 2 || f.hint;
  let h = '<p>じかん</p><div class="qtext">' + uiEsc(q.text) + '</div>';
  if (f.stage === 'done') {
    const ans = q.answers.map((a, i) => a + ' ' + q.fields[i].unit).join(' ');
    if (f.showAnswer) h += '<div class="fb hint">こたえは <b>' + uiEsc(ans) + '</b> だよ。' + steps(q.steps) + uiClockFig() + '</div>';
    else h += '<div class="fb ok">' + (f.first ? 'できたね！ ' : 'せいかい！ ') + '<b>' + uiEsc(ans) + '</b>' + steps(q.steps) + '</div>';
    h += '<p><button class="primary big" data-act="next">つぎへ（Enter）</button></p>';
    return h;
  }
  if (f.stage === 's1') {
    h += '<p>① ' + uiEsc(q.from) + ' を ' + uiEsc(q.to) + ' に するには、どれ？</p><div class="options">';
    q.options.forEach((o, i) => {
      h += '<button data-act="choose" data-i="' + i + '"' + (f.disabled.includes(i) ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + o.label + '</button>';
    });
    h += '</div>';
    const fb = f.feedback || {};
    if (fb.kind === 'ng1') {
      const msg = fb.t === 'dec' ? 'じかんは 10 ずつ では なく、60（1日は 24）で くりあがるよ。'
        : fb.t === 'mag' ? '60 と 24 を まちがえないでね。1日 ＝ 24時間、1時間 ＝ 60分、1分 ＝ 60秒。'
          : '大きい たんい → 小さい たんい は かずが 大きく なる（×）。ぎゃくは ÷。';
      h += '<div class="fb hint">おしい！ ' + msg + uiClockFig() + '</div>';
    } else if (fb.kind === 'ng0') h += '<div class="fb hint">おしい！ ①から いっしょに やってみよう。</div>';
    else if (showFig) h += uiClockFig();
    return h;
  }
  if (f.stage === 's2') {
    h += '<div class="fb ok">① ' + ckOpLabel(q.op) + ' で せいかい！</div><p>② けいさん しよう</p><div class="answer-row">' + q.value + ' ' + ckOpLabel(q.op) + ' ＝ ' + uiClockInputs(q) + ' <button class="primary" data-act="submit">けってい</button></div>';
  } else if (f.stage === 'direct') {
    h += '<div class="answer-row">' + q.value + ' ' + uiEsc(q.from) + ' ＝ ' + uiClockInputs(q) + ' <button class="primary" data-act="submit">けってい</button></div>';
  } else {
    h += '<div class="answer-row">' + uiClockInputs(q) + ' <button class="primary" data-act="submit">けってい</button></div>';
  }
  h += uiTenkey();
  const fb = f.feedback || {};
  if (fb.kind === 'invalid') h += '<div class="fb info">すうじで いれてね。</div>';
  else if (fb.kind === 'ng2') h += '<div class="fb hint">おしい！ とき方を みて、もう いちど。' + steps(q.steps.slice(0, -1)) + uiClockFig() + '</div>';
  else if (showFig) h += uiClockFig();
  return h;
}

// flow が変わるたびに呼ぶ。最初の誤りの時点で記録する（途中でやめても残る）
function uiClockAfter() {
  const pl = uiS.play;
  const f = pl.ck;
  const entry = pl.list[pl.idx];
  const id = pl.q.id;
  if (!pl.recorded) {
    const rec = f.stage === 'done' ? ckFlowRecord(f, pl.support) : ckFirstRecord(f, pl.support);
    if (rec) {
      const today = pgToday();
      const before = (uiProfile().clock || {})[id];
      const st = pgRecord(before, rec, today, entry.isCheck);
      if (before) for (const kind of pgEvents(before, st)) pl.events.push({ date: today, kind, key: 'ck:' + id });
      if (rec.r !== 'ok' && pl.missed) pl.missed.push('ck:' + id);
      uiSave(storeSetClock(uiS.data, uiS.pid, id, st));
      pl.recorded = true;
    }
  }
  if (f.stage === 'done' && !pl.counted) {
    pl.counted = true;
    if (!f.first) {
      pl.correct += 1;
      if (!f.hint) pl.clean = (pl.clean || 0) + 1;
    } else if (!f.showAnswer) pl.retried += 1;
  }
}

// ---------- 文章題（D-015） ----------
function uiWord() {
  const pl = uiS.play;
  const q = pl.q;
  const wd = pl.wd;
  const steps = (list) => '<ol class="steps">' + list.map((x) => '<li>' + uiEsc(x) + '</li>').join('') + '</ol>';
  let h = '<p>ぶんしょうだい</p><div class="qtext word">' + uiEsc(q.text) + '</div>';
  if (wd.show) {
    const ans = decToString(q.answer) + ' ' + q.unit;
    if (wd.fb === 'ok') h += '<div class="fb ok">' + (wd.tries === 0 ? 'せいかい！ ' : 'できたね！ ') + '<b>' + uiEsc(ans) + '</b>' + steps(q.steps) + '</div>';
    else h += '<div class="fb hint">こたえは <b>' + uiEsc(ans) + '</b> だよ。とき方を みてみよう。' + steps(q.steps) + '</div>';
    h += '<p><button class="primary big" data-act="next">つぎへ（Enter）</button></p>';
    return h;
  }
  h += '<div class="answer-row"><input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="こたえ"> ' + uiEsc(q.unit) + ' <button class="primary" data-act="submit">けってい</button></div>' + uiTenkey();
  if (wd.fb === 'invalid') h += '<div class="fb info">すうじで いれてね。</div>';
  if (wd.fb === 'ng') h += '<div class="fb hint">おしい！ とき方を みて、もう いちど。' + steps(q.steps.slice(0, -1)) + '</div>';
  else if (pl.drillHint) h += '<div class="fb info">ヒント: ' + uiEsc(q.steps[0]) + '</div>';
  return h;
}

function uiWordSubmit(val) {
  const pl = uiS.play;
  const q = pl.q;
  const wd = pl.wd;
  const r = qCheck(val, q.answer);
  if (r === 'invalid') {
    wd.fb = 'invalid';
    return;
  }
  const ok = r === 'ok';
  if (wd.tries === 0) {
    // 最初の1回で記録する（ヒントを見て正解したときは進めない）
    if (!(pl.drillHint && ok)) {
      const today = pgToday();
      const before = (uiProfile().word || {})[q.id];
      const after = wdRecord(before, ok, today);
      uiSave(storeSetWord(uiS.data, uiS.pid, q.id, after));
      if (!wdDone(before) && wdDone(after)) pl.events.push({ date: today, kind: 'word', key: q.id });
    }
    if (ok) {
      pl.correct += 1;
      if (!pl.drillHint) pl.clean = (pl.clean || 0) + 1;
    }
  } else if (ok) {
    pl.retried += 1;
  }
  if (ok) {
    wd.fb = 'ok';
    wd.show = true;
  } else {
    wd.tries += 1;
    wd.fb = 'ng';
    if (wd.tries >= 2) wd.show = true;
  }
}

function uiMeaningChoose(i) {
  const pl = uiS.play;
  const pf = pl.pf;
  const o = pl.q.options[i];
  if (!o || pf.done || pf.disabled.includes(i)) return;
  // ヒントを見て正解したときは進めない。誤りは記録する（D-014）
  if (pf.wrongs === 0 && !(pl.drillHint && o.correct)) {
    const today = pgToday();
    const before = (uiProfile().meaning || {})[pl.q.id];
    const after = mnRecord(before, o.correct, today);
    uiSave(storeSetMeaning(uiS.data, uiS.pid, pl.q.id, after));
    if (!mnDone(before) && mnDone(after)) pl.events.push({ date: today, kind: 'meaning', key: pl.q.id });
  }
  if (o.correct) {
    if (pf.wrongs === 0) pl.correct += 1;
    else pl.retried += 1;
    pf.done = true;
  } else {
    pf.wrongs += 1;
    pf.disabled.push(i);
    pf.lastWrong = i;
  }
}

// 最初の1回の答えで記録する（途中でやめても残る）
function uiPrefixChoose(i) {
  const pl = uiS.play;
  const pf = pl.pf;
  const o = pl.q.options[i];
  if (!o || pf.done || pf.disabled.includes(i)) return;
  // ヒント（表）を見て正解したときは、箱を進めない（R-007）。誤りは記録する
  if (pf.wrongs === 0 && !(pl.drillHint && o.correct)) {
    const st = (uiProfile().prefix || {})[pl.q.key];
    uiSave(storeSetPrefix(uiS.data, uiS.pid, pl.q.key, prefixRecord(st, o.correct, pgToday())));
  }
  if (o.correct) {
    if (pf.wrongs === 0) pl.correct += 1;
    else pl.retried += 1;
    pf.done = true;
  } else {
    pf.wrongs += 1;
    pf.disabled.push(i);
    pf.lastWrong = o.id;
  }
}

function uiSubmit() {
  const el = document.getElementById('ans');
  const val = el ? el.value : '';
  const pl = uiS.play;
  if (pl.isClock) {
    const vals = pl.q.fields.map((_, i) => { const e = document.getElementById(i === 0 ? 'ans' : 'ans' + (i + 1)); return e ? e.value : ''; });
    pl.ck = ckFlowInput(pl.ck, pl.q, vals);
    uiClockAfter();
    uiRender();
    return;
  }
  if (pl.isWord) {
    uiWordSubmit(val);
    uiRender();
    return;
  }
  if (pl.mode === 'drill') {
    const r = qCheck(val, pl.q.answer);
    if (r === 'invalid') pl.drillFb = 'invalid';
    else {
      if (pl.drillTries === 0) {
        uiSave(storeAddDrill(uiS.data, uiS.pid, (pl.q.dir === 'x' ? 'x' : 'd') + pl.q.k, r === 'ok'));
        if (r === 'ok') pl.correct += 1;
      }
      if (r === 'ok') {
        if (pl.drillTries > 0) pl.retried += 1;
        pl.drillFb = 'ok';
        pl.drillShow = true;
      } else {
        pl.drillTries += 1;
        pl.drillFb = 'ng';
        if (pl.drillTries >= 2) pl.drillShow = true;
      }
    }
    uiRender();
    return;
  }
  pl.flow = qFlowInput(pl.flow, pl.q, val);
  uiAfterFlow();
  uiRender();
}

function uiNext() {
  const pl = uiS.play;
  pl.idx += 1;
  if (pl.idx < pl.list.length) {
    uiNextQ();
    return;
  }
  uiFinishSession();
}

function uiFinishSession() {
  const pl = uiS.play;
  const p = uiProfile();
  const before = p.total;
  if (pl.mode === 'drill' && !SLOT_DRILL_GIVES_SLOT) {
    uiS.play = null;
    uiS.screen = 'home';
    return;
  }
  if (pl.mode === 'memtest') {
    uiFinishMemtest();
    return;
  }
  const spin = slotSpin(uiRng, pl.correct);
  const session = {
    id: pl.id, date: pgToday(), mode: pl.mode, level: pl.level || null, n: pl.list.length, correct: pl.correct,
    retried: pl.retried, clean: pl.clean || 0, rec: !!pl.rec, mid: spin.mi, right: spin.ri, points: spin.points, formula: spin.formula, totalBefore: before,
  };
  // アニメーションの前に確定して保存する（途中で閉じても引き直せない）
  const r = storeApplySession(uiS.data, uiS.pid, session);
  // できるようになったこと（設計 §13.5）: 1問ごとの出来事 ＋ 回の終わりの出来事。同じ日の重複は storeAddLog が落とす
  const today = pgToday();
  let d = r.data;
  const se = coSessionEvents(pl.before, storeProfile(d, uiS.pid), today);
  for (const k of se.unlock) d = storeSetUnlocked(d, uiS.pid, k, today);
  // 段位（設計 §13.16）: 上がったら記録して出来事にする
  {
    const pr = storeProfile(d, uiS.pid);
    const before = pr.rank ? pr.rank.i : 0;
    const ri = coRankIndex(pr);
    if (ri > before || !pr.rank) {
      d = storeSetRank(d, uiS.pid, ri, today);
      for (let k = before + 1; k <= ri; k++) se.events.push({ date: today, kind: 'rank', key: String(k) });
    }
  }
  // ログイン・週のスタンプ（D-017。§13.12 の もくひょう は廃止）
  const bn = uiApplyBonuses(d, today);
  d = bn.data;
  const lg = storeAddLog(d, uiS.pid, pl.events.concat(se.events));
  d = lg.data;
  uiSave(d);
  const shown = lg.added;
  const nextStep = shown.length || !(pl.mode === 'normal' && pl.level) ? null : pgNextStep(storeProfile(d, uiS.pid).items, pl.level);
  uiS.play = null;
  uiS.result = { session, phase: 0, events: shown.filter((e) => e.kind !== 'daily'), nextStep, bonuses: bn.got };
  uiS.screen = 'result';
}

// まだもらっていない ログイン・週のスタンプ のボーナスを足す。返す: { data, got: [{ kind, points }] }
function uiApplyBonuses(data, today) {
  let d = data;
  const got = [];
  for (const b of mtDueBonuses(storeProfile(d, uiS.pid).sessions, today)) {
    const r = storeApplyBonus(d, uiS.pid, b.id, today, b.points);
    d = r.data;
    if (r.added) got.push(b);
  }
  return { data: d, got };
}

function uiBonusHtml(list) {
  return (list || []).map((b) => '<div class="fb ok daily">' + (b.kind === 'week' ? 'こんしゅうの スタンプ ' + MT_WEEK_STAMPS + 'こ たまった！' : 'きょうも きてくれて ありがとう！ ログインボーナス') + ' <b>＋' + b.points + ' ポイント</b></div>').join('');
}

// きおくテストの終わり（D-017）: 点は正解数で決まる。スロットは回さない
function uiFinishMemtest() {
  const pl = uiS.play;
  const p = uiProfile();
  const today = pgToday();
  const points = mtPoints(pl.correct, pl.list.length);
  const session = { id: pl.id, date: today, mode: 'memtest', level: null, n: pl.list.length, correct: pl.correct, retried: pl.retried, clean: pl.clean || 0, rec: !!pl.rec, mid: null, right: null, points, totalBefore: p.total };
  let d = storeApplyMemtest(uiS.data, uiS.pid, session).data;
  const se = coSessionEvents(pl.before, storeProfile(d, uiS.pid), today);
  for (const k of se.unlock) d = storeSetUnlocked(d, uiS.pid, k, today);
  {
    const pr = storeProfile(d, uiS.pid);
    const before = pr.rank ? pr.rank.i : 0;
    const ri = coRankIndex(pr);
    if (ri > before || !pr.rank) {
      d = storeSetRank(d, uiS.pid, ri, today);
      for (let k = before + 1; k <= ri; k++) se.events.push({ date: today, kind: 'rank', key: String(k) });
    }
  }
  const bn = uiApplyBonuses(d, today);
  d = bn.data;

// ---------- タイムチャレンジ（設計 §13.8） ----------
function uiTimeKeys() {
  const p = uiProfile();
  const pk = prefixKeys().filter((k) => p.prefix && p.prefix[k] && p.prefix[k].box >= PREFIX_BOX_MAX);
  return { mk: pgMasteredKeys(p.items), pk };
}

function uiTimeStart() {
  const p = uiProfile();
  if (!coTimeAvailable(p)) return;
  const keys = uiTimeKeys();
  if (!keys.mk.length && !keys.pk.length) return;
  const now = Date.now();
  uiS.tc = { id: uiTabId + '-t' + now, end: now + TC_SECONDS * 1000, results: [], q: null, prevKey: null, wrong: null, timer: null, keys };
  uiTimeNext();
  uiS.screen = 'time';
  uiS.tc.timer = setInterval(uiTimeTick, 200);
}

function uiTimeNext() {
  const tc = uiS.tc;
  tc.q = tcMakeQuestion(uiRng, tc.keys.mk, tc.keys.pk, tc.prevKey);
  tc.prevKey = tc.q.key;
  tc.wrong = null;
}

function uiTimeTick() {
  const tc = uiS.tc;
  if (!tc) return;
  const left = Math.max(0, Math.ceil((tc.end - Date.now()) / 1000));
  const el = document.getElementById('tc-left');
  if (el) el.textContent = String(left);
  if (Date.now() >= tc.end) uiTimeFinish();
}

function uiTimeAnswer(i) {
  const tc = uiS.tc;
  if (!tc || tc.wrong || Date.now() >= tc.end || Date.now() < (tc.lockUntil || 0)) return;
  const o = tc.q.options[i];
  if (!o) return;
  tc.results.push(o.correct);
  if (o.correct) {
    uiTimeNext();
    tc.lockUntil = Date.now() + 200; // 正解の直後の二度押しを次の問題の答えにしない
  } else {
    tc.wrong = { i };
    const q = tc.q;
    setTimeout(() => {
      if (uiS.tc === tc && tc.q === q && Date.now() < tc.end) {
        uiTimeNext();
        uiRender();
      }
    }, TC_WRONG_SHOW_MS);
  }
  uiRender();
}

function uiTimeFinish() {
  const tc = uiS.tc;
  if (!tc) return;
  clearInterval(tc.timer);
  uiS.tc = null;
  const p = uiProfile();
  const today = pgToday();
  const sc = tcScore(tc.results);
  const points = tcPointsFor(sc.score, p.sessions, today);
  const session = {
    id: tc.id, date: today, mode: 'time', level: null, n: sc.n, correct: sc.correct, retried: 0, mid: null, right: null,
    points, score: sc.score, formula: sc.formula, totalBefore: p.total,
  };
  const r = storeApplyTime(uiS.data, uiS.pid, session);
  const bn = uiApplyBonuses(r.data, today);
  uiSave(bn.data);
  uiS.result = { time: true, session, newBest: r.newBest, bonuses: bn.got };
  uiS.screen = 'tresult';
  uiRender();
}

function uiTimeQuit() {
  if (uiS.tc) clearInterval(uiS.tc.timer);
  uiS.tc = null;
  uiS.screen = 'home';
}

function uiTime() {
  const tc = uiS.tc;
  const left = Math.max(0, Math.ceil((tc.end - Date.now()) / 1000));
  const sc = tcScore(tc.results);
  let h = '<div class="row"><span class="tc-left" id="tc-left">' + left + '</span><span>びょう</span><span style="flex:1"></span>';
  h += '<span class="stat">せいかい <b>' + sc.correct + '</b>　とくてん <b>' + sc.score + '</b></span>';
  h += '<button class="small" data-act="tcquit">やめる</button></div>';
  h += '<div class="qtext">' + uiEsc(tc.q.text) + '</div><div class="options">';
  tc.q.options.forEach((o, i) => {
    let cls = '';
    if (tc.wrong) cls = o.correct ? ' class="primary"' : i === tc.wrong.i ? ' class="tc-ng"' : '';
    h += '<button data-act="tcans" data-i="' + i + '"' + cls + (tc.wrong ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + uiEsc(o.label) + '</button>';

  if (tc.wrong) h += '<div class="fb hint">こたえは「' + uiEsc(tc.q.options.find((o) => o.correct).label) + '」</div>';

function uiResult() {

function uiRunSlot() {
  const res = uiS.result;
  if (!res || res.running) return;
  res.running = true;
  const reels = SLOT_SYMBOLS.map((x) => x.label);
  const reelsR = [...new Set(SLOT_REEL_RIGHT)].sort((a, b) => a - b).map((i) => SLOT_SYMBOLS[i].label);
  let tick = 0;
  const iv = setInterval(() => {
    tick += 1;
    const m = document.getElementById('reel-m');
    const r = document.getElementById('reel-r');
    if (m && res.phase < 1) m.textContent = reels[tick % reels.length];
    if (r && res.phase < 2) r.textContent = reelsR[(tick * 3) % reelsR.length];
  }, 90);
  setTimeout(() => { res.phase = 1; uiRender(); }, 1400);
  setTimeout(() => { res.phase = 2; uiRender(); }, 2400);
  setTimeout(() => { clearInterval(iv); res.phase = 3; uiRender(); }, 3000);
}

    h += '<div class="row">あたり' + (i + 1) + ': <input type="number" id="rs-yen-' + i + '" value="' + x.yen + '" min="0" step="1"> 円 × <input type="number" id="rs-w-' + i + '" value="' + x.w + '" min="1" step="1"> まい</div>';
  }
  h += '<div class="row">ラストワン（さいごの 1まい）: <input type="number" id="rs-last" value="' + (rs.last || 0) + '" min="0" step="1"> 円（0 なら なし）</div>';
  h += '<p class="muted">1はこ: <b>' + ev.den + ' まい・' + ev.num + ' 円</b>。1まいの きたいち: <b>' + ev.label + ' 円</b>。空の行は つかいません。中身を かえると、つぎに ひくときから あたらしい はこに なります。</p>';
  for (const pr of d.profiles) {
    const bx = rsCurrentBox(rs, pr.rbox);
    h += '<p class="muted">' + uiEsc(pr.name) + ': はこ ' + bx.no + ' ばんめ・のこり ' + (bx.left.reduce((s, x) => s + x, 0) + (bx.last ? 1 : 0)) + ' まい</p>';
  }
  h += '<p><button class="primary" data-act="rssave">ごほうびくじを ほぞん</button></p></div>';
  h += '<p><button data-act="who">← もどる</button></p></div>';
  return h;
}

function uiReadRewardSlotForm() {
  const num = (id) => {
    const el = document.getElementById(id);
    const v = el ? el.value.trim() : '';
    return v === '' ? null : Number(v);
  };
  const prizes = [];
  for (let i = 0; i < 10; i++) {
    const yen = num('rs-yen-' + i);
    const w = num('rs-w-' + i);
    if (yen === null && w === null) continue;
    prizes.push({ yen, w });
  }
  return { cost: num('rs-cost'), prizes, last: num('rs-last') || 0 };
}

function uiRunRewardSpin() {
  const sp = uiS.rspin;
  const labels = storeRewardSlot(uiS.data).prizes.map((x) => x.yen + '円');
  let t = 0;
  const iv = setInterval(() => {
    t += 1;
    const el = document.getElementById('rs-reel');
    if (el && !sp.shown) el.textContent = labels[t % labels.length];
  }, 90);
  setTimeout(() => {
    clearInterval(iv);
    if (uiS.rspin === sp) {
      sp.shown = true;
      uiRender();
    }
  }, 1800);
}

function uiDownload(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function uiReadRewardsForm() {
  const list = [];
  uiS.data.rewards.forEach((r, i) => {
    const name = document.getElementById('rw-name-' + i).value.trim();
    const cost = Number(document.getElementById('rw-cost-' + i).value);
    list.push({ id: r.id, name, cost });
  });
  return list;
}

function uiSaveRewards(list) {
  const bad = list.find((r) => !r.name || !Number.isInteger(r.cost) || r.cost < 1);
  if (bad) {
    uiS.adult.msg = 'なまえと ポイント（1いじょうの せいすう）を いれてください。';
    return;
  }
  if (uiSave(storeSetRewards(uiS.data, list))) uiS.adult.msg = 'ごほうびを ほぞん しました。';
}

// ---------- 描画とイベント ----------
function uiRender() {
  uiShowBanner();
  if (uiS.blocked) {
    uiApp.innerHTML = '<h1>ほかの まどで ひらいています</h1><p>この まどを とじてね。（2つの まどで つかうと、きろくが きえることが あります）</p>' +
      '<p class="muted">ほかの まどが ない ときは、5びょう まってから ひらきなおしてね。</p>';
    return;
  }
  if (uiS.mode === 'readonly') {
    uiApp.innerHTML = '<h1>あたらしい ばんで ひらいてね</h1><p>この きろくは、この アプリより あたらしい ばんで つくられています。この ばんでは きろくを みたり かえたり できません。</p>' +
      '<p class="muted">おとなの人へ: いまの きろくは そのまま のこっています。あたらしい ばんの ファイル（app_v○.html）を ひらいてください。ねんのため、もとの データを かきだせます。</p>' +
      '<p><button data-act="exportraw">もとの データを かきだす</button></p>';
    return;
  }
  const scr = uiS.screen;
  let h = '';
  if (scr === 'who') h = uiWho();
  else if (scr === 'home') h = uiHome();
  else if (scr === 'play') h = uiPlay();
  else if (scr === 'result') h = uiResult();
  else if (scr === 'rewards') h = uiRewards();
  else if (scr === 'adult') h = uiAdult();
  else if (scr === 'time') h = uiS.tc ? uiTime() : uiHome();
  else if (scr === 'tresult') h = uiTimeResult();
  else if (scr === 'mresult') h = uiS.result ? uiMemtestResult() : uiHome();
  uiApp.innerHTML = h;
  const ans = document.getElementById('ans');
  if (ans) ans.focus();
  if (scr === 'result') uiRunSlot();
  const imp = document.getElementById('importfile');
  if (imp) imp.addEventListener('change', uiOnImportFile);
}

function uiOnImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const r = storeParseImport(String(rd.result));
    if (!r.ok) {
      uiS.adult.msg = 'この ファイルは よみこめません: ' + uiEsc(r.errors.slice(0, 3).join(' / '));
      uiS.adult.importPlan = null;
    } else {
      uiS.adult.importPlan = { data: r.data, summary: storeImportSummary(uiS.data, r.data) };
      uiS.adult.msg = null;
    }
    uiRender();
  };
  rd.onerror = () => {
    uiS.adult.msg = 'ファイルを よめませんでした。';
    uiRender();
  };
  rd.readAsText(file);
}

function uiGoPick(pid) {
  uiS.pid = pid;
  const p = uiProfile();
  if (p.pending) {
    uiS.result = { session: p.pending, phase: 0 };
    uiS.screen = 'result';
  } else {
    uiS.screen = 'home';
  }
}

function uiOnClick(e) {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const a = uiS.adult;
  switch (act) {
    case 'pick': uiGoPick(b.dataset.id); break;
    case 'who': uiS.screen = 'who'; uiS.pid = null; a.ok = false; a.msg = null; a.importPlan = null; a.askSaved = false; break;
    case 'home': uiS.screen = 'home'; a.msg = null; break;
    case 'adult': uiS.screen = 'adult'; a.ok = false; break;
    case 'adultyes': a.ok = true; break;
    case 'start': uiStart(b.dataset.mode, Number(b.dataset.level) || null); break;
    case 'theme': uiSave(storeSetTheme(uiS.data, uiS.pid, b.dataset.id)); break;
    case 'hint':
      if (uiS.play && uiS.play.mode === 'memtest') break;
      if (uiS.play && uiS.play.isClock) uiS.play.ck = ckFlowHint(uiS.play.ck);
      else if (uiS.play && uiS.play.flow) uiS.play.flow = qFlowHint(uiS.play.flow);
      else if (uiS.play) uiS.play.drillHint = true;
      break;
    case 'quit':
      if (uiS.play && uiS.play.events && uiS.play.events.length) uiSave(storeAddLog(uiS.data, uiS.pid, uiS.play.events).data);
      uiS.play = null;
      uiS.screen = 'home';
      break;
    case 'choose': {
      const pl = uiS.play;
      if (pl.isClock) { pl.ck = ckFlowChoose(pl.ck, pl.q, Number(b.dataset.i)); uiClockAfter(); break; }
      if (pl.isMeaning) { uiMeaningChoose(Number(b.dataset.i)); break; }
      if (pl.mode === 'prefix') { uiPrefixChoose(Number(b.dataset.i)); break; }
      pl.flow = qFlowChoose(pl.flow, pl.q, Number(b.dataset.i));
      uiAfterFlow();
      break;
    }
    case 'key': {
      const el = document.getElementById(uiS.lastInput || 'ans') || document.getElementById('ans');
      if (el) {
        const k = b.dataset.k;
        el.value = k === '⌫' ? el.value.slice(0, -1) : el.value + k;
        el.focus();
      }
      return;
    }
    case 'submit': uiSubmit(); return;
    case 'tcans': uiTimeAnswer(Number(b.dataset.i)); return;
    case 'tcquit': uiTimeQuit(); break;
    case 'tresultdone': uiS.result = null; uiS.screen = 'home'; break;
    case 'jumpnow': uiSave(storeClearPending(uiS.data, uiS.pid)); uiS.result = null; uiS.screen = 'home'; uiStart('jump', Number(b.dataset.level)); break;
    case 'next': uiNext(); break;
    case 'mresultdone': uiS.result = null; uiS.screen = 'home'; break;
    case 'resultdone': uiSave(storeClearPending(uiS.data, uiS.pid)); uiS.result = null; uiS.screen = 'home'; break;
    case 'rewards': uiS.screen = 'rewards'; uiS.exchange = null; uiS.rsAsk = false; uiS.rspin = null; a.msg = null; break;
    case 'exchange': uiS.exchange = b.dataset.id; break;
    case 'excancel': uiS.exchange = null; break;
    case 'rsask': uiS.rsAsk = true; a.msg = null; break;
    case 'rscancel': uiS.rsAsk = false; break;
    case 'rsok': {
      uiS.rsAsk = false;
      const draw = rsDraw(uiRng, storeRewardSlot(uiS.data), uiProfile().rbox);
      const r = storeSpinReward(uiS.data, uiS.pid, draw, uiNowIso());
      // 保存できたときだけ回す（atomic）
      if (r.ok && uiSave(r.data, { atomic: true })) {
        uiS.rspin = { prize: r.prize, shown: false };
        uiRunRewardSpin();
      } else if (r.ok) a.msg = 'ほぞん できなかったので、まわすのを やめました。';
      break;
    }
    case 'rsdone': uiS.rspin = null; break;
    case 'rssave': {
      const cfg = uiReadRewardSlotForm();
      try {
        if (uiSave(storeSetRewardSlot(uiS.data, cfg), { atomic: true })) a.msg = 'ごほうびくじを ほぞん しました。';
        else a.msg = 'ほぞん できませんでした。';
      } catch (err) {
        a.msg = 'ごほうびくじの 入力を たしかめてください（' + uiEsc(err.message) + '）';
      }
      break;
    }
    case 'exok': {
      const r = storeExchange(uiS.data, uiS.pid, uiS.exchange, uiNowIso());
      if (r.ok && uiSave(r.data, { atomic: true })) a.msg = 'こうかん しました！';
      else if (r.ok) a.msg = 'ほぞん できなかったので、こうかんを やめました。';
      uiS.exchange = null;
      break;
    }
    case 'export': {
      uiDownload('keisan_backup_' + pgToday().replace(/-/g, '') + '.json', storeExportText(uiS.data));
      a.askSaved = true;
      break;
    }
    case 'savedyes': a.askSaved = false; if (uiSave(storeMarkExported(uiS.data, uiNowIso()))) a.msg = 'ほぞんを たしかめた日を きろく しました。'; break;
    case 'savedno': a.askSaved = false; a.msg = 'ほぞん できなかった ばあいは、もう いちど かきだしてください。'; break;
    case 'exportbroken': uiDownload('keisan_broken_' + pgToday().replace(/-/g, '') + '.txt', uiS.rawBroken || ''); break;
    case 'importcancel': a.importPlan = null; break;
    case 'importgo': {
      if (!a.importPlan) break;
      if (uiS.mode === 'normal' && !storeBackupBeforeImport(uiS.ctx.ls, uiS.data, Date.now())) {
        a.msg = 'いまの きろくを とっておけなかったので、よみこみを やめました。';
        a.importPlan = null;
        break;
      }
      const prev = uiS.data;
      const next = storeAdoptImported(a.importPlan.data, uiS.ctx.rev);
      if (uiSave(next, { atomic: true })) {
        a.msg = uiS.mode === 'normal' ? 'よみこみました。24じかん いないなら「とりけす」で もどせます。' : 'よみこみました。ただし この ブラウザでは きろくが のこりません。';
      } else {
        uiS.data = prev;
        if (uiS.mode === 'normal') storeClearBeforeImport(uiS.ctx.ls);
        a.msg = 'よみこみを ほぞん できませんでした。もとの きろくの ままです。';
      }
      a.importPlan = null;
      break;
    }
    case 'undoplan': {
      const old = storeReadBeforeImport(uiS.ctx.ls, Date.now());
      a.undoPlan = old ? { data: old, summary: storeImportSummary(uiS.data, old) } : null;
      break;
    }
    case 'undocancel': a.undoPlan = null; break;
    case 'undogo': {
      if (!a.undoPlan) break;
      if (uiSave(storeAdoptImported(a.undoPlan.data, uiS.ctx.rev), { atomic: true })) {
        storeClearBeforeImport(uiS.ctx.ls);
        a.msg = 'よみこみの まえに もどしました。';
      } else {
        a.msg = 'もどせませんでした。いまの きろくの ままです。';
      }
      a.undoPlan = null;
      break;
    }
    case 'exportraw': uiDownload('keisan_original_' + pgToday().replace(/-/g, '') + '.json', uiS.rawOriginal || ''); break;
    case 'rename': {
      const v = document.getElementById('name-' + b.dataset.id).value;
      try {
        if (uiSave(storeRename(uiS.data, b.dataset.id, v))) a.msg = 'なまえを かえました。';
      } catch (err) {
        a.msg = 'なまえは 1〜20もじ で いれてください。';
      }
      break;
    }
    case 'rwdel': {
      const list = uiReadRewardsForm();
      list.splice(Number(b.dataset.i), 1);
      uiSaveRewards(list);
      break;
    }
    case 'rwadd': {
      const list = uiReadRewardsForm();
      const name = document.getElementById('rw-name-new').value.trim();
      const cost = Number(document.getElementById('rw-cost-new').value);
      list.push({ id: 'r' + Date.now().toString(36), name, cost });
      uiSaveRewards(list);
      break;
    }
    case 'rwsave': uiSaveRewards(uiReadRewardsForm()); break;
    default: throw new Error('未知の操作 ' + act);
  }
  uiRender();
}

function uiOnKey(e) {
  if (uiS.blocked) return;
  const scr = uiS.screen;
  if (scr === 'play') {
    const pl = uiS.play;
    const inInput = e.target && /^ans\d*$/.test(e.target.id || '');
    if (inInput && e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) uiSubmit();
      return;
    }
    const done = pl.isClock ? pl.ck.stage === 'done' : pl.isWord ? pl.wd.show : pl.mode === 'drill' ? pl.drillShow : pl.mode === 'prefix' || pl.isMeaning ? pl.pf.done : pl.flow.stage === 'done';
    if (done && e.key === 'Enter') {
      if (e.repeat) return; // 押しっぱなしで答えを見ずに進まないようにする
      e.preventDefault();
      uiNext();
      uiRender();
      return;
    }
    if (pl.isClock && pl.ck.stage === 's1' && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      pl.ck = ckFlowChoose(pl.ck, pl.q, Number(e.key) - 1);
      uiClockAfter();
      uiRender();
      return;
    }
    if ((pl.mode === 'prefix' || pl.isMeaning) && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      if (pl.isMeaning) uiMeaningChoose(Number(e.key) - 1);
      else uiPrefixChoose(Number(e.key) - 1);
      uiRender();
      return;
    }
    if (pl.flow && pl.flow.stage === 's1' && /^[1-4]$/.test(e.key)) {
      // 押した数字が、次に出る②の入力欄に入らないようにする
      e.preventDefault();
      const i = Number(e.key) - 1;
      if (!pl.flow.disabled.includes(i)) {
        pl.flow = qFlowChoose(pl.flow, pl.q, i);
        uiAfterFlow();
        uiRender();
      }
    }
  } else if (scr === 'time' && uiS.tc && /^[1-4]$/.test(e.key) && !e.repeat) {
    e.preventDefault();
    uiTimeAnswer(Number(e.key) - 1);
  } else if ((scr === 'tresult' || scr === 'mresult') && e.key === 'Enter' && !e.repeat) {
    e.preventDefault();
    uiS.result = null;
    uiS.screen = 'home';
    uiRender();
  } else if (scr === 'result' && uiS.result && uiS.result.phase >= 3 && e.key === 'Enter' && !e.repeat) {
    e.preventDefault();
    uiSave(storeClearPending(uiS.data, uiS.pid));
    uiS.result = null;
    uiS.screen = 'home';
    uiRender();
  }
}

uiApp.addEventListener('click', (e) => {
  try {
    uiOnClick(e);
  } catch (err) {
    uiS.warnings.push('エラーが おきました: ' + uiEsc(String(err && err.message ? err.message : err)));
    uiShowBanner();
    throw err;
  }
});
document.addEventListener('keydown', uiOnKey);
// テンキーで入れる欄（じかん の 答えが2つの問題）: 最後に触った欄
document.addEventListener('focusin', (e) => {
  if (e.target && /^ans\d*$/.test(e.target.id || '')) uiS.lastInput = e.target.id;
});
// 日をまたいで開いたままでも、ホームの「きょうの れんしゅう」・もくひょうを今日の内容にする（D-014 の確認で発見）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && uiS.screen === 'home' && !uiS.blocked) uiRender();
});
window.addEventListener('focus', () => {
  if (uiS.screen === 'home' && !uiS.blocked) uiRender();
});
uiInitStore();
uiRender();

}
})();
</script>
