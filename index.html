html, body { margin: 0; background: var(--bg); color: var(--fg); }

}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }

<script>
(function () {
'use strict';
// ---- src/logic/decimal.js ----
// decimal.js — 10進数を「整数の数字列 int × 10^-scale」で表す。浮動小数は使わない。
// 負の数は扱わない。設計 docs/02_design.md §2

function decMake(int, scale) {
  let s = String(int).replace(/^0+(?=\d)/, '');
  let sc = scale;
  if (!/^\d+$/.test(s) || !Number.isInteger(sc) || sc < 0) {
    throw new Error('decMake: 不正な値 ' + int + ' / ' + scale);
  }
  while (sc > 0 && s.length > 1 && s.endsWith('0')) {
    s = s.slice(0, -1);
    sc -= 1;
  }
  if (sc > 0 && s === '0') sc = 0;
  return { int: s, scale: sc };
}

// ×10^k（k<0 なら ÷10^|k|）
function decShift(x, k) {
  let sc = x.scale - k;
  let s = x.int;
  if (sc < 0) {
    s = s + '0'.repeat(-sc);
    sc = 0;
  }
  return decMake(s, sc);
}

function decToString(x) {
  if (x.scale === 0) return x.int;
  const s = x.int.padStart(x.scale + 1, '0');
  return s.slice(0, s.length - x.scale) + '.' + s.slice(s.length - x.scale);
}

function decFromString(str) {
  const m = /^(\d+)(?:\.(\d+))?$/.exec(str);
  if (!m) throw new Error('decFromString: 不正な値 ' + str);
  const frac = m[2] || '';
  return decMake(m[1] + frac, frac.length);
}

// 子供の入力を正規化する。読めなければ null。
function decParseInput(str) {
  if (typeof str !== 'string') return null;
  let s = str.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  s = s.replace(/[．。]/g, '.');
  s = s.replace(/[,、，\s　]/g, '');
  if (!/\d/.test(s)) return null;
  if (s.startsWith('.')) s = '0' + s;
  if (s.endsWith('.')) s = s.slice(0, -1);
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return decFromString(s);
}

function decEquals(a, b) {
  return a.int === b.int && a.scale === b.scale;
}

// 整数部の桁数（0.5 なら 1）と小数部の桁数
function decDigits(x) {
  const s = decToString(x);
  const [i, f] = s.split('.');
  return { intDigits: i.length, fracDigits: f ? f.length : 0 };
}

// 分母が 2 と 5 の積だけの分数 num/den（整数）を正確な小数にする
function decFromFraction(num, den) {
  if (!Number.isInteger(num) || !Number.isInteger(den) || num < 0 || den <= 0) {
    throw new Error('decFromFraction: 不正な値 ' + num + '/' + den);
  }
  const g = decGcd(num, den) || 1;
  let n = num / g;
  const dd = den / g;
  let rest = dd;
  while (rest % 2 === 0) rest /= 2;
  while (rest % 5 === 0) rest /= 5;
  if (rest !== 1) throw new Error('decFromFraction: 有限小数にならない ' + num + '/' + den);
  let scale = 0;
  while (n % dd !== 0) {
    n *= 10;
    scale += 1;
    if (scale > 12) throw new Error('decFromFraction: 桁が多すぎる');
  }
  return decMake(String(n / dd), scale);
}

function decGcd(a, b) {
  while (b) {
    const t = a % b;
    a = b;
    b = t;
  }
  return a;
}

// ---- src/logic/units.js ----
// units.js — 単位と換算係数。係数はこのファイルだけに置く（CLAUDE.md 禁止事項）。
// 指数は基準単位からの 10 の累乗。設計 docs/02_design.md §3

const UNIT_LEVELS = {
  1: { name: 'ながさ', base: 'mm', units: { mm: 0, cm: 1, m: 3, km: 6 } },
  2: { name: 'めんせき', base: 'cm²', units: { 'cm²': 0, 'm²': 4, a: 6, ha: 8, 'km²': 10 } },
  3: { name: 'たいせき・かさ', base: 'mL', units: { mL: 0, 'cm³': 0, dL: 2, L: 3, kL: 6, 'm³': 6 } },
};

// small: 指数の小さい（または等しい）単位、large: 大きい単位。dim: 長さと取り違えたときの指数
const UNIT_PAIRS = [
  { level: 1, small: 'mm', large: 'cm' },
  { level: 1, small: 'cm', large: 'm' },
  { level: 1, small: 'm', large: 'km' },
  { level: 1, small: 'mm', large: 'm' },
  { level: 2, small: 'm²', large: 'a' },
  { level: 2, small: 'a', large: 'ha' },
  { level: 2, small: 'ha', large: 'km²' },
  { level: 2, small: 'cm²', large: 'm²', dim: 2 },
  { level: 2, small: 'm²', large: 'ha' },
  { level: 2, small: 'm²', large: 'km²', dim: 3 },
  { level: 3, small: 'dL', large: 'L' },
  { level: 3, small: 'mL', large: 'dL' },
  { level: 3, small: 'mL', large: 'L' },
  { level: 3, small: 'L', large: 'kL' },
  { level: 3, small: 'cm³', large: 'L' },
  { level: 3, small: 'L', large: 'm³' },
  { level: 3, small: 'cm³', large: 'mL' },
  { level: 3, small: 'kL', large: 'm³' },
  { level: 3, small: 'cm³', large: 'm³', dim: 2 },
];

function unitExp(level, unit) {
  const lv = UNIT_LEVELS[level];
  if (!lv || !(unit in lv.units)) throw new Error('unitExp: 未知の単位 ' + level + ':' + unit);
  return lv.units[unit];
}

// 項目（向きつき）。dir: 'x' は掛ける（大→小）、'd' は割る（小→大）。k=0 は 'x'（×1）
function unitItemsAll() {
  const items = [];
  for (const p of UNIT_PAIRS) {
    const k = unitExp(p.level, p.large) - unitExp(p.level, p.small);
    if (k < 0) throw new Error('unitItemsAll: small/large が逆 ' + p.small + '/' + p.large);
    const dim = p.dim || null;
    items.push({ key: p.level + ':' + p.large + '>' + p.small, level: p.level, from: p.large, to: p.small, k, dir: 'x', dim });
    items.push({ key: p.level + ':' + p.small + '>' + p.large, level: p.level, from: p.small, to: p.large, k, dir: k === 0 ? 'x' : 'd', dim });
  }
  return items;
}

function unitItems(level) {
  return unitItemsAll().filter((it) => it.level === level);
}

function unitItemByKey(key) {
  const it = unitItemsAll().find((x) => x.key === key);
  if (!it) throw new Error('unitItemByKey: 未知の項目 ' + key);
  return it;
}

// はしごの図に使う、レベルの単位を大きい順に並べたもの（同じ指数はまとめる）
function unitLadder(level) {
  const lv = UNIT_LEVELS[level];
  const groups = {};
  for (const [u, e] of Object.entries(lv.units)) {
    (groups[e] = groups[e] || []).push(u);
  }
  return Object.keys(groups)
    .map(Number)
    .sort((a, b) => b - a)
    .map((e) => ({ exp: e, units: groups[e] }));
}

// ---- src/logic/question.js ----
// question.js — 問題生成、①の選択肢、1問の流れ（必ず終わる状態機械）。設計 §4・§5

// 乱数: rng.int(n) は 0..n-1 の整数を返す。本番は crypto の Uint32 を棄却法で使う
function rngCrypto() {
  const buf = new Uint32Array(1);
  return {
    int(n) {
      if (!Number.isInteger(n) || n <= 0) throw new Error('rng.int: 不正な n ' + n);
      const limit = Math.floor(0x100000000 / n) * n;
      for (;;) {
        globalThis.crypto.getRandomValues(buf);
        if (buf[0] < limit) return buf[0] % n;
      }
    },
  };
}

function qPick(rng, arr) {
  if (!arr.length) throw new Error('qPick: 空の配列');
  return arr[rng.int(arr.length)];
}

function qShuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 補助段階と k から使える数の型
function qAllowedTypes(support, k) {
  // D-014: 小数（c・d）は段階1から出す
  const t = support >= 2 ? ['a'] : ['a', 'b', 'c', 'd'];
  return k >= 4 ? t.filter((x) => x !== 'b') : t;
}

// 型ごとの小さい側の数 s
function qMakeS(rng, type) {
  if (type === 'a') return decMake(String(1 + rng.int(9)), 0);
  if (type === 'b') return decMake(String(10 + rng.int(990)), 0);
  if (type === 'c') {
    // 0.1〜9.9 で整数にならないもの: 1..99 のうち 10 の倍数を除く 90 通り
    let v = 1 + rng.int(90);
    v = v + Math.floor((v - 1) / 9); // 1..9,11..19,...,91..99
    return decMake(String(v), 1);
  }
  if (type === 'd') {
    // 小数第2位・第3位（D-014）: v ÷ 10^p、p は 2 か 3、v は 1〜10^p−1 で 10 の倍数を除く
    const p = 2 + rng.int(2);
    const n = 10 ** p;
    let v = 1 + rng.int(n - n / 10); // 10 の倍数を除いた個数
    v = v + Math.floor((v - 1) / 9);
    return decMake(String(v), p);
  }
  throw new Error('qMakeS: 未知の型 ' + type);
}

function qOpLabel(op) {
  if (op.k === 0) return '×1（そのまま）';
  return (op.dir === 'x' ? '×' : '÷') + '1' + '0'.repeat(op.k);
}

function qApplyOp(value, op) {
  return decShift(value, op.dir === 'x' ? op.k : -op.k);
}

// ①の選択肢（正解1＋誤り3）。誤りには種類 t を付ける
function qOptions(rng, item) {
  const k = item.k;
  const D = item.dir;
  const opp = D === 'x' ? 'd' : 'x';
  const correct = { dir: D, k, t: null, correct: true };
  let cands;
  if (k === 0) {
    cands = [{ dir: 'x', k: 1, t: 'mag' }, { dir: 'd', k: 1, t: 'dir' }, { dir: 'x', k: 3, t: 'mag' }];
  } else {
    cands = [{ dir: opp, k, t: 'dir' }];
    if (item.dim) cands.push({ dir: D, k: item.dim, t: 'dim' });
    cands.push({ dir: D, k: k + 1, t: 'mag' });
    if (k - 1 >= 1) cands.push({ dir: D, k: k - 1, t: 'mag' });
    cands.push({ dir: opp, k: k + 1, t: 'dir' });
    if (item.dim) cands.push({ dir: opp, k: item.dim, t: 'dir' });
    cands.push({ dir: D, k: k + 2, t: 'mag' });
  }
  const seen = new Set([D + k]);
  const wrong = [];
  for (const c of cands) {
    const id = c.dir + c.k;
    if (seen.has(id)) continue;
    seen.add(id);
    wrong.push({ ...c, correct: false });
    if (wrong.length === 3) break;
  }
  if (wrong.length !== 3) throw new Error('qOptions: 誤りの選択肢が3つそろわない ' + item.key);
  return qShuffle(rng, [correct, ...wrong]).map((o) => ({ ...o, label: qOpLabel(o) }));
}

// 問題を作る。item は units.js の項目
function qMakeQuestion(rng, item, support) {
  const type = qPick(rng, qAllowedTypes(support, item.k));
  const s = qMakeS(rng, type);
  const op = { dir: item.dir, k: item.k };
  let value, answer;
  if (item.dir === 'x') {
    value = s;
    answer = qApplyOp(s, op);
  } else {
    answer = s;
    value = decShift(s, item.k);
  }
  return {
    key: item.key, level: item.level, from: item.from, to: item.to, k: item.k, dir: item.dir, dim: item.dim,
    type, value, answer, op, options: qOptions(rng, item),
  };
}

// 倍率ドリルの問題。drillLevel 1: k=1..3、2: k=1,2,3,4,6
function qMakeDrill(rng, drillLevel) {
  const ks = drillLevel === 2 ? [1, 2, 3, 4, 6] : [1, 2, 3];
  const k = qPick(rng, ks);
  const dir = qPick(rng, ['x', 'd']);
  const type = qPick(rng, k >= 4 ? ['a', 'c'] : ['a', 'b', 'c']);
  const s = qMakeS(rng, type);
  const op = { dir, k };
  const value = dir === 'x' ? s : decShift(s, k);
  const answer = qApplyOp(value, op);
  return { drill: true, key: 'drill:' + dir + k, k, dir, type, value, answer, op };
}

function qCheck(input, answer) {
  const v = decParseInput(input);
  if (v === null) return 'invalid';
  return decEquals(v, answer) ? 'ok' : 'ng';
}

// ---- 1問の流れ（状態機械） ----
// stage: 's1'（①）→ 's2'（②）→ 'done'。段階0は 'direct' から始まり、誤答で 's1' へ
function qFlowStart(q, support) {
  return {
    stage: support === 0 ? 'direct' : 's1',
    disabled: [],
    s2Errors: 0,
    first: null, // 最初の誤答: 'e1' | 'e2' | 'e0'
    errType: null, // ①で最初に選んだ誤りの種類
    hint: false,
    showAnswer: false,
    feedback: null,
  };
}

function qFlowHint(flow) {
  return { ...flow, hint: true };
}

// ①: 選択肢の番号を受け取る
function qFlowChoose(flow, q, idx) {
  if (flow.stage !== 's1') throw new Error('qFlowChoose: ①の段階ではない');
  if (flow.disabled.includes(idx)) return { ...flow, feedback: { kind: 'disabled' } };
  const opt = q.options[idx];
  if (!opt) throw new Error('qFlowChoose: 不正な番号 ' + idx);
  if (opt.correct) return { ...flow, stage: 's2', feedback: { kind: 'ok1' } };
  const f = { ...flow, disabled: [...flow.disabled, idx], feedback: { kind: 'ng1', t: opt.t } };
  if (!f.first) {
    f.first = 'e1';
    f.errType = opt.t;
  }
  return f;
}

// ②または直接: 入力文字列を受け取る
function qFlowInput(flow, q, input) {
  if (flow.stage !== 's2' && flow.stage !== 'direct') throw new Error('qFlowInput: 入力の段階ではない');
  const res = qCheck(input, q.answer);
  if (res === 'invalid') return { ...flow, feedback: { kind: 'invalid' } };
  if (res === 'ok') return { ...flow, stage: 'done', feedback: { kind: 'ok' } };
  if (flow.stage === 'direct') {
    return { ...flow, stage: 's1', first: flow.first || 'e0', feedback: { kind: 'ng0' } };
  }
  const f = { ...flow, s2Errors: flow.s2Errors + 1 };
  if (!f.first) f.first = 'e2';
  if (f.s2Errors >= 2) return { ...f, stage: 'done', showAnswer: true, feedback: { kind: 'ng2final', answer: decToString(q.answer) } };
  return { ...f, feedback: { kind: 'ng2' } };
}

// 1問の記録（最初の挑戦の結果）。終わったときに呼ぶ
function qFlowRecord(flow, support) {
  if (flow.stage !== 'done') throw new Error('qFlowRecord: まだ終わっていない');
  return { r: flow.first || 'ok', t: flow.first === 'e1' ? flow.errType : null, s: support, h: flow.hint };
}

// 最初の誤答が起きた時点の記録（途中で「やめる」を押しても残すため）。誤答がまだ無ければ null
function qFlowFirstRecord(flow, support) {
  if (!flow.first) return null;
  return { r: flow.first, t: flow.first === 'e1' ? flow.errType : null, s: support, h: flow.hint };
}

// 「やりなおして できた」に数えるか（誤答はあったが答えを見ずに解けた）
function qFlowRetried(flow) {
  return flow.stage === 'done' && !!flow.first && !flow.showAnswer;
}

// ---- src/logic/progress.js ----
// progress.js — 項目ごとの記録、補助段階、苦手、確認、出題の選び方。設計 §5

const PG_STREAK_TO_DOWN = 2; // rev4（v1〜v4 は 3）。設計 §13.3
const PG_RECENT_MAX = 5;
const PG_CHECK_INTERVAL_DAYS = 7;
const PG_SESSION_SIZE = 5;
const PG_MAX_CHECKS = 2; // rev4（v2〜v4 は 1）
const PG_SLIP_DAYS = 14; // うっかりミスとして扱う間隔。設計 §13.4
const PG_PROBE_MAX = 2; // 1回の ためし問題 の上限。設計 §13.2

// 端末の現地時刻での日付 YYYY-MM-DD
function pgToday(date) {
  const d = date || new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function pgDaysBetween(a, b) {
  const pa = a.split('-').map(Number);
  const pb = b.split('-').map(Number);
  const ta = Date.UTC(pa[0], pa[1] - 1, pa[2]);
  const tb = Date.UTC(pb[0], pb[1] - 1, pb[2]);
  return Math.round((tb - ta) / 86400000);
}

function pgNewItem() {
  return { support: 2, streak: 0, placeAid: false, placeOk: 0, weak: false, attempts: 0, lastSeen: null, confirmedAt: null, recent: [] };
}

// 1問の記録を追加した新しい状態を返す。rec: { r, t, s, h }、isCheck: 確認として出した問題か
// できた ＝ 段階0・別の日の確認に合格・苦手でない。設計 §13.1
function pgMastered(st) {
  return !!st && st.support === 0 && !!st.confirmedAt && !st.weak;
}

function pgRecord(state, rec, today, isCheck) {
  const prev = state || pgNewItem();
  const st = { ...prev };
  // うっかりミス（できた 項目の誤答で、前のうっかりから14日以上）。設計 §13.4
  const slip = rec.r !== 'ok' && pgMastered(prev) && (!prev.slipAt || pgDaysBetween(prev.slipAt, today) >= PG_SLIP_DAYS);
  st.recent = [...st.recent, rec].slice(-PG_RECENT_MAX);
  st.attempts += 1;
  st.lastSeen = today;

  // 補助段階
  if (slip) {
    st.streak = 0;
    st.slipAt = today;
  } else if (rec.r === 'ok') {
    if (!rec.h) {
      if (st.support > 0) {
        st.streak += 1;
        if (st.streak >= PG_STREAK_TO_DOWN) {
          st.support -= 1;
          st.streak = 0;
        }
      } else {
        st.streak = Math.min(st.streak + 1, PG_STREAK_TO_DOWN);
      }
    }
  } else if (rec.r === 'e1' || rec.r === 'e0') {
    st.streak = 0;
    st.support = Math.min(2, st.support + 1);
  } else if (rec.r === 'e2') {
    st.streak = 0;
    if (st.support === 0) st.support = 1;
  } else {
    throw new Error('pgRecord: 未知の結果 ' + rec.r);
  }

  // 苦手（状態遷移。追加した1件の種類で決める）
  if (rec.r !== 'ok') {
    st.weak = true;
  } else if (st.weak) {
    const last2 = st.recent.slice(-2);
    if (last2.length === 2 && last2.every((x) => x.r === 'ok' && !x.h) && last2[1].s <= 1) st.weak = false;
  }

  // 守り1: 段階が上がった・うっかりのときは確認をやり直す。守り2: 確認の合格はヒントなしの正解だけ。設計 §13.1
  // 確認は段階0で得たものだけ有効（v4 までの記録の段階1・2の confirmedAt も、段階0に下がったときに消す。レビュー R-006）
  if (slip || st.support > prev.support || (prev.support > 0 && st.support === 0)) st.confirmedAt = null;
  // 合格は「段階0のまま・今日まだ触れていない項目・ヒントなしの正解」だけ（同じ回の2回目以降で合格しない。R-006）
  if (isCheck && rec.r === 'ok' && !rec.h && prev.support === 0 && st.support === 0 && prev.lastSeen !== today) st.confirmedAt = today;
  return st;
}

// ためし問題（初めて出す項目を段階0で出した結果）の記録。設計 §13.2
function pgRecordProbe(rec, today) {
  const st = pgNewItem();
  st.support = rec.r === 'ok' && !rec.h ? 1 : 2;
  st.attempts = 1;
  st.lastSeen = today;
  st.recent = st.support === 1 ? [rec] : []; // 誤り・ヒントは「最近の誤り」に数えない（R-006）
  return st;
}

// ②（計算）の結果で位取り表の常時表示を切り替える。1問につき1回、①の結果とは別に呼ぶ
// ok=false: ②で誤答した → 常時表示にする。ok=true かつヒントなし: 2回続いたら外す。ヒント付きの正解は数えない
function pgPlace(state, ok, hint) {
  const st = { ...(state || pgNewItem()) };
  if (!ok) {
    st.placeAid = true;
    st.placeOk = 0;
  } else if (st.placeAid && !hint) {
    st.placeOk += 1;
    if (st.placeOk >= 2) {
      st.placeAid = false;
      st.placeOk = 0;
    }
  }
  return st;
}

// 保護者画面の印
function pgMarks(state) {
  const errs = state.recent.filter((x) => x.r !== 'ok');
  const e1 = errs.filter((x) => x.r === 'e1' || x.r === 'e0').length;
  const e2 = errs.filter((x) => x.r === 'e2').length;
  const dim = errs.filter((x) => x.t === 'dim').length;
  return {
    stage: errs.length === 0 ? null : e1 >= e2 ? 'unit' : 'calc',
    dimConfusion: dim >= 1 && dim * 2 >= errs.length,
    errorProne: errs.length >= 2,
  };
}

function pgIsCheckDue(state, today) {
  if (!state || state.support !== 0 || !state.lastSeen) return false;
  if (pgDaysBetween(state.lastSeen, today) < 1) return false;
  if (!state.confirmedAt) return true;
  return pgDaysBetween(state.confirmedAt, today) >= PG_CHECK_INTERVAL_DAYS;
}

function pgWeight(state) {
  if (!state || state.attempts === 0) return 3;
  if (state.weak) return 3;
  if (state.support === 2) return 2;
  if (state.support === 1) return 1;
  return 0; // 段階0（苦手でない）は後日の確認で出すので、通常の出題からは外す。設計 §13.3（rev4）
}

function pgWeighted(rng, list, weightOf) {
  const total = list.reduce((s, x) => s + weightOf(x), 0);
  let r = rng.int(total);
  for (const x of list) {
    r -= weightOf(x);
    if (r < 0) return x;
  }
  throw new Error('pgWeighted: 到達しない');
}

// 通常の学習: 出題する項目キーの列 [{ key, isCheck }]
function pgPickNormal(rng, items, level, today) {
  const keys = unitItems(level).map((it) => it.key);
  const out = [];
  const due = keys.filter((k) => pgIsCheckDue(items[k], today));
  const checks = [];
  const pool = due.slice();
  while (checks.length < PG_MAX_CHECKS && pool.length) {
    const i = rng.int(pool.length);
    checks.push(pool.splice(i, 1)[0]);
  }
  for (const k of checks) out.push({ key: k, isCheck: true });
  let prev = out.length ? out[out.length - 1].key : null;
  while (out.length < PG_SESSION_SIZE) {
    const cands = keys.filter((k) => k !== prev);
    // 段階0（重み0）以外が直前の1つだけなら、同じ項目が続いてよい。レベル全体が段階0のときだけ均等に出す（R-006）
    const pos = (list) => list.some((x) => pgWeight(items[x]) > 0);
    const pool = pos(cands) ? cands : pos(keys) ? keys : null;
    const k = pool ? pgWeighted(rng, pool, (x) => pgWeight(items[x])) : pgWeighted(rng, cands, () => 1);
    out.push({ key: k, isCheck: false });
    prev = k;
  }
  // 確認を先頭に固めないよう並べ替える（続けて同じ項目にならない範囲で）
  return pgMarkProbes(pgSpread(rng, out), items);
}

// 記録の無い項目の、その回で最初の出現に isProbe を付ける（最大 PG_PROBE_MAX）。設計 §13.2
function pgMarkProbes(list, items) {
  const seen = new Set();
  let n = 0;
  return list.map((x) => {
    const first = !seen.has(x.key);
    seen.add(x.key);
    if (first && !items[x.key] && !x.isCheck && n < PG_PROBE_MAX) {
      n += 1;
      return { ...x, isProbe: true };
    }
    return { ...x, isProbe: false };
  });
}

// レベルの進み。設計 §13.1
function pgLevelProgress(items, level) {
  const out = { total: 0, mastered: 0, weak: 0, learning: 0, fresh: 0 };
  for (const it of unitItems(level)) {
    const st = items[it.key];
    out.total += 1;
    if (pgMastered(st)) out.mastered += 1;
    else if (st && st.weak) out.weak += 1;
    else if (st && st.attempts > 0) out.learning += 1;
    else out.fresh += 1;
  }
  return out;
}

// 1問の記録の前後から出来事を作る（before が無い＝ためし問題のときは出さない）。設計 §13.5
function pgEvents(before, after) {
  if (!before) return [];
  const ev = [];
  if (before.support === 2 && after.support === 1) ev.push('nofig');
  if (before.support > 0 && after.support === 0) ev.push('direct'); // 段階2 → 0 は ほじょなしで チャレンジ（§13.13）
  if (!pgMastered(before) && pgMastered(after)) ev.push('mastered');
  if (before.weak && !after.weak) ev.push('overcome');
  return ev;
}

// 出来事が無いときに出す次の一歩（1つ）。設計 §13.5
function pgNextStep(items, level) {
  const its = unitItems(level);
  let best = null;
  its.forEach((it, i) => {
    const st = items[it.key];
    if (!st || st.support === 0) return;
    const rest = PG_STREAK_TO_DOWN - st.streak;
    const cand = { key: it.key, kind: st.support === 2 ? 'nofig' : 'direct', rest, support: st.support, i };
    if (!best || cand.rest < best.rest || (cand.rest === best.rest && (cand.support < best.support || (cand.support === best.support && cand.i < best.i)))) best = cand;
  });
  if (best) return { key: best.key, kind: best.kind, rest: best.rest };
  const wait = its.find((it) => items[it.key] && items[it.key].support === 0 && !items[it.key].confirmedAt);
  return wait ? { key: wait.key, kind: 'check', rest: 0 } : null;
}

function pgMasteredKeys(items) {
  return unitItemsAll().map((it) => it.key).filter((k) => pgMastered(items[k]));
}

// レベル4: できた 項目から5問。古いものほど重く（日数+1、上限8）、同じ項目を続けない。設計 §13.7
function pgPickL4(rng, items, today) {
  const keys = pgMasteredKeys(items);
  if (keys.length < PG_SESSION_SIZE) return [];
  const w = (k) => Math.min(8, Math.max(0, pgDaysBetween(items[k].lastSeen || today, today)) + 1);
  const out = [];
  let prev = null;
  while (out.length < PG_SESSION_SIZE) {
    const k = pgWeighted(rng, keys.filter((x) => x !== prev), w);
    out.push({ key: k, isCheck: !out.some((x) => x.key === k), isProbe: false });
    prev = k;
  }
  return out;
}

// レベル4を選べる条件: 各レベルで できた が半分以上（切り上げ）。設計 §13.7
function pgL4Ready(items) {
  return [1, 2, 3].every((lv) => {
    const g = pgLevelProgress(items, lv);
    return g.mastered >= Math.ceil(g.total / 2);
  });
}

function pgL4Need(items) {
  let need = 0;
  for (const lv of [1, 2, 3]) {
    const g = pgLevelProgress(items, lv);
    need += Math.max(0, Math.ceil(g.total / 2) - g.mastered);
  }
  return need;
}

function pgSpread(rng, list) {
  for (let attempt = 0; attempt < 20; attempt++) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = rng.int(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    if (a.every((x, i) => i === 0 || a[i - 1].key !== x.key)) return a;
  }
  return list; // 元の列は「続けて同じ項目にしない」で作ってある
}

function pgWeakKeys(items) {
  return unitItemsAll()
    .map((it) => it.key)
    .filter((k) => items[k] && items[k].weak);
}

// 苦手復習: 始めた時点の苦手の一覧から、件数×2（上限 PG_SESSION_SIZE）問
function pgPickReview(rng, items) {
  const weak = pgWeakKeys(items);
  if (weak.length === 0) return [];
  const n = Math.min(PG_SESSION_SIZE, weak.length * 2);
  const out = [];
  let prev = null;
  while (out.length < n) {
    const cands = weak.length >= 2 ? weak.filter((k) => k !== prev) : weak;
    const k = qPick(rng, cands);
    out.push({ key: k, isCheck: false });
    prev = k;
  }
  return out;
}

// ほじょなしで チャレンジ（設計 §13.13）: 候補は苦手でなく、段階1・2または記録なし
function pgJumpKeys(items, level) {
  return unitItems(level).map((it) => it.key).filter((k) => !items[k] || (!items[k].weak && items[k].support > 0));
}

function pgPickJump(rng, items, level) {
  const keys = pgJumpKeys(items, level);
  if (!keys.length) return [];
  const w = (k) => (!items[k] || items[k].support === 2 ? 2 : 1);
  const out = [];
  let prev = null;
  while (out.length < PG_SESSION_SIZE) {
    const cands = keys.length >= 2 ? keys.filter((k) => k !== prev) : keys;
    const k = pgWeighted(rng, cands, w);
    out.push({ key: k, isCheck: false, isProbe: false, isJump: true });
    prev = k;
  }
  return out;
}

// ほじょなしで チャレンジの記録。正解で段階0（確認は別の日）。誤答・ヒントは罰しない
function pgRecordJump(state, rec, today) {
  if (!state) {
    const st0 = pgRecordProbe(rec, today);
    return rec.r === 'ok' && !rec.h ? { ...st0, support: 0 } : st0;
  }
  const st = { ...state, attempts: state.attempts + 1, lastSeen: today };
  if (rec.r === 'ok' && !rec.h) {
    st.support = 0;
    st.confirmedAt = null; // 確認は別の日に段階0で（R-006）
    st.streak = 0;
    st.recent = [...state.recent, rec].slice(-PG_RECENT_MAX);
  }
  return st;
}

// ---- src/logic/slot.js ----
// slot.js — スロットのリール、抽選、ポイント計算（分数・整数だけ）、称号と絵柄。設計 §6・§7

// 目（中央と右のリールで共通）
const SLOT_SYMBOLS = [
  { n: 1, d: 10, label: '1/10' },
  { n: 1, d: 5, label: '1/5' },
  { n: 1, d: 2, label: '1/2' },
  { n: 1, d: 1, label: '1' },
  { n: 2, d: 1, label: '2' },
  { n: 5, d: 1, label: '5' },
  { n: 10, d: 1, label: '10' },
];

// 中央のリール: 20コマの並び（SLOT_SYMBOLS の番号）。1/10×1, 1/5×2, 1/2×4, 1×6, 2×4, 5×2, 10×1。隣どうしが同じ目にならない
const SLOT_REEL = [3, 2, 4, 3, 5, 2, 3, 0, 4, 3, 1, 2, 4, 3, 6, 2, 3, 5, 4, 1];
// 右のリール: 13コマ。1×6, 2×4, 5×2, 10×1（÷1/10 などの大当たりを無くす。D-011、保護者の決定）。1回の最大は 5 × 10 ÷ 1 ＝ 50
const SLOT_REEL_RIGHT = [3, 4, 3, 5, 3, 4, 3, 6, 3, 4, 3, 5, 4];

// ドリルのあとにもスロットをまわすか（D-005 仮決め。保護者の判断待ち）
const SLOT_DRILL_GIVES_SLOT = true;

// ポイント ＝ 正解数 × 中央 ÷ 右 を四捨五入（0.5 切り上げ）。正解数 ≥ 1 なら最低 1
function slotCompute(correct, mi, ri) {
  if (!Number.isInteger(correct) || correct < 0 || correct > 10) throw new Error('slotCompute: 正解数が不正 ' + correct);
  const m = SLOT_SYMBOLS[mi];
  const r = SLOT_SYMBOLS[ri];
  if (!m || !r) throw new Error('slotCompute: 目が不正');
  const num = correct * m.n * r.d;
  const den = m.d * r.n;
  const a = 2 * num + den;
  const b = 2 * den;
  const rounded = (a - (a % b)) / b; // 整数の割り算（切り捨て）
  const points = correct >= 1 ? Math.max(1, rounded) : 0;
  let note = 'exact';
  if (correct === 0) note = 'zero';
  else if (points !== rounded) note = 'min';
  else if (num % den !== 0) note = 'round';
  return { num, den, raw: decToString(decFromFraction(num, den)), rounded, points, note };
}

function slotFormula(correct, mi, ri) {
  const res = slotCompute(correct, mi, ri);
  const base = correct + ' × ' + SLOT_SYMBOLS[mi].label + ' ÷ ' + SLOT_SYMBOLS[ri].label + ' ＝ ' + res.raw;
  if (res.note === 'round') return base + ' → ' + res.points + '（ししゃごにゅう）';
  if (res.note === 'min') return base + ' → ' + res.points + '（さいてい 1てん）';
  return base;
}

// 抽選。rng.int(n) は偏りのない整数
function slotSpin(rng, correct) {
  const midPos = rng.int(SLOT_REEL.length);
  const rightPos = rng.int(SLOT_REEL_RIGHT.length);
  const mi = SLOT_REEL[midPos];
  const ri = SLOT_REEL_RIGHT[rightPos];
  return { correct, midPos, rightPos, mi, ri, ...slotCompute(correct, mi, ri), formula: slotFormula(correct, mi, ri) };
}

// 称号は段位（coach.js の CO_RANKS、D-013）に置き換えた

// スロットの色のテーマ（累計で増える）
const SLOT_THEMES = [
  { id: 'basic', min: 0, name: 'きほん' },
  { id: 'sky', min: 100, name: 'そら' },
  { id: 'forest', min: 500, name: 'もり' },
  { id: 'gold', min: 2000, name: 'きんいろ' },
];

function slotThemesFor(total) {
  return SLOT_THEMES.filter((t) => total >= t.min);
}

// ---------- ごほうびの くじの箱（設計 §13.15・§13.22、D-012・D-018） ----------
// 既定: 1回100ポイント。10円×12、20円×4、50円×2、100円×1 ＋ ラストワン100円 ＝ 20枚・500円。1枚の期待値 25円
// w は箱に入れる枚数。last はラストワンの金額（0 なら なし）
const RS_DEFAULT = { cost: 100, prizes: [{ yen: 10, w: 12 }, { yen: 20, w: 4 }, { yen: 50, w: 2 }, { yen: 100, w: 1 }], last: 100 };
const RS_MAX_TICKETS = 1000;

function rsValidate(cfg) {
  const e = [];
  const isInt = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  if (!cfg || typeof cfg !== 'object') return ['rewardSlot がオブジェクトでない'];
  if (!isInt(cfg.cost, 1, 100000)) e.push('cost が不正');
  if (cfg.last !== undefined && !isInt(cfg.last, 0, 100000)) e.push('last が不正');
  if (!Array.isArray(cfg.prizes) || cfg.prizes.length < 1 || cfg.prizes.length > 10) e.push('prizes は1〜10個');
  else if (cfg.prizes.some((x) => !x || !isInt(x.yen, 0, 100000) || !isInt(x.w, 1, RS_MAX_TICKETS))) e.push('prizes の値が不正');
  else if (cfg.prizes.reduce((s, x) => s + x.w, 0) > RS_MAX_TICKETS) e.push('枚数の合計が多すぎる');
  return e;
}

const rsLast = (cfg) => cfg.last || 0;

// 1枚の期待値（円）。{ num: 箱の合計金額, den: 箱の枚数 } と、小数第1位までの表示（四捨五入、0.5 切り上げ）
function rsExpected(cfg) {
  const num = cfg.prizes.reduce((s, x) => s + x.yen * x.w, 0) + rsLast(cfg);
  const den = cfg.prizes.reduce((s, x) => s + x.w, 0) + (rsLast(cfg) > 0 ? 1 : 0);
  const t = Math.floor((20 * num + den) / (2 * den)); // 10倍して四捨五入
  return { num, den, label: Math.floor(t / 10) + '.' + (t % 10) };
}

// 箱を作ったときの中身の設定（変わったら新しい箱にする）
function rsSig(cfg) {
  return cfg.prizes.map((x) => x.yen + 'x' + x.w).join(',') + '+' + rsLast(cfg);
}

function rsNewBox(cfg, no) {
  return { no, left: cfg.prizes.map((x) => x.w), last: rsLast(cfg) > 0, sig: rsSig(cfg) };
}

function rsBoxEmpty(box) {
  return !box || (box.left.every((n) => n === 0) && !box.last);
}

// 今の箱（無い・からっぽ・設定が変わった なら新しい箱）
function rsCurrentBox(cfg, box) {
  if (!box) return rsNewBox(cfg, 1);
  if (rsBoxEmpty(box) || box.sig !== rsSig(cfg) || box.left.length !== cfg.prizes.length) return rsNewBox(cfg, box.no + 1);
  return box;
}

// 1枚引く。返す: { prize: { yen, last }, box: 引いた後の箱 }。ふつうの札が0枚ならラストワン
function rsDraw(rng, cfg, box) {
  const cur = rsCurrentBox(cfg, box);
  const total = cur.left.reduce((s, n) => s + n, 0);
  if (total === 0) {
    if (!cur.last) throw new Error('rsDraw: からの箱');
    return { prize: { yen: rsLast(cfg), last: true }, box: { ...cur, last: false } };
  }
  let r = rng.int(total);
  for (let i = 0; i < cur.left.length; i++) {
    r -= cur.left[i];
    if (r < 0) {
      const left = cur.left.slice();
      left[i] -= 1;
      return { prize: { yen: cfg.prizes[i].yen, last: false }, box: { ...cur, left } };
    }
  }
  throw new Error('rsDraw: 到達しない');
}

// ---- src/logic/store.js ----
// store.js — 保存データのスキーマ、検証、読み込み、保存（lock・rev）、ポイントと交換、書き出し・読み込み。設計 §8
// ls は localStorage と同じ getItem/setItem/removeItem を持つもの（テストで差し替える）

const STORE_SCHEMA = 1;
const STORE_KEY = 'keisanRikai.data';
const STORE_KEY_BROKEN = 'keisanRikai.broken';
const STORE_KEY_BEFORE_IMPORT = 'keisanRikai.beforeImport';
const STORE_KEY_LOCK = 'keisanRikai.lock';
const STORE_LOCK_TTL_MS = 5000;
const STORE_SESSIONS_MAX = 100;
const STORE_UNDO_HOURS = 24;

function storeKnownKeys() {
  return new Set(unitItemsAll().map((it) => it.key));
}

// 接頭語クイズの記録のキー（prefix.js の prefixKeys に、もう出さない da:sym を加えた集合。テストで照合する）。D-009
// da:sym は v4 の初版だけが出した問題。その記録が残っていても読めるように受け付ける（数えない）
const STORE_PREFIX_KEY_RE = /^(k|h|da|d|c|m):(n2f|f2n|sym)$/;

// rev4 の任意の項目（設計 §13.9）
const STORE_LOG_MAX = 300;
const STORE_LOG_KINDS = ['nofig', 'direct', 'mastered', 'overcome', 'clear', 'prefix', 'unlock', 'daily', 'rank', 'jump', 'meaning', 'word', 'clockclear'];
const STORE_BEST_MAX = 100000;

const STORE_DEFAULT_NAMES = [
  { id: 'p1', name: 'ちょーじょ' },
  { id: 'p2', name: 'じーじょ' },
  { id: 'p3', name: 'ちょーなん' },
];

function storeClone(x) {
  return JSON.parse(JSON.stringify(x));
}

function storeInitial(nowIso) {
  return {
    schemaVersion: STORE_SCHEMA,
    rev: 0,
    updatedAt: nowIso || null,
    lastExportAt: null,
    profiles: STORE_DEFAULT_NAMES.map((p) => ({
      id: p.id, name: p.name, theme: 'basic', available: 0, total: 0,
      items: {}, drill: {}, sessions: [], pending: null, exchanges: [],
    })),
    rewards: [],
  };
}

const isInt0 = (v) => Number.isInteger(v) && v >= 0;
const isDate = (v) => v === null || (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v));
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const isIntIn = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

function storeBadPending(x) {
  return !isObj(x) || typeof x.sessionId !== 'string' || !isIntIn(x.correct, 0, 10) || !isIntIn(x.n, 1, 10)
    || !isIntIn(x.mid, 0, 6) || !isIntIn(x.right, 0, 6) || !isInt0(x.points) || typeof x.formula !== 'string'
    || !isInt0(x.totalBefore) || !isInt0(x.retried);
}

// 項目の記録（§5）の検証。items と clock（D-016）で使う
function storeBadItem(it) {
  return !isObj(it) || ![0, 1, 2].includes(it.support) || !isInt0(it.streak) || typeof it.weak !== 'boolean'
    || typeof it.placeAid !== 'boolean' || !isInt0(it.placeOk) || !isInt0(it.attempts) || !isDate(it.lastSeen)
    || !isDate(it.confirmedAt) || !Array.isArray(it.recent) || it.recent.length > 5
    || it.recent.some((r) => !isObj(r) || !['ok', 'e1', 'e2', 'e0'].includes(r.r) || ![0, 1, 2].includes(r.s) || typeof r.h !== 'boolean')
    || (it.slipAt !== undefined && !isDate(it.slipAt));
}

// 検証。問題の一覧を返す（空なら正常）
function storeValidate(d) {
  const e = [];
  if (!isObj(d)) return ['オブジェクトではない'];
  if (d.schemaVersion !== STORE_SCHEMA) e.push('schemaVersion が ' + STORE_SCHEMA + ' ではない');
  if (!isInt0(d.rev)) e.push('rev が不正');
  if (!(d.lastExportAt === null || typeof d.lastExportAt === 'string')) e.push('lastExportAt が不正');
  if (!Array.isArray(d.profiles) || d.profiles.length !== 3) {
    e.push('profiles が3人分でない');
  } else {
    const ids = d.profiles.map((p) => p && p.id);
    if (ids.join(',') !== 'p1,p2,p3') e.push('profiles の id が p1,p2,p3 でない');
    for (const p of d.profiles) {
      const w = (m) => e.push((p && p.id) + ': ' + m);
      if (!isObj(p)) { e.push('profile が不正'); continue; }
      if (typeof p.name !== 'string' || !p.name.trim() || p.name.length > 20) w('name が不正');
      if (typeof p.theme !== 'string') w('theme が不正');
      if (!isInt0(p.available) || !isInt0(p.total) || p.available > p.total) w('ポイントが不正');
      if (!isObj(p.items)) w('items が不正');
      else {
        const known = storeKnownKeys();
        for (const [k, it] of Object.entries(p.items)) {
          if (!known.has(k)) w('items に未知の項目 ' + k);
          if (storeBadItem(it)) w('items.' + k + ' が不正');
        }
      }
      if (!isObj(p.drill) || Object.entries(p.drill).some(([k, v]) => !/^[xd](1|2|3|4|6)$/.test(k) || !isObj(v) || !isInt0(v.ok) || !isInt0(v.ng))) w('drill が不正');
      if (!Array.isArray(p.sessions) || p.sessions.length > STORE_SESSIONS_MAX
        || p.sessions.some((x) => !isObj(x) || typeof x.id !== 'string' || !isInt0(x.points))) w('sessions が不正');
      if (!(p.pending === null || !storeBadPending(p.pending))) w('pending が不正');
      // rev4 の任意の項目（v4 までの記録には無い）。設計 §13.9
      if (p.log !== undefined && (!Array.isArray(p.log) || p.log.length > STORE_LOG_MAX || p.log.some((x) => !isObj(x)
        || typeof x.date !== 'string' || !isDate(x.date) || typeof x.kind !== 'string' || !x.kind || typeof x.key !== 'string'))) w('log が不正');
      // kind は STORE_LOG_KINDS 以外も受け付ける（先の版で増えても、この版で記録が初期化されないように。画面では知らない kind を出さない。R-006）
      if (p.best !== undefined && (!isObj(p.best) || (p.best.time !== undefined && !isIntIn(p.best.time, 0, STORE_BEST_MAX)))) w('best が不正');
      if (p.rank !== undefined && (!isObj(p.rank) || !isIntIn(p.rank.i, 0, 50) || typeof p.rank.date !== 'string' || !isDate(p.rank.date))) w('rank が不正');
      if (p.unlocked !== undefined && (!isObj(p.unlocked) || Object.entries(p.unlocked).some(([k, v]) => !['L4', 'time'].includes(k)
        || typeof v !== 'string' || !isDate(v)))) w('unlocked が不正');
      // meaning は任意（D-014）。キーは意味の問題の id（L1a など）
      if (p.meaning !== undefined && (!isObj(p.meaning) || Object.entries(p.meaning).some(([k, v]) => !/^L[123][a-z]$/.test(k)
        || !isObj(v) || !isIntIn(v.box, 0, 3) || !isInt0(v.ok) || !isInt0(v.ng)
        || (v.day !== undefined && (typeof v.day !== 'string' || !isDate(v.day))) || (v.seen !== undefined && (typeof v.seen !== 'string' || !isDate(v.seen)))))) w('meaning が不正');
      // clock は任意（D-016）。キーは じかん の項目 id（c1〜c10）
      if (p.clock !== undefined && (!isObj(p.clock) || Object.entries(p.clock).some(([k, v]) => !/^c([1-9]|10)$/.test(k) || storeBadItem(v)))) w('clock が不正');
      // word は任意（D-015）。キーは文章題の型 id（W1a など）
      if (p.word !== undefined && (!isObj(p.word) || Object.entries(p.word).some(([k, v]) => !/^W[123][a-d]$/.test(k)
        || !isObj(v) || !isIntIn(v.box, 0, 3) || !isInt0(v.ok) || !isInt0(v.ng)
        || (v.day !== undefined && (typeof v.day !== 'string' || !isDate(v.day))) || (v.seen !== undefined && (typeof v.seen !== 'string' || !isDate(v.seen)))))) w('word が不正');
      // rbox は任意（D-018。くじの箱）
      if (p.rbox !== undefined && (!isObj(p.rbox) || !Number.isInteger(p.rbox.no) || p.rbox.no < 1 || !Array.isArray(p.rbox.left)
        || p.rbox.left.some((n) => !isInt0(n)) || typeof p.rbox.last !== 'boolean' || typeof p.rbox.sig !== 'string')) w('rbox が不正');
      // prefix は任意（v3 までの記録には無い）
      if (p.prefix !== undefined && (!isObj(p.prefix) || Object.entries(p.prefix).some(([k, v]) => !STORE_PREFIX_KEY_RE.test(k)
        || !isObj(v) || !isIntIn(v.box, 0, 3) || !isInt0(v.ok) || !isInt0(v.ng) || (v.day !== undefined && (typeof v.day !== 'string' || !isDate(v.day)))))) w('prefix が不正');
      if (!Array.isArray(p.exchanges)) w('exchanges が不正');
    }
  }
  if (d.rewardSlot !== undefined && rsValidate(d.rewardSlot).length) e.push('rewardSlot が不正');
  if (!Array.isArray(d.rewards) || d.rewards.some((r) => !isObj(r) || typeof r.id !== 'string' || typeof r.name !== 'string' || !Number.isInteger(r.cost) || r.cost < 1)) {
    e.push('rewards が不正');
  }
  return e;
}

// 読み込み。mode: normal / readonly（新しい版）/ memory（退避できず書けない）/ nostorage
// opts.noWrite: lock を取れず書き込めないとき。壊れていても退避せず memory で動かす
function storeLoad(ls, nowIso, opts = {}) {
  let raw;
  try {
    raw = ls.getItem(STORE_KEY);
  } catch (err) {
    return { data: storeInitial(nowIso), mode: 'nostorage', warning: 'nostorage', rawBroken: null };
  }
  if (raw === null || raw === undefined) return { data: storeInitial(nowIso), mode: 'normal', warning: null, rawBroken: null };
  let parsed = null;
  try {
    parsed = JSON.parse(raw);
  } catch (err) {
    parsed = null;
  }
  if (isObj(parsed) && Number.isInteger(parsed.schemaVersion) && parsed.schemaVersion > STORE_SCHEMA) {
    return { data: storeInitial(nowIso), mode: 'readonly', warning: 'newer', rawBroken: null, rawOriginal: raw };
  }
  if (parsed !== null && storeValidate(parsed).length === 0) {
    return { data: parsed, mode: opts.noWrite ? 'memory' : 'normal', warning: opts.noWrite ? 'nowrite' : null, rawBroken: null };
  }
  if (opts.noWrite) return { data: storeInitial(nowIso), mode: 'memory', warning: 'broken_unsaved', rawBroken: raw };
  // 壊れている: 退避してから初期値で始める。退避できなければ本体に書かない
  try {
    ls.setItem(STORE_KEY_BROKEN, raw);
    if (ls.getItem(STORE_KEY_BROKEN) !== raw) throw new Error('退避の読み戻しが一致しない');
    ls.removeItem(STORE_KEY);
  } catch (err) {
    return { data: storeInitial(nowIso), mode: 'memory', warning: 'broken_unsaved', rawBroken: raw };
  }
  return { data: storeInitial(nowIso), mode: 'normal', warning: 'broken_saved', rawBroken: null };
}

// lock: 同時に操作できる窓を1つに限る。'ok' / 'busy'（他の窓が使用中）/ 'error'（保存が使えない）
function storeLockAcquire(ls, tabId, nowMs) {
  let cur = null;
  try {
    cur = JSON.parse(ls.getItem(STORE_KEY_LOCK) || 'null');
  } catch (err) {
    cur = null; // 壊れた lock は無視して取り直す
  }
  if (cur && cur.tabId !== tabId && nowMs - cur.beat < STORE_LOCK_TTL_MS) return 'busy';
  try {
    ls.setItem(STORE_KEY_LOCK, JSON.stringify({ tabId, beat: nowMs }));
    return 'ok';
  } catch (err) {
    return 'error';
  }
}

function storeLockRelease(ls, tabId) {
  try {
    const cur = JSON.parse(ls.getItem(STORE_KEY_LOCK) || 'null');
    if (cur && cur.tabId === tabId) ls.removeItem(STORE_KEY_LOCK);
  } catch (err) {
    // 閉じる途中の失敗は、5秒の TTL で無効になる
  }
}

function storeLockOwned(ls, tabId) {
  const cur = JSON.parse(ls.getItem(STORE_KEY_LOCK) || 'null');
  return !!cur && cur.tabId === tabId;
}

// 保存。ctx = { ls, tabId, rev, mode }。成功したら ctx.rev を進め、保存した data を返す
function storeSave(ctx, data, nowIso) {
  if (ctx.mode !== 'normal') return { ok: false, reason: 'mode' };
  try {
    const raw = ctx.ls.getItem(STORE_KEY);
    if (raw !== null && raw !== undefined) {
      let curRev = null;
      try {
        curRev = JSON.parse(raw).rev;
      } catch (err) {
        curRev = null;
      }
      if (curRev !== ctx.rev) return { ok: false, reason: 'conflict' };
    }
    if (!storeLockOwned(ctx.ls, ctx.tabId)) return { ok: false, reason: 'conflict' };
    const next = { ...data, rev: ctx.rev + 1, updatedAt: nowIso || data.updatedAt };
    ctx.ls.setItem(STORE_KEY, JSON.stringify(next));
    ctx.rev = next.rev;
    return { ok: true, data: next };
  } catch (err) {
    return { ok: false, reason: 'write_failed', error: String(err) };
  }
}

function storeProfile(data, pid) {
  const p = data.profiles.find((x) => x.id === pid);
  if (!p) throw new Error('storeProfile: 未知の id ' + pid);
  return p;
}

function storeWithProfile(data, pid, fn) {
  const d = storeClone(data);
  fn(storeProfile(d, pid), d);
  return d;
}

function storeSetItem(data, pid, key, state) {
  return storeWithProfile(data, pid, (p) => {
    p.items[key] = state;
  });
}

function storeSetPrefix(data, pid, key, state) {
  if (!STORE_PREFIX_KEY_RE.test(key)) throw new Error('storeSetPrefix: 未知のキー ' + key);
  return storeWithProfile(data, pid, (p) => {
    p.prefix = { ...(p.prefix || {}), [key]: state };
  });
}

// タイムチャレンジの回: pending を使わずに確定する。同じ id は二重に足さない。じこベストを更新する。設計 §13.8
function storeApplyTime(data, pid, session) {
  const p0 = storeProfile(data, pid);
  if (p0.sessions.some((s) => s.id === session.id)) return { data, added: false, newBest: false };
  const prevBest = (p0.best && p0.best.time) || 0;
  const newBest = session.score > prevBest;
  const d = storeWithProfile(data, pid, (p) => {
    p.available += session.points;
    p.total += session.points;
    p.sessions = [...p.sessions, session].slice(-STORE_SESSIONS_MAX);
    if (newBest) p.best = { ...(p.best || {}), time: Math.min(STORE_BEST_MAX, session.score) };
  });
  return { data: d, added: true, newBest };
}

// きおくテストの回（D-017）: スロットを回さないので pending を使わずに確定する。同じ id は二重に足さない
function storeApplyMemtest(data, pid, session) {
  const p0 = storeProfile(data, pid);
  if (p0.sessions.some((s) => s.id === session.id)) return { data, added: false };
  const d = storeWithProfile(data, pid, (p) => {
    p.available += session.points;
    p.total += session.points;
    p.sessions = [...p.sessions, session].slice(-STORE_SESSIONS_MAX);
  });
  return { data: d, added: true };
}

// ボーナスのポイント（ログイン・週のスタンプ。D-017。旧: きょうの もくひょう）。同じ id は二重に足さない。設計 §13.12
function storeApplyBonus(data, pid, id, date, points) {
  const p0 = storeProfile(data, pid);
  if (p0.sessions.some((s) => s.id === id)) return { data, added: false };
  const d = storeWithProfile(data, pid, (p) => {
    p.available += points;
    p.total += points;
    p.sessions = [...p.sessions, { id, date, mode: 'bonus', points }].slice(-STORE_SESSIONS_MAX);
  });
  return { data: d, added: true };
}

// できるようになったことの記録。同じ日の同じ (kind, key) は1回だけ。新しい順、最大 300 件。設計 §13.5
function storeAddLog(data, pid, events) {
  const p0 = storeProfile(data, pid);
  const old = p0.log || [];
  const has = (e, list) => list.some((x) => x.date === e.date && x.kind === e.kind && x.key === e.key);
  const add = [];
  for (const e of events) if (!has(e, old) && !has(e, add)) add.push({ date: e.date, kind: e.kind, key: e.key });
  if (!add.length) return { data, added: [] };
  const d = storeWithProfile(data, pid, (p) => {
    p.log = add.reverse().concat(old).slice(0, STORE_LOG_MAX);
  });
  return { data: d, added: add.slice().reverse() };
}

function storeSetRank(data, pid, i, date) {
  return storeWithProfile(data, pid, (p) => {
    p.rank = { i, date };
  });
}

function storeSetUnlocked(data, pid, key, date) {
  if (!['L4', 'time'].includes(key)) throw new Error('storeSetUnlocked: 未知のキー ' + key);
  return storeWithProfile(data, pid, (p) => {
    p.unlocked = { ...(p.unlocked || {}), [key]: date };
  });
}

function storeSetClock(data, pid, id, state) {
  if (!/^c([1-9]|10)$/.test(id)) throw new Error('storeSetClock: 未知の id ' + id);
  return storeWithProfile(data, pid, (p) => {
    p.clock = { ...(p.clock || {}), [id]: state };
  });
}

function storeSetWord(data, pid, id, state) {
  if (!/^W[123][a-d]$/.test(id)) throw new Error('storeSetWord: 未知の id ' + id);
  return storeWithProfile(data, pid, (p) => {
    p.word = { ...(p.word || {}), [id]: state };
  });
}

function storeSetMeaning(data, pid, id, state) {
  if (!/^L[123][a-z]$/.test(id)) throw new Error('storeSetMeaning: 未知の id ' + id);
  return storeWithProfile(data, pid, (p) => {
    p.meaning = { ...(p.meaning || {}), [id]: state };
  });
}

function storeAddDrill(data, pid, dkey, ok) {
  return storeWithProfile(data, pid, (p) => {
    const v = p.drill[dkey] || { ok: 0, ng: 0 };
    p.drill[dkey] = { ok: v.ok + (ok ? 1 : 0), ng: v.ng + (ok ? 0 : 1) };
  });
}

// 回の結果を確定する。同じ sessionId は二重に足さない。pending に入れて、見せたあとで消す
function storeApplySession(data, pid, session) {
  const p0 = storeProfile(data, pid);
  if (p0.sessions.some((s) => s.id === session.id)) return { data, added: false };
  const d = storeWithProfile(data, pid, (p) => {
    p.available += session.points;
    p.total += session.points;
    p.sessions = [...p.sessions, session].slice(-STORE_SESSIONS_MAX);
    p.pending = { sessionId: session.id, ...session };
  });
  return { data: d, added: true };
}

function storeClearPending(data, pid) {
  return storeWithProfile(data, pid, (p) => {
    p.pending = null;
  });
}

function storeExchange(data, pid, rewardId, nowIso) {
  const r = data.rewards.find((x) => x.id === rewardId);
  if (!r) return { ok: false, reason: 'no_reward', data };
  const p0 = storeProfile(data, pid);
  if (p0.available < r.cost) return { ok: false, reason: 'not_enough', data };
  const d = storeWithProfile(data, pid, (p) => {
    p.available -= r.cost;
    p.exchanges = [...p.exchanges, { date: nowIso, rewardName: r.name, cost: r.cost }];
  });
  return { ok: true, data: d };
}

// ごほうびスロット（設計 §13.15）
function storeRewardSlot(data) {
  return data.rewardSlot || RS_DEFAULT;
}

function storeSetRewardSlot(data, cfg) {
  const errs = rsValidate(cfg);
  if (errs.length) throw new Error('storeSetRewardSlot: ' + errs.join(' / '));
  const d = storeClone(data);
  d.rewardSlot = { cost: cfg.cost, prizes: cfg.prizes.map((x) => ({ yen: x.yen, w: x.w })), last: cfg.last || 0 };
  return d;
}

// くじを1枚引いた結果（rsDraw の { prize, box }）でポイントを引き、箱を保存し、交換の記録に残す。足りなければ拒否。累計は減らない（D-018）
function storeSpinReward(data, pid, draw, nowIso) {
  const cfg = storeRewardSlot(data);
  if (!draw || !draw.prize || !draw.box) return { ok: false, reason: 'no_prize', data };
  if (storeProfile(data, pid).available < cfg.cost) return { ok: false, reason: 'not_enough', data };
  const prize = draw.prize;
  const d = storeWithProfile(data, pid, (p) => {
    p.available -= cfg.cost;
    p.rbox = draw.box;
    p.exchanges = [...p.exchanges, { date: nowIso, rewardName: (prize.last ? 'くじ ラストワン ' : 'くじ ') + prize.yen + '円', cost: cfg.cost }];
  });
  return { ok: true, data: d, prize };
}

function storeSetRewards(data, rewards) {
  const d = storeClone(data);
  d.rewards = rewards.map((r) => ({ id: String(r.id), name: String(r.name), cost: r.cost }));
  const errs = storeValidate(d);
  if (errs.length) throw new Error('storeSetRewards: ' + errs.join(' / '));
  return d;
}

function storeRename(data, pid, name) {
  const n = String(name).trim();
  if (!n || n.length > 20) throw new Error('storeRename: 名前は1〜20文字');
  return storeWithProfile(data, pid, (p) => {
    p.name = n;
  });
}

function storeSetTheme(data, pid, theme) {
  return storeWithProfile(data, pid, (p) => {
    p.theme = theme;
  });
}

function storeMarkExported(data, nowIso) {
  return { ...storeClone(data), lastExportAt: nowIso };
}

function storeExportText(data) {
  return JSON.stringify(data, null, 1);
}

function storeParseImport(text) {
  let d;
  try {
    d = JSON.parse(text);
  } catch (err) {
    return { ok: false, errors: ['JSON として読めない'] };
  }
  const errors = storeValidate(d);
  return errors.length ? { ok: false, errors } : { ok: true, data: d };
}

function storeImportSummary(cur, next) {
  return {
    curUpdatedAt: cur.updatedAt,
    nextUpdatedAt: next.updatedAt,
    profiles: cur.profiles.map((p, i) => ({
      id: p.id, name: p.name, cur: { available: p.available, total: p.total },
      next: { name: next.profiles[i].name, available: next.profiles[i].available, total: next.profiles[i].total },
    })),
  };
}

// 読み込みの前に今の本体を退避する。失敗したら false（読み込みを中止する）
function storeBackupBeforeImport(ls, cur, nowMs) {
  try {
    ls.setItem(STORE_KEY_BEFORE_IMPORT, JSON.stringify({ savedAt: nowMs, data: cur }));
    return JSON.parse(ls.getItem(STORE_KEY_BEFORE_IMPORT)).data.rev === cur.rev;
  } catch (err) {
    return false;
  }
}

// 取り消せるのは、読み込みから STORE_UNDO_HOURS 時間以内だけ
function storeReadBeforeImport(ls, nowMs) {
  try {
    const raw = ls.getItem(STORE_KEY_BEFORE_IMPORT);
    if (!raw) return null;
    const x = JSON.parse(raw);
    if (!isObj(x) || !Number.isFinite(x.savedAt) || nowMs - x.savedAt > STORE_UNDO_HOURS * 3600000) return null;
    return storeValidate(x.data).length === 0 ? x.data : null;
  } catch (err) {
    return null;
  }
}

function storeClearBeforeImport(ls) {
  try {
    ls.removeItem(STORE_KEY_BEFORE_IMPORT);
  } catch (err) {
    // 消せなくても期限切れで無効になる
  }
}

// 読み込んだデータを、今の rev の続きとして保存できる形にする
function storeAdoptImported(next, curRev) {
  return { ...storeClone(next), rev: curRev };
}

// ---- src/logic/chara.js ----
// chara.js — オリジナルのキャラクター3体（D-007）。SVG の文字列を返す純粋な関数だけを置く。設計 §9.10
// 外部の画像・URL は使わない。誤答のとき（think）も責める表情にしない。

const CHARA_LIST = [
  { id: 'naga', name: 'ながさん', level: 1, what: 'ものさし' },
  { id: 'shikaku', name: 'しかくん', level: 2, what: 'タイル' },

const CHARA_MOODS = ['normal', 'happy', 'think', 'cheer'];

function charaForLevel(level) {
  const c = CHARA_LIST.find((x) => x.level === level);

// 顔: 目・ほお・口。ink は線の色
function charaFace(cx, cy, mood, ink) {

    s += '<path d="M' + (cx - 16) + ' ' + cy + ' q5 -7 10 0 M' + (cx + 6) + ' ' + cy + ' q5 -7 10 0" fill="none" stroke="' + ink + '" stroke-width="3" stroke-linecap="round"/>';
  } else {
    s += '<circle cx="' + (cx - 11) + '" cy="' + cy + '" r="4.5" fill="' + ink + '"/><circle cx="' + (cx + 11) + '" cy="' + cy + '" r="4.5" fill="' + ink + '"/>';
    s += '<circle cx="' + (cx - 9.5) + '" cy="' + (cy - 1.5) + '" r="1.5" fill="#fff"/><circle cx="' + (cx + 12.5) + '" cy="' + (cy - 1.5) + '" r="1.5" fill="#fff"/>';
  }
  s += '<ellipse cx="' + (cx - 19) + '" cy="' + (cy + 11) + '" rx="5.5" ry="3.2" fill="#f4a58a"/><ellipse cx="' + (cx + 19) + '" cy="' + (cy + 11) + '" rx="5.5" ry="3.2" fill="#f4a58a"/>';
  if (mood === 'happy' || mood === 'cheer') {
    s += '<path d="M' + (cx - 8) + ' ' + (cy + 10) + ' q8 11 16 0 z" fill="' + ink + '"/>';
  } else if (mood === 'think') {
    s += '<path d="M' + (cx - 5) + ' ' + (cy + 13) + ' q5 -3 10 0" fill="none" stroke="' + ink + '" stroke-width="2.5" stroke-linecap="round"/>';
  } else {
    s += '<path d="M' + (cx - 6) + ' ' + (cy + 10) + ' q6 7 12 0" fill="none" stroke="' + ink + '" stroke-width="2.5" stroke-linecap="round"/>';
  }
  return s;
}

// うで: cheer は上げる、それ以外は下ろす。lx/rx は体の左右の端、y は肩の高さ
function charaArms(lx, rx, y, mood, color) {
  const up = mood === 'cheer';
  const dy = up ? -18 : 16;
  return '<g stroke="' + color + '" stroke-width="4" stroke-linecap="round">' +
    '<line x1="' + lx + '" y1="' + y + '" x2="' + (lx - 13) + '" y2="' + (y + dy) + '"/>' +
    '<line x1="' + rx + '" y1="' + y + '" x2="' + (rx + 13) + '" y2="' + (y + dy) + '"/></g>';
}

function charaLegs(x1, x2, y, color) {
  return '<g stroke="' + color + '" stroke-width="4" stroke-linecap="round"><line x1="' + x1 + '" y1="' + y + '" x2="' + x1 + '" y2="' + (y + 14) + '"/><line x1="' + x2 + '" y1="' + y + '" x2="' + x2 + '" y2="' + (y + 14) + '"/></g>';
}

function charaThinkMark(mood) {
  return mood === 'think' ? '<text x="104" y="26" font-size="22" font-weight="bold" fill="#7a6a55">?</text>' : '';
}

// ながさん（D-007 追記: 笑える顔）: ぎょろ目・太いまゆ・ちょびひげ
function charaFaceNaga(mood) {
  const k = '#412402';

  if (mood === 'happy') {

    const pu = mood === 'think' ? [[52, 39], [76, 40]] : mood === 'cheer' ? [[55, 43], [73, 43]] : [[58, 45], [70, 45]];
    s += '<circle cx="' + pu[0][0] + '" cy="' + pu[0][1] + '" r="' + (mood === 'cheer' ? 4.5 : 3.5) + '" fill="' + k + '"/><circle cx="' + pu[1][0] + '" cy="' + pu[1][1] + '" r="' + (mood === 'cheer' ? 4.5 : 3.5) + '" fill="' + k + '"/>';
    // まゆ: think は片方だけ上げる
    const lb = mood === 'think' ? 'M48 29 q7 -6 14 0' : mood === 'cheer' ? 'M48 28 q7 -5 14 0' : 'M48 32 q7 -3 14 0';
    const rb = mood === 'think' ? 'M66 33 q7 1 14 -1' : mood === 'cheer' ? 'M66 28 q7 -5 14 0' : 'M66 32 q7 -3 14 0';
    s += '<path d="' + lb + ' ' + rb + '" fill="none" stroke="' + k + '" stroke-width="3.5" stroke-linecap="round"/>';
  }
  // ちょびひげ
  s += '<path d="M64 56 q-6 -4 -12 1 q5 4 12 -1 z M64 56 q6 -4 12 1 q-5 4 -12 -1 z" fill="' + k + '"/>';

  } else if (mood === 'think') {

// りっぽー（D-007 追記: 笑える顔）: 左右ちがう目・出っ歯・アホ毛
function charaFaceRippo(mood) {
  const k = '#042c53';
  let s = '<path d="M62 27 q-6 -14 5 -17 q9 -1 4 8" fill="none" stroke="' + k + '" stroke-width="2.5" stroke-linecap="round"/>';
  s += '<ellipse cx="24" cy="90" rx="5.5" ry="3.2" fill="#f4a58a"/><ellipse cx="74" cy="90" rx="5.5" ry="3.2" fill="#f4a58a"/>';

  } else {
    s += '<circle cx="36" cy="72" r="9" fill="#fff" stroke="' + k + '" stroke-width="2"/>';

  if (mood === 'happy' || mood === 'cheer') {

  } else if (mood === 'think') {
    s += '<line x1="56" y1="72" x2="66" y2="72" stroke="' + k + '" stroke-width="3" stroke-linecap="round"/>';
    s += '<path d="M76 54 q-4 6 0 8 q4 -2 0 -8 z" fill="#85b7eb" stroke="#185fa5" stroke-width="1"/>';
  } else {
    s += '<circle cx="61" cy="72" r="3.5" fill="' + k + '"/>';
  }
  if (mood === 'happy' || mood === 'cheer') {
    s += '<path d="M35 87 h28 q-14 18 -28 0 z" fill="' + k + '"/><rect x="43" y="87" width="5.5" height="6" fill="#fff" stroke="' + k + '" stroke-width="1"/><rect x="49.5" y="87" width="5.5" height="6" fill="#fff" stroke="' + k + '" stroke-width="1"/>';
  } else if (mood === 'think') {
    s += '<path d="M38 92 l5 -3 l5 3 l5 -3 l5 3" fill="none" stroke="' + k + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  } else {
    s += '<path d="M37 88 q12 9 24 0" fill="none" stroke="' + k + '" stroke-width="2.5" stroke-linecap="round"/><path d="M50 92 q4 7 8 0 z" fill="#f0997b" stroke="' + k + '" stroke-width="1.2"/>';
  }
  return s;
}

function charaBody(id, mood) {
  if (id === 'naga') {
    let s = charaArms(38, 82, 66, mood, '#8a5a12') + charaLegs(48, 72, 118, '#8a5a12');
    s += '<rect x="38" y="8" width="44" height="112" rx="14" fill="#fac775" stroke="#8a5a12" stroke-width="2.5"/>';
    for (let i = 0; i < 9; i++) {
      const y = 22 + i * 11;
      s += '<line x1="38" y1="' + y + '" x2="' + (i % 2 === 0 ? 50 : 45) + '" y2="' + y + '" stroke="#8a5a12" stroke-width="2"/>';
    }
    return s + charaFaceNaga(mood);
  }
  if (id === 'shikaku') {
    let s = charaArms(14, 106, 70, mood, '#0f6e56') + charaLegs(44, 76, 112, '#0f6e56');
    s += '<line x1="60" y1="22" x2="60" y2="10" stroke="#0f6e56" stroke-width="2.5"/><circle cx="60" cy="8" r="5" fill="#f4c0d1" stroke="#993556" stroke-width="1.5"/>';
    s += '<rect x="14" y="22" width="92" height="92" rx="14" fill="#9fe1cb" stroke="#0f6e56" stroke-width="2.5"/>';
    s += '<g stroke="#5dcaa5" stroke-width="1.6"><line x1="44.7" y1="22" x2="44.7" y2="114"/><line x1="75.3" y1="22" x2="75.3" y2="114"/><line x1="14" y1="52.7" x2="106" y2="52.7"/><line x1="14" y1="83.3" x2="106" y2="83.3"/></g>';
    s += '<rect x="30" y="46" width="60" height="44" rx="12" fill="#e1f5ee"/>';
    return s + charaFace(60, 64, mood, '#04342c');
  }
  if (id === 'rippo') {
    // 立方体: 正面・上面・右側面
    let s = charaArms(14, 104, 82, mood, '#185fa5') + charaLegs(34, 74, 116, '#185fa5');
    s += '<path d="M14 46 L34 26 L104 26 L84 46 Z" fill="#b5d4f4" stroke="#185fa5" stroke-width="2.5" stroke-linejoin="round"/>';
    s += '<path d="M84 46 L104 26 L104 96 L84 116 Z" fill="#378add" stroke="#185fa5" stroke-width="2.5" stroke-linejoin="round"/>';
    s += '<rect x="14" y="46" width="70" height="70" fill="#e6f1fb" stroke="#185fa5" stroke-width="2.5" stroke-linejoin="round"/>';
    return s + charaFaceRippo(mood);
  }
  if (id === 'timmy') {
    // タイミー（D-016）: とがった めざましどけい。ギザギザの ふち、いなずまの 針、つりあがった まゆ、キバ（保護者の希望で とがらせた）
    const k = '#1d1d2b';
    let s = charaArms(14, 106, 80, mood, '#1d1d2b') + charaLegs(42, 78, 114, '#1d1d2b');
    // ギザギザの ふち（16本の とげ）
    let pts = '';
    for (let i = 0; i < 32; i++) {
      const a = (i * Math.PI) / 16;
      const r = i % 2 === 0 ? 54 : 44;
      pts += (60 + r * Math.sin(a)).toFixed(1) + ',' + (70 - r * Math.cos(a)).toFixed(1) + ' ';
    }
    s += '<polygon points="' + pts.trim() + '" fill="#e24b4a" stroke="#1d1d2b" stroke-width="2.5" stroke-linejoin="round"/>';
    s += '<circle cx="60" cy="70" r="38" fill="#fff8d6" stroke="#1d1d2b" stroke-width="2.5"/>';
    for (let i = 0; i < 12; i += 3) {
      const a = (i * Math.PI) / 6;
      s += '<line x1="' + (60 + 31 * Math.sin(a)).toFixed(1) + '" y1="' + (70 - 31 * Math.cos(a)).toFixed(1) + '" x2="' + (60 + 37 * Math.sin(a)).toFixed(1) + '" y2="' + (70 - 37 * Math.cos(a)).toFixed(1) + '" stroke="#1d1d2b" stroke-width="3"/>';
    }
    // いなずまの 針。cheer は 10時10分（ばんざい）
    const bolt = mood === 'cheer'
      ? 'M60 52 L52 47 L55 46 L46 40 M60 52 L68 47 L65 46 L74 40'
      : 'M60 52 L58 44 L62 44 L59 34 M60 52 L66 49 L65 46 L73 43';
    s += '<path d="' + bolt + '" fill="none" stroke="#f0a020" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="52" r="3" fill="#1d1d2b"/>';
    // まゆ（つりあがり）。think は 片方だけ 上がる
    const brows = mood === 'think' ? 'M38 62 L52 66 M68 62 L82 60' : 'M38 61 L52 66 M68 66 L82 61';
    s += '<path d="' + brows + '" stroke="' + k + '" stroke-width="4" stroke-linecap="round"/>';
    // 目
    if (mood === 'happy') s += '<path d="M41 73 L47 70 L53 73 M67 73 L73 70 L79 73" fill="none" stroke="' + k + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    else {
      s += '<path d="M40 72 L54 70 L52 78 L42 78 Z" fill="#fff" stroke="' + k + '" stroke-width="2" stroke-linejoin="round"/><path d="M66 70 L80 72 L78 78 L68 78 Z" fill="#fff" stroke="' + k + '" stroke-width="2" stroke-linejoin="round"/>';
      const px = mood === 'think' ? -2 : 1;
      s += '<circle cx="' + (48 + px) + '" cy="74.5" r="2.8" fill="' + k + '"/><circle cx="' + (73 + px) + '" cy="74.5" r="2.8" fill="' + k + '"/>';
    }
    // 口: にやり ＋ キバ
    if (mood === 'happy' || mood === 'cheer') s += '<path d="M48 86 Q60 98 72 86 Z" fill="' + k + '"/><path d="M52 86 l3 5 l3 -5 Z M62 86 l3 5 l3 -5 Z" fill="#fff"/>';
    else if (mood === 'think') s += '<path d="M50 90 l5 -3 l5 3 l5 -3 l5 3" fill="none" stroke="' + k + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    else s += '<path d="M50 87 Q62 93 72 84" fill="none" stroke="' + k + '" stroke-width="2.5" stroke-linecap="round"/><path d="M66 88 l2 5 l3 -6 Z" fill="#fff" stroke="' + k + '" stroke-width="1"/>';
    return s;
  }
  throw new Error('charaSvg: キャラクターが不正 ' + id);
}

function charaSvg(id, mood, size) {
  if (!CHARA_MOODS.includes(mood)) throw new Error('charaSvg: 表情が不正 ' + mood);
  const c = CHARA_LIST.find((x) => x.id === id);
  if (!c) throw new Error('charaSvg: キャラクターが不正 ' + id);
  const w = size || 72;
  const h = Math.round(w * 140 / 120);
  return '<svg class="chara chara-' + mood + '" viewBox="0 0 120 140" width="' + w + '" height="' + h + '" role="img" aria-label="' + c.name + '">' +
    charaBody(id, mood) + charaThinkMark(mood) + '</svg>';
}

// 1 L の図: りっぽー（いっぺん 10 cm の立方体）に辺の長さを書き、1 L ＝ 1000 cm³ ＝ 10 dL ＝ 1000 mL を添える
function charaLiterSvg() {
  let s = '<svg class="liter" viewBox="0 0 380 180" width="380" height="180" role="img" aria-label="いっぺん 10 cm の りっぽうたい は 1 L">';
  s += '<g transform="translate(30 10)">' + charaBody('rippo', 'normal') + '</g>';
  s += '<g font-size="13" fill="#185fa5"><text x="79" y="174" text-anchor="middle">10 cm</text><text x="140" y="96">10 cm</text><text x="58" y="30">10 cm</text></g>';
  s += '<g font-size="17" fill="#2b2b2b"><text x="210" y="44">10×10×10</text><text x="210" y="70">＝ 1000 cm³</text><text x="210" y="96">＝ 1 L</text><text x="210" y="122">＝ 10 dL</text><text x="210" y="148">＝ 1000 mL</text></g>';
  return s + '</svg>';
}

// ---- src/logic/prefix.js ----
// prefix.js — 接頭語クイズ（キロ・ヘクト・デカ・デシ・センチ・ミリ）。問題、選択肢、覚えた度合い（箱）、出題。設計 §5a、D-009
// 倍率は exp（10 の何乗か）だけで持つ。表示の文字列は exp から作る（浮動小数を使わない）

// ex: 記号の問題（sym）に使う例の単位。小学校の問題で出るものだけにする（D-009 追記）。デカは例が無いので sym を出さない
const PREFIXES = [
  { id: 'k', name: 'キロ', sym: 'k', exp: 3, ex: ['km', 'kL', 'kg'] },
  { id: 'h', name: 'ヘクト', sym: 'h', exp: 2, ex: ['ha'] },
  { id: 'da', name: 'デカ', sym: 'da', exp: 1, ex: [] },
  { id: 'd', name: 'デシ', sym: 'd', exp: -1, ex: ['dL'] },
  { id: 'c', name: 'センチ', sym: 'c', exp: -2, ex: ['cm'] },
  { id: 'm', name: 'ミリ', sym: 'm', exp: -3, ex: ['mm', 'mL', 'mg'] },
];
const PREFIX_KINDS = ['n2f', 'f2n', 'sym'];
const PREFIX_BOX_MAX = 3;
const PREFIX_WEIGHTS = [4, 3, 2, 1];

function prefixById(id) {
  const p = PREFIXES.find((x) => x.id === id);
  if (!p) throw new Error('prefixById: 未知の接頭語 ' + id);
  return p;
}

function prefixKeys() {
  const out = [];
  for (const p of PREFIXES) for (const k of PREFIX_KINDS) if (k !== 'sym' || p.ex.length) out.push(p.id + ':' + k);
  return out;
}

// 倍率の表示: 3 → 「1000 ばい」、-2 → 「1/100（100ぶんの1）」
function prefixFactorLabel(exp) {
  if (!Number.isInteger(exp) || exp === 0) throw new Error('prefixFactorLabel: exp が不正 ' + exp);
  const n = '1' + '0'.repeat(Math.abs(exp));
  return exp > 0 ? n + ' ばい' : '1/' + n + '（' + n + 'ぶんの1）';
}

// 誤りの選び方: 符号が逆 → 倍率が隣（0 は飛ばす）→ 残りから抽選
function prefixDistractors(rng, p) {
  const others = PREFIXES.filter((x) => x.id !== p.id);
  const pri = [];
  const add = (x) => { if (x && !pri.includes(x)) pri.push(x); };
  add(others.find((x) => x.exp === -p.exp));
  for (const e of [p.exp + 1, p.exp - 1]) add(others.find((x) => x.exp === e));
  const rest = qShuffle(rng, others.filter((x) => !pri.includes(x)));
  return pri.concat(rest).slice(0, 3);
}

// key: 'k:n2f' など。返す問題: { key, prefix, kind, text, example, options: [{id, label, correct}] }
function prefixMakeQuestion(rng, key) {
  const [id, kind] = key.split(':');
  const p = prefixById(id);
  if (!prefixKeys().includes(key)) throw new Error('prefixMakeQuestion: 未知の問題 ' + key);
  const cands = [p].concat(prefixDistractors(rng, p));
  const label = (x) => (kind === 'n2f' ? prefixFactorLabel(x.exp) : x.name);
  const options = qShuffle(rng, cands.map((x) => ({ id: x.id, label: label(x), correct: x.id === p.id })));
  let text;
  let example = null;
  if (kind === 'n2f') text = p.name + ' は もとの たんいの なんばい？';
  else if (kind === 'f2n') text = prefixFactorLabel(p.exp) + ' を あらわす ことばは？';
  else {
    example = qPick(rng, p.ex);
    text = example + ' の ' + p.sym + ' は なに？';
  }
  return { key, prefix: id, kind, text, example, options };
}

// 箱の更新: 最初の1回で正解なら1上げる（上限 3）、誤りなら0に戻す。
// today を渡したときは、箱を上げるのは1日に1つまで（「おぼえた」には3つの別の日の正解が要る。R-007）
function prefixRecord(state, ok, today) {
  const s = state || { box: 0, ok: 0, ng: 0 };
  const sameDay = !!today && s.day === today;
  const box = ok ? (sameDay ? s.box : Math.min(PREFIX_BOX_MAX, s.box + 1)) : 0;
  const out = { box, ok: s.ok + (ok ? 1 : 0), ng: s.ng + (ok ? 0 : 1) };
  if (today) out.day = ok && !sameDay ? today : s.day || today;
  return out;
}

function prefixLearned(states) {
  const st = states || {};
  return prefixKeys().filter((k) => st[k] && st[k].box >= PREFIX_BOX_MAX).length;
}

// 出題: 重み box0（まだを含む）4、box1 3、box2 2、box3 1。同じ接頭語を続けない
function prefixPick(rng, states) {
  const st = states || {};
  const keys = prefixKeys();
  const out = [];
  let prevId = null;
  while (out.length < PG_SESSION_SIZE) {
    const cands = keys.filter((k) => k.split(':')[0] !== prevId);
    let total = 0;
    for (const k of cands) total += PREFIX_WEIGHTS[st[k] ? st[k].box : 0];
    let r = rng.int(total);
    let pick = cands[cands.length - 1];
    for (const k of cands) {
      r -= PREFIX_WEIGHTS[st[k] ? st[k].box : 0];
      if (r < 0) { pick = k; break; }
    }
    out.push({ key: pick, isCheck: false });
    prevId = pick.split(':')[0];
  }
  return out;
}

// キロ〜ミリの7段の表（HTML）。hi: 強調する接頭語の id（正解）、mark: 子供が選んだ誤りの id
function prefixTableHtml(hi, mark) {
  const cols = PREFIXES.slice(0, 3).map((p) => ({ id: p.id, name: p.name, sym: p.sym, f: '×' + '1' + '0'.repeat(p.exp) }))
    .concat([{ id: '', name: 'もと', sym: 'm・L・g', f: '×1' }])
    .concat(PREFIXES.slice(3).map((p) => ({ id: p.id, name: p.name, sym: p.sym, f: '1/1' + '0'.repeat(-p.exp) })));
  const cls = (c) => (c.id && c.id === hi ? ' class="hi"' : c.id && c.id === mark ? ' class="mark"' : '');
  let h = '<table class="prefix-table"><tr>' + cols.map((c) => '<th' + cls(c) + '>' + c.name + '</th>').join('') + '</tr>';
  h += '<tr>' + cols.map((c) => '<td' + cls(c) + '>' + c.sym + '</td>').join('') + '</tr>';
  h += '<tr>' + cols.map((c) => '<td' + cls(c) + '>' + c.f + '</td>').join('') + '</tr></table>';
  return h;
}

function mnById(id) {
  const m = MEANING.find((x) => x.id === id);
  if (!m) throw new Error('mnById: 未知の問題 ' + id);
  return m;
}

function mnForLevel(level) {
  return MEANING.filter((x) => x.level === level);
}

// 出す問題: 選択肢を並べ替えて { id, level, text, explain, options: [{ label, correct }] }
function mnMakeQuestion(rng, id) {
  const m = mnById(id);
  const options = qShuffle(rng, m.options.map((label, i) => ({ label, correct: i === 0 })));
  return { id: m.id, level: m.level, text: m.text, explain: m.explain, options };
}

// 箱は接頭語と同じ（1日に1つまで、誤りで0）。seen は最後に答えた日（1日1問にするため）
function mnRecord(state, ok, today) {
  return { ...prefixRecord(state, ok, today), seen: today };
}

function mnDone(st) {
  return !!st && st.box >= MN_DONE_BOX;
}

// そのレベルで「わかった」でない問題（今日まだ答えていないものだけ）。最初のものを返す
function mnNextFor(states, level, today) {
  const st = states || {};
  const left = mnForLevel(level).filter((m) => !mnDone(st[m.id]) && (!st[m.id] || st[m.id].seen !== today));
  return left.length ? left[0].id : null;
}

function mnLevelDone(states, level) {
  const st = states || {};
  return mnForLevel(level).every((m) => mnDone(st[m.id]));
}

// 出せる型: levels（できた が半分以上のレベル）の型
