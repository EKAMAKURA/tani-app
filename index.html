function mnById(id) {
  const m = MEANING.find((x) => x.id === id);
  if (!m) throw new Error('mnById: 未知の問題 ' + id);
  return m;
}

function mnForLevel(level) {
  return MEANING.filter((x) => x.level === level);
}

// 出す問題: 選択肢を並べ替えて { id, level, text, explain, options: [{ label, correct }] }
function mnMakeQuestion(rng, id) {
  const m = mnById(id);
  const options = qShuffle(rng, m.options.map((label, i) => ({ label, correct: i === 0 })));
  return { id: m.id, level: m.level, text: m.text, explain: m.explain, options };
}

// 箱は接頭語と同じ（1日に1つまで、誤りで0）。seen は最後に答えた日（1日1問にするため）
function mnRecord(state, ok, today) {
  return { ...prefixRecord(state, ok, today), seen: today };
}

function mnDone(st) {
  return !!st && st.box >= MN_DONE_BOX;
}

// そのレベルで「わかった」でない問題（今日まだ答えていないものだけ）。最初のものを返す
function mnNextFor(states, level, today) {
  const st = states || {};
  const left = mnForLevel(level).filter((m) => !mnDone(st[m.id]) && (!st[m.id] || st[m.id].seen !== today));
  return left.length ? left[0].id : null;
}

function mnLevelDone(states, level) {
  const st = states || {};
  return mnForLevel(level).every((m) => mnDone(st[m.id]));
}

// ---- src/logic/word.js ----
// word.js — 文章題（各レベル4型、計12型）。設計 §13.19、D-015
// 答えはすべて整数になるように数の範囲を決め、整数の計算で出す（浮動小数を使わない。小数の入力は decimal.js で作る）。
// 各型の factors（1 a は b の f 倍）は、テストで units.js の換算係数と照合する。登場人物はキャラクター（実名を使わない）。

const WD_DONE_BOX = 2; // 別の2日で正解して「とけた」

const wdInt = (n) => decMake(String(n), 0);
const wdRange = (rng, lo, hi, step = 1) => lo + step * rng.int(Math.floor((hi - lo) / step) + 1);

const WORD = [
  {
    id: 'W1a', title: '道のり（km → m）', level: 1, factors: [{ lv: 1, a: 'km', b: 'm', f: 1000 }],
    gen(rng) {
      const v = qMakeS(rng, qPick(rng, ['a', 'c']));
      const ans = decShift(v, 3);
      const vs = decToString(v);
      return { params: { v: vs }, text: 'ながさんは ' + vs + ' km 歩きました。何 m 歩きましたか？', unit: 'm', answer: ans,
        steps: ['1 km ＝ 1000 m', vs + ' × 1000 ＝ ' + decToString(ans)] };
    },
  },
  {
    id: 'W1b', title: 'm と cm の ひも', level: 1, factors: [{ lv: 1, a: 'm', b: 'cm', f: 100 }],
    gen(rng) {
      const a = wdRange(rng, 1, 9);
      const b = wdRange(rng, 1, 99);
      const ans = a * 100 + b;
      return { params: { a, b }, text: a + ' m ' + b + ' cm のひもが あります。何 cm ですか？', unit: 'cm', answer: wdInt(ans),
        steps: ['1 m ＝ 100 cm だから ' + a + ' m ＝ ' + a * 100 + ' cm', a * 100 + ' ＋ ' + b + ' ＝ ' + ans] };
    },

function wdById(id) {
  const w = WORD.find((x) => x.id === id);
  if (!w) throw new Error('wdById: 未知の型 ' + id);
  return w;
}

function wdMakeQuestion(rng, id) {
  const w = wdById(id);
  return { id, level: w.level, ...w.gen(rng) };
}

function wdRecord(state, ok, today) {
  return { ...prefixRecord(state, ok, today), seen: today };
}

function wdDone(st) {
  return !!st && st.box >= WD_DONE_BOX;
}

// 出せる型: levels（できた が半分以上のレベル）の型
function wdKeysFor(levels) {
  return WORD.filter((w) => levels.includes(w.level)).map((w) => w.id);
}

// 5問。まだ「とけた」でない型は重み3、とけた は1。同じ型を続けない
function wdPick(rng, states, levels, n) {
  const keys = wdKeysFor(levels);
  if (!keys.length) return [];
  const st = states || {};
  const w = (k) => (wdDone(st[k]) ? 1 : 3);
  const out = [];
  let prev = null;
  while (out.length < n) {
    const cands = keys.length >= 2 ? keys.filter((k) => k !== prev) : keys;
    const total = cands.reduce((a, k) => a + w(k), 0);
    let r = rng.int(total);
    let pick = cands[cands.length - 1];
    for (const k of cands) {
      r -= w(k);
      if (r < 0) { pick = k; break; }
    }
    out.push({ key: 'wd:' + pick, isWord: true, isCheck: false, isProbe: false });
    prev = pick;
  }
  return out;
}

    id: 'R2o', level: 2, kind: 'count', text: '1円玉が ちょうど入る 1辺 2 cm の 正方形の広さは、何 mm²？', options: ['400 mm²', '4 mm²', '40 mm²', '4000 mm²'],
    hint: '2 cm は 何 mm？',
    explain: '2 cm ＝ 20 mm。20 mm × 20 mm ＝ 400 mm²。',
    src: '一円玉の直径 20 mm（法令）。問題文で大きさを決めている', check: { kind: 'area', level: 2, dims: [[2, 'cm'], [2, 'cm']], unit: 'mm²', tenths: 4000 },
  },
  {
    id: 'R2p', level: 2, kind: 'count', text: '1 m² の中に、1辺 1 mm の 小さい正方形は 何こ 入る？', options: ['1000000こ', '1000こ', '10000こ', '100こ'],
    hint: '1 m ＝ 1000 mm。たてに 1000こ、よこに 1000こ。',
    explain: '1000 × 1000 ＝ 1000000こ（100万こ）。1 m² ＝ 1000000 mm²。',
    src: '問題文で大きさを決めている', check: { kind: 'fit', level: 2, big: [1, 'm²'], dims: [[1, 'mm'], [1, 'mm']], ans: 1000000 },
  },
];

function realById(id) {
  const r = REAL.find((x) => x.id === id);
  if (!r) throw new Error('realById: 未知の問題 ' + id);
  return r;
}

// levels（出してよいレベル）の問題から、n問を重ならないように選ぶ。足りなければある分だけ
function realPick(rng, levels, n) {
  const pool = REAL.filter((r) => (levels || []).includes(r.level)).map((r) => r.id);
  const out = [];
  while (out.length < n && pool.length) out.push(pool.splice(rng.int(pool.length), 1)[0]);
  return out;
}

// 出す問題: 選択肢を並べ替えて { id, level, text, explain, options: [{ label, correct }] }（意味の問題と同じ形）
function realMakeQuestion(rng, id) {
  const r = realById(id);
  const opts = r.options.map((label, i) => ({ label, correct: i === 0 }));
  for (let i = opts.length - 1; i > 0; i--) {
    const j = rng.int(i + 1);
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return { id: r.id, level: r.level, text: r.text, explain: r.explain, hint: r.hint, options: opts };
}

// ---- src/logic/why.js ----
// why.js — 「どうして × ・ ÷ なの？」の説明に使う材料（D-042）。設計 §13.42
// 係数は units.js の指数からだけ作る（ここに数を書かない）。

// 大きい単位から小さい単位へ、となりどうしの段: [{ big, small, n }]（1 big ＝ n small）
function whyChain(level, from, to) {
  const ef = unitExp(level, from);
  const et = unitExp(level, to);
  const hi = Math.max(ef, et);
  const lo = Math.min(ef, et);
  const name = (g) => (g.units.includes(from) ? from : g.units.includes(to) ? to : g.units[0]);
  const groups = unitLadder(level).filter((g) => g.exp <= hi && g.exp >= lo);
  const out = [];
  for (let i = 0; i + 1 < groups.length; i++) {
    out.push({ big: name(groups[i]), small: name(groups[i + 1]), n: 10 ** (groups[i].exp - groups[i + 1].exp) });
  }
  return out;
}

// 大きい単位 1 つに、小さい単位がいくつ入るか（10 の k 乗）
function whyFactor(level, from, to) {
  return 10 ** Math.abs(unitExp(level, from) - unitExp(level, to));
}

// お金のたとえ: 1円玉と、その n 倍のお金（n が 10・100・1000・10000 のときだけ）
const WHY_MONEY = { 10: '10円玉', 100: '100円玉', 1000: '1000円札', 10000: '1万円札' };
function whyMoney(n) {
  return WHY_MONEY[n] ? { small: '1円玉', big: WHY_MONEY[n], n } : null;
}

// ---- src/logic/anzan.js ----
// anzan.js — 暗算トレーニング（D-046）。整数だけの問題（小数なし）を1回10問。設計 §13.46
// 1: くり上がりのある たし算（2けた＋2けた、和は2けた）
// 2: くり下がりのある ひき算（2けた－2けた）
// 3: かけ算（九九 2〜9の段）。半分は「7 × □ ＝ 56」の形（D-046: 1種類 100通りくらいにするため。64 ＋ 64 ＝ 128通り）
// 4: わり算（九九の ぎゃく、あまりなし）。半分は「□ ÷ 7 ＝ 8」の形（128通り）
// 5: くふうして暗算する 2けたの かけ算・わり算（2けた×1けた、2けた÷1けた で 答えが2けた）

const AN_KINDS = [
  { id: 1, name: 'くり上がりのある たし算', sub: '47 ＋ 38 など' },
  { id: 2, name: 'くり下がりのある ひき算', sub: '63 － 28 など' },
  { id: 3, name: 'かけ算（九九）', sub: '7 × 8 など' },
  { id: 4, name: 'わり算（九九の ぎゃく）', sub: '56 ÷ 7 など' },
  { id: 5, name: '2けたの かけ算・わり算', sub: '23 × 4、72 ÷ 3 など（くふうして暗算）' },
];
const AN_SESSION_SIZE = 10;

const r = (rng, lo, hi) => lo + rng.int(hi - lo + 1); // lo〜hi の整数

// 1問: { kind, a, b, op: '+'|'-'|'*'|'/', answer, text, hint, blank }。式は「a op b」。blank のときは □ の数が answer
function anMakeQuestion(rng, kind) {
  if (kind === 1) {
    const a1 = r(rng, 1, 9);
    const b1 = r(rng, 10 - a1, 9); // 一の位の和が10以上（くり上がる）
    const a10 = r(rng, 1, 7);
    const b10 = r(rng, 1, 8 - a10); // 十の位の和＋1 が 9 以下（和は2けた）
    const a = a10 * 10 + a1;
    const b = b10 * 10 + b1;
    return anQ(kind, a, b, '+', a + b, '一の位から。' + a1 + ' ＋ ' + b1 + ' ＝ ' + (a1 + b1) + ' で、十の位に 1 くり上がるよ。');
  }
  if (kind === 2) {
    const a1 = r(rng, 0, 8);
    const b1 = r(rng, a1 + 1, 9); // 一の位が ひけない（くり下がる）
    const a10 = r(rng, 2, 9);
    const b10 = r(rng, 1, a10 - 1);
    const a = a10 * 10 + a1;
    const b = b10 * 10 + b1;
    return anQ(kind, a, b, '-', a - b, '一の位が ひけないので、十の位から 1 かりて ' + (a1 + 10) + ' － ' + b1 + ' ＝ ' + (a1 + 10 - b1) + '。');
  }
  if (kind === 3) {
    const a = r(rng, 2, 9);
    const b = r(rng, 2, 9);
    if (rng.int(2) === 0) return anQ(kind, a, b, '*', a * b, a + 'の段を思い出そう。');
    return { ...anQ(kind, a, b, '*', b, a + 'の段で ' + a * b + ' になるのは？'), text: a + ' × □ ＝ ' + a * b, blank: true };
  }
  if (kind === 4) {
    const d = r(rng, 2, 9);
    const q = r(rng, 2, 9);
    if (rng.int(2) === 0) return anQ(kind, d * q, d, '/', q, d + ' × □ ＝ ' + d * q + ' の □ を さがそう（' + d + 'の段）。');
    return { ...anQ(kind, d * q, d, '/', d * q, '□ は、' + d + ' × ' + q + ' で もとめられるよ。'), text: '□ ÷ ' + d + ' ＝ ' + q, blank: true };
  }
  if (kind === 5) {
    if (rng.int(2) === 0) {
      // 2けた × 1けた: 十の位と一の位に分ける
      let a;
      do a = r(rng, 12, 49); while (a % 10 === 0);
      const b = r(rng, 2, 9);
      const t = a - (a % 10);
      return anQ(kind, a, b, '*', a * b, a + ' を ' + t + ' と ' + (a % 10) + ' に分けよう。' + t + ' × ' + b + ' ＝ ' + t * b + '、' + (a % 10) + ' × ' + b + ' ＝ ' + (a % 10) * b + '、たして ' + a * b + '。');
    }
    // 2けた ÷ 1けた（答えが2けた、あまりなし）: わりやすい数に分ける
    let d;
    let q;
    do {
      d = r(rng, 2, 9);
      q = r(rng, 11, 49);
    } while (d * q > 99 || q % 10 === 0);
    const x = d * q;
    const big = Math.floor(x / (10 * d)) * 10 * d; // 10×d の倍数のうち いちばん大きいもの
    return anQ(kind, x, d, '/', q, x + ' を ' + big + ' と ' + (x - big) + ' に分けよう。' + big + ' ÷ ' + d + ' ＝ ' + big / d + '、' + (x - big) + ' ÷ ' + d + ' ＝ ' + (x - big) / d + '、たして ' + q + '。');
  }
  throw new Error('anMakeQuestion: 種類が不正 ' + kind);
}

const AN_OP = { '+': '＋', '-': '－', '*': '×', '/': '÷' };
function anQ(kind, a, b, op, answer, hint) {
  return { kind, a, b, op, answer, text: a + ' ' + AN_OP[op] + ' ' + b + ' ＝', hint, blank: false };
}

// 1回分（n問）。同じ問題を くり返さない
function anMakeSet(rng, kind, n) {
  const out = [];
  const seen = new Set();
  let guard = 0;
  while (out.length < n) {
    const q = anMakeQuestion(rng, kind);
    guard += 1;
    if (seen.has(q.text) && guard < 1000) continue;
    seen.add(q.text);
    out.push(q);
  }
  return out;
}

// 答えの判定（整数の文字列で比べる。前の0・空白は無視）
function anCheck(input, answer) {
  const s = String(input == null ? '' : input).trim();
  if (!/^\d+$/.test(s)) return 'invalid';
  return String(Number(s)) === String(answer) ? 'ok' : 'ng';
}

// ---- src/logic/clock.js ----
// clock.js — じかん の セクション（秒・分・時間・日、時刻と時間）。設計 §13.20、D-016
// 倍率は 10 のべき乗ではない。ここ（CK_FACTORS）に1か所だけ置き、テストで独立した正解表と照合する。答えはすべて整数。

// 1 大きい単位 ＝ f 小さい単位
const CK_FACTORS = { '日>時間': 24, '時間>分': 60, '分>秒': 60 };
const CK_SESSION_SIZE = 5;
const CK_MAX_CHECKS = 2;

const CK_ITEMS = [
  { id: 'c1', kind: 'conv', from: '分', to: '秒', dir: 'x', pair: '分>秒', label: '分 → 秒' },
  { id: 'c2', kind: 'conv', from: '秒', to: '分', dir: 'd', pair: '分>秒', label: '秒 → 分' },
  { id: 'c3', kind: 'conv', from: '時間', to: '分', dir: 'x', pair: '時間>分', label: '時間 → 分' },
  { id: 'c4', kind: 'conv', from: '分', to: '時間', dir: 'd', pair: '時間>分', label: '分 → 時間' },
  { id: 'c5', kind: 'conv', from: '日', to: '時間', dir: 'x', pair: '日>時間', label: '日 → 時間' },
  { id: 'c6', kind: 'conv', from: '時間', to: '日', dir: 'd', pair: '日>時間', label: '時間 → 日' },
  { id: 'c7', kind: 'mix', label: '時間と分 → 分' },
  { id: 'c8', kind: 'split', label: '分 → 時間と分' },
  { id: 'c9', kind: 'after', label: '何分後の時刻' },
  { id: 'c10', kind: 'diff', label: '時刻と時刻の間' },
];

function ckById(id) {
  const it = CK_ITEMS.find((x) => x.id === id);
  if (!it) throw new Error('ckById: 未知の項目 ' + id);
  return it;
}

function ckOpLabel(op) {
  return (op.dir === 'x' ? '×' : '÷') + op.f;
}

const ckR = (rng, lo, hi, step = 1) => lo + step * rng.int(Math.floor((hi - lo) / step) + 1);
const ckTime = (h, m) => h + '時' + (m ? m + '分' : '');

// ①の4択: 正解、向きの逆（dir）、10進法との取り違え（dec: ×100 など）、ほかの倍率（mag: 60 と 24）
function ckOptions(rng, it) {
  const f = CK_FACTORS[it.pair];
  const other = f === 60 ? 24 : 60;
  const opp = it.dir === 'x' ? 'd' : 'x';
  const list = [
    { dir: it.dir, f, correct: true, t: null },
    { dir: opp, f, correct: false, t: 'dir' },
    { dir: it.dir, f: 100, correct: false, t: 'dec' },
    { dir: it.dir, f: other, correct: false, t: 'mag' },
  ];
  return qShuffle(rng, list).map((o) => ({ ...o, label: ckOpLabel(o) }));
}

// 問題。support 2 は小さい数（1〜5）、それ以外は 1〜12。答えはすべて整数
// 返す: { id, kind, text, fields: [{ unit }], answers: [整数], steps, options（conv だけ）, op（conv だけ） }
function ckMakeQuestion(rng, id, support) {
  const it = ckById(id);
  if (it.kind === 'conv') {
    const f = CK_FACTORS[it.pair];
    const n = ckR(rng, 1, support >= 2 ? 5 : 12);
    const value = it.dir === 'x' ? n : n * f;
    const answer = it.dir === 'x' ? n * f : n;
    return {
      id, kind: 'conv', text: value + ' ' + it.from + ' は何 ' + it.to + '？', value, from: it.from, to: it.to,
      fields: [{ unit: it.to }], answers: [answer], op: { dir: it.dir, f }, options: ckOptions(rng, it),
      steps: ['1 ' + (it.dir === 'x' ? it.from : it.to) + ' ＝ ' + f + ' ' + (it.dir === 'x' ? it.to : it.from), value + ' ' + ckOpLabel({ dir: it.dir, f }) + ' ＝ ' + answer],
    };
  }
  if (it.kind === 'mix') {
    const h = ckR(rng, 1, 5);
    const m = ckR(rng, 5, 55, 5);
    const ans = h * 60 + m;
    return { id, kind: 'mix', text: h + '時間' + m + '分は何分？', params: { h, m }, fields: [{ unit: '分' }], answers: [ans],
      steps: ['1時間 ＝ 60分 だから ' + h + '時間 ＝ ' + h * 60 + '分', h * 60 + ' ＋ ' + m + ' ＝ ' + ans + '分'] };
  }
  if (it.kind === 'split') {
    const h = ckR(rng, 1, 4);
    const m = ckR(rng, 5, 55, 5);
    const total = h * 60 + m;
    return { id, kind: 'split', text: total + '分は何時間何分？', params: { total }, fields: [{ unit: '時間' }, { unit: '分' }], answers: [h, m],
      steps: ['60分 ＝ 1時間。' + total + ' の中に 60 が ' + h + '個（' + h * 60 + '分）', total + ' − ' + h * 60 + ' ＝ ' + m + ' だから ' + h + '時間' + m + '分'] };
  }
  if (it.kind === 'after') {
    const H = ckR(rng, 7, 10);
    const M = ckR(rng, 0, 55, 5);
    const d = ckR(rng, 10, 50, 5);
    const t = H * 60 + M + d; // 10時55分 ＋ 50分 ＝ 11時45分 なので 12時をこえない
    const h2 = Math.floor(t / 60);
    const m2 = t % 60;
    const toNext = 60 - M;
    const steps = M + d < 60
      ? [M + ' ＋ ' + d + ' ＝ ' + (M + d) + '分（60分に ならない）', '答えは ' + ckTime(h2, m2)]
      : [ckTime(H, M) + ' から ' + (H + 1) + '時 まで ' + toNext + '分', d + ' − ' + toNext + ' ＝ ' + (d - toNext) + '分 だから ' + ckTime(h2, m2)];
    return { id, kind: 'after', text: ckTime(H, M) + ' の ' + d + '分後は何時何分？', params: { H, M, d }, fields: [{ unit: '時' }, { unit: '分' }], answers: [h2, m2], steps };
  }
  if (it.kind === 'diff') {
    const H = ckR(rng, 8, 10);
    const M = ckR(rng, 0, 55, 5);
    const d = ckR(rng, 15, 55, 5);
    const t = H * 60 + M + d;
    const h2 = Math.floor(t / 60);
    const m2 = t % 60;
    const steps = h2 === H
      ? [m2 + ' − ' + M + ' ＝ ' + d + '分']
      : [ckTime(H, M) + ' から ' + h2 + '時 まで ' + (60 - M) + '分', h2 + '時 から ' + ckTime(h2, m2) + ' まで ' + m2 + '分', (60 - M) + ' ＋ ' + m2 + ' ＝ ' + d + '分'];
    if (steps.length === 1) steps.unshift('同じ ' + H + '時の間');
    return { id, kind: 'diff', text: ckTime(H, M) + ' から ' + ckTime(h2, m2) + ' までは何分？', params: { H, M, h2, m2 }, fields: [{ unit: '分' }], answers: [d], steps };
  }
  throw new Error('ckMakeQuestion: 未知の種類');
}

// ---------- 1問の流れ（必ず終わる。§5 と同じ記録の種類） ----------
// stage: 's1'（①を選ぶ）/ 's2'（②を計算）/ 'direct'（直接）/ 'input'（組み合わせの入力）/ 'done'
function ckFlowStart(q, support) {
  let stage;
  if (q.kind !== 'conv') stage = 'input';
  else stage = support === 0 ? 'direct' : 's1';
  return { stage, disabled: [], first: null, inputErrors: 0, hint: false, showAnswer: false, feedback: null, wentS1: false };
}

function ckFlowHint(f) {
  return { ...f, hint: true };
}

function ckFlowChoose(f, q, i) {
  if (f.stage !== 's1') return f;
  const o = q.options[i];
  if (!o || f.disabled.includes(i)) return { ...f, feedback: { kind: 'disabled' } };
  if (o.correct) return { ...f, stage: 's2', feedback: { kind: 'ok1' } };
  return { ...f, disabled: [...f.disabled, i], first: f.first || { stage: 's1', t: o.t }, feedback: { kind: 'ng1', t: o.t } };
}

// values: 入力の文字列の配列。数でなければ 'invalid'
function ckFlowInput(f, q, values) {
  if (!['s2', 'direct', 'input'].includes(f.stage)) return f;
  const nums = values.map((v) => {
    const s = String(v || '').replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).trim();
    return /^\d+$/.test(s) ? Number(s) : null;
  });
  if (nums.length !== q.answers.length || nums.some((x) => x === null)) return { ...f, feedback: { kind: 'invalid' } };
  const ok = nums.every((x, i) => x === q.answers[i]);
  if (ok) return { ...f, stage: 'done', feedback: { kind: 'ok' } };
  if (f.stage === 'direct') {
    // 直接で誤り: ①から（§5 の段階0と同じ）
    return { ...f, stage: 's1', wentS1: true, first: f.first || { stage: 'direct', t: null }, feedback: { kind: 'ng0' } };
  }
  const n = f.inputErrors + 1;
  const first = f.first || { stage: f.stage === 's2' ? 's2' : 'input', t: null };
  if (n >= 2) return { ...f, inputErrors: n, first, stage: 'done', showAnswer: true, feedback: { kind: 'ng2' } };
  return { ...f, inputErrors: n, first, feedback: { kind: 'ng2' } };
}

// 記録（§5 と同じ形）。最初の誤りの段階で決める
function ckFlowRecord(f, support) {
  let r = 'ok';
  let t = null;
  if (f.first) {
    if (f.first.stage === 'direct' || support === 0) r = 'e0';
    else if (f.first.stage === 's1') { r = 'e1'; t = f.first.t; }
    else r = 'e2';
  }
  return { r, t, s: support, h: f.hint };
}

function ckFirstRecord(f, support) {
  return f.first ? ckFlowRecord(f, support) : null;
}

// ---------- 出題 ----------
function ckPick(rng, states, today) {
  const st = states || {};
  const keys = CK_ITEMS.map((x) => x.id);
  const due = keys.filter((k) => pgIsCheckDue(st[k], today));
  const out = [];
  const pool = due.slice();
  while (out.length < CK_MAX_CHECKS && pool.length) out.push({ key: pool.splice(rng.int(pool.length), 1)[0], isCheck: true });
  let prev = out.length ? out[out.length - 1].key : null;
  while (out.length < CK_SESSION_SIZE) {
    let cands = keys.filter((k) => k !== prev);
    const w = (k) => pgWeight(st[k]);
    if (!cands.some((k) => w(k) > 0)) cands = keys.some((k) => w(k) > 0) ? keys : cands;
    const any = cands.some((k) => w(k) > 0);
    const total = cands.reduce((a, k) => a + (any ? w(k) : 1), 0);
    let r = rng.int(total);
    let pick = cands[cands.length - 1];
    for (const k of cands) {
      r -= any ? w(k) : 1;
      if (r < 0) { pick = k; break; }
    }
    out.push({ key: pick, isCheck: false });
    prev = pick;
  }
  return out.map((x) => ({ ...x, key: 'ck:' + x.key, isClock: true, isProbe: false }));
}

function ckHasWork(states, today) {
  const st = states || {};
  return CK_ITEMS.some((it) => {
    const s = st[it.id];
    return !s || s.support > 0 || s.weak || pgIsCheckDue(s, today);
  });
}

function ckPickLabel(id) {
  return ckById(id).label;
}


// ---- src/logic/memtest.js ----
// memtest.js — きおくテスト（1日1回、できた から古い順に5問、ヒントなし）と、ログイン・週のスタンプ。設計 §13.21、D-017

// 最初の答えで正解した数 → 点。5問中 5 → 40、4 → 20、それ以下 → 5
const MT_POINTS = [5, 5, 5, 5, 20, 40];
const MT_MIN_MASTERED = 5;
const MT_LOGIN_BONUS = 10;
const MT_WEEK_STAMPS = 5;
const MT_WEEK_BONUS = 50;

function mtPoints(correct, n) {
  if (!Number.isInteger(correct) || correct < 0 || correct > n || n !== PG_SESSION_SIZE) throw new Error('mtPoints: 正解数が不正 ' + correct + '/' + n);
  return MT_POINTS[correct];
}

// できた の項目: [{ key, lastSeen }]。レベル1〜3は単位のキー、じかん は 'ck:cN'
function mtCandidates(items, clock) {
  const out = [];
  for (const it of unitItemsAll()) if (pgMastered((items || {})[it.key])) out.push({ key: it.key, lastSeen: items[it.key].lastSeen });
  for (const it of CK_ITEMS) if (pgMastered((clock || {})[it.id])) out.push({ key: 'ck:' + it.id, lastSeen: clock[it.id].lastSeen });
  return out;
}

function mtAvailable(items, clock) {
  return mtCandidates(items, clock).length >= MT_MIN_MASTERED;
}

function mtDoneToday(sessions, today) {
  return (sessions || []).some((s) => s.date === today && s.mode === 'memtest');
}

// 5問。lastSeen が古い順（記録が無ければいちばん古い扱い）。同じ日は乱数で並べる。同じ項目は1回だけ
function mtPick(rng, items, clock, today) {
  const c = mtCandidates(items, clock);
  if (c.length < MT_MIN_MASTERED) return [];
  const age = (x) => (x.lastSeen ? pgDaysBetween(x.lastSeen, today) : 100000);
  const tagged = c.map((x) => ({ x, a: age(x), r: rng.int(1000000) }));
  tagged.sort((p, q) => q.a - p.a || p.r - q.r);
  return tagged.slice(0, PG_SESSION_SIZE).map(({ x }) => (x.key.startsWith('ck:')
    ? { key: x.key, isClock: true, isCheck: true, isProbe: false, isMemtest: true }
    : { key: x.key, isCheck: true, isProbe: false, isMemtest: true }));
}

// その日の週（月曜はじまり）の月曜日
function mtWeekStart(day) {
  const [y, m, d] = day.split('-').map(Number);
  const t = Date.UTC(y, m - 1, d);
  const dow = new Date(t).getUTCDay(); // 0 日曜
  const mon = new Date(t - ((dow + 6) % 7) * 86400000);
  const p = (n) => String(n).padStart(2, '0');
  return mon.getUTCFullYear() + '-' + p(mon.getUTCMonth() + 1) + '-' + p(mon.getUTCDate());
}

// 今週のスタンプの数（学習を1回でも終えた日の数。ボーナスは数えない。D-021）
function mtWeekStamps(sessions, today) {
  const w = mtWeekStart(today);
  const days = new Set((sessions || []).filter((s) => s.mode && s.mode !== 'bonus' && s.date && mtWeekStart(s.date) === w).map((s) => s.date));
  return days.size;
}

// 回を足した後の sessions で、まだもらっていないボーナス: [{ id, points, kind: 'login'|'week' }]
function mtDueBonuses(sessions, today) {
  const ss = sessions || [];
  const has = (id) => ss.some((s) => s.id === id);
  const out = [];
  if (ss.some((s) => s.date === today && s.mode !== 'bonus') && !has('login-' + today)) out.push({ id: 'login-' + today, points: MT_LOGIN_BONUS, kind: 'login' });
  const wid = 'week-' + mtWeekStart(today);
  if (mtWeekStamps(ss, today) >= MT_WEEK_STAMPS && !has(wid)) out.push({ id: wid, points: MT_WEEK_BONUS, kind: 'week' });
  return out;
}

// ---- src/logic/challenge.js ----
// challenge.js — タイムチャレンジ（60秒・4択）。問題、得点、1日のポイントの回数。設計 §13.8、D-010

const TC_SECONDS = 60;
const TC_DAILY_MAX = 1; // D-017（D-011 は 3）
const TC_UNLOCK_MASTERED = 8;
const TC_WRONG_SHOW_MS = 1000;

// 1問。masteredKeys: できた 項目、prefixKeys: おぼえた（box 3）接頭語の問題、prevKey: 直前の問題のキー
// 返す: { key, kind: 'conv'|'prefix', text, options: [{ label, correct }] }
function tcMakeQuestion(rng, masteredKeys, prefixKeys, prevKey) {
  let pk = prefixKeys.filter((k) => k !== prevKey);
  let mk = masteredKeys.filter((k) => k !== prevKey);
  if (!pk.length && !mk.length) {
    pk = prefixKeys.slice();
    mk = masteredKeys.slice();
  }
  const usePrefix = pk.length > 0 && (mk.length === 0 || rng.int(4) === 0);
  if (usePrefix) {
    const q = prefixMakeQuestion(rng, qPick(rng, pk));
    return { key: q.key, kind: 'prefix', text: q.text, options: q.options.map((o) => ({ label: o.label, correct: o.correct })) };
  }
  if (!mk.length) throw new Error('tcMakeQuestion: 出せる問題が無い');
  const item = unitItemByKey(qPick(rng, mk));
  const q = qMakeQuestion(rng, item, 1);
  const options = q.options.map((o) => ({ label: decToString(qApplyOp(q.value, o)) + ' ' + item.to, correct: o.correct }));
  return { key: item.key, kind: 'conv', text: decToString(q.value) + ' ' + item.from + ' は何 ' + item.to + '？', options };
}

// 1問の得点。combo はその直前までの連続正解数
function tcPoints(combo) {
  return 2 + Math.min(3, Math.floor(combo / 5));
}

// 答えの列（true/false）から得点と式を作る
function tcScore(results) {
  let combo = 0;
  let correct = 0;
  let bonus = 0;
  for (const ok of results) {
    if (ok) {
      bonus += tcPoints(combo) - 2;
      correct += 1;
      combo += 1;
    } else {
      combo = 0;
    }
  }
  const score = correct * 2 + bonus;
  return { n: results.length, correct, bonus, score, formula: '正解 ' + correct + ' × 2 ＋ コンボ ' + bonus + ' ＝ ' + score };
}

// 今日すでに終えたタイムチャレンジの回数（最初の TC_DAILY_MAX 回だけポイントになる）
function tcCountToday(sessions, today) {
  return (sessions || []).filter((s) => s.mode === 'time' && s.date === today).length;
}

// ポイントは得点の 1/3 を四捨五入（0.5 切り上げ）。D-011、保護者の決定
function tcPointsFromScore(score) {
  return Math.floor((2 * score + 3) / 6);
}

function tcPointsFor(score, sessions, today) {
  return tcCountToday(sessions, today) < TC_DAILY_MAX ? tcPointsFromScore(score) : 0;
}

function tcReady(items) {
  return pgMasteredKeys(items).length >= TC_UNLOCK_MASTERED;
}

// ---- src/logic/coach.js ----
// coach.js — きょうの れんしゅう（おすすめ）、回の終わりの出来事、解放。設計 §13.5〜13.8、D-010

// じかん の クリア: 10項目がすべて できた（D-016。段位の「クリア」には数えない）
function coClockCleared(p) {
  return CK_ITEMS.every((it) => pgMastered((p.clock || {})[it.id]));
}
function coClockMastered(p) {
  return CK_ITEMS.filter((it) => pgMastered((p.clock || {})[it.id])).length;
}

// 文章題を出せるレベル: できた が半分以上（D-015）
function coWordLevels(p) {
  return [1, 2, 3].filter((lv) => {
    const g = pgLevelProgress(p.items, lv);
    return g.mastered >= Math.ceil(g.total / 2);
  });
}

// レベルのクリア: 換算の項目がすべて できた、かつ 意味の問題がすべて「わかった」（D-014）
function coLevelCleared(p, level) {
  const g = pgLevelProgress(p.items, level);
  return g.mastered === g.total && mnLevelDone(p.meaning, level);
}

const CO_RECENT_DAYS = 7;
const CO_ERR_MIN = 3;

function coDoneToday(p, today, mode) {
  return (p.sessions || []).some((s) => s.date === today && s.mode === mode);
}

// 最近（lastSeen が7日以内）の項目の recent にある e1・e2 の件数
function coRecentErrors(items, today) {
  const c = { e1: 0, e2: 0 };
  for (const it of unitItemsAll()) {
    const st = items[it.key];
    if (!st || !st.lastSeen || pgDaysBetween(st.lastSeen, today) > CO_RECENT_DAYS) continue;
    for (const r of st.recent) if (r.r === 'e1' || r.r === 'e2') c[r.r] += 1;
  }
  return c;
}

// そのレベルで今日すすめられることがあるか（段階1・2、記録なし、今日の確認）
function coLevelHasWork(items, level, today) {
  return unitItems(level).some((it) => {
    const st = items[it.key];
    return !st || st.support > 0 || pgIsCheckDue(st, today);
  });
}

function coL4Available(p) {
  return !!(p.unlocked && p.unlocked.L4) || pgL4Ready(p.items);
}

function coTimeAvailable(p) {
  return !!(p.unlocked && p.unlocked.time) || tcReady(p.items);
}

// きょうの れんしゅう。返す: { mode, level, reason, rest? }
function coRecommend(p, today) {
  const items = p.items;
  // きおくテスト（D-017）: 使えて今日まだなら、いちばん初めに
  if (mtAvailable(items, p.clock) && !mtDoneToday(p.sessions, today)) return { mode: 'memtest', level: null, reason: '今日の きおくテスト' };
  if (pgWeakKeys(items).length > 0 && !coDoneToday(p, today, 'review')) return { mode: 'review', level: null, reason: 'がんばり中を直そう（ポイント 2倍）' };
  const err = coRecentErrors(items, today);
  if (err.e1 >= CO_ERR_MIN && prefixLearned(p.prefix) < prefixKeys().length && !coDoneToday(p, today, 'prefix')) {
    return { mode: 'prefix', level: null, reason: '単位の名前を覚えよう' };
  }
  if (err.e2 >= CO_ERR_MIN && !coDoneToday(p, today, 'drill')) return { mode: 'drill', level: 1, reason: '×10 の計算を きたえよう' };
  // じかん（D-016）: クリアしておらず、今日すすめられることがあり、今日まだなら（1日1回）
  if (!coClockCleared(p) && ckHasWork(p.clock, today) && !coDoneToday(p, today, 'clock')) return { mode: 'clock', level: null, reason: 'タイミーと時間の練習' };
  for (const lv of [1, 2, 3]) {
    if (!coLevelCleared(p, lv) && (coLevelHasWork(items, lv, today) || mnNextFor(p.meaning, lv, today))) return { mode: 'normal', level: lv, reason: 'レベル' + lv + ' を進めよう' };
  }
  // レベル1〜3でやることが無く、出せる文章題に「とけた」でないものがあれば文章題（D-015）
  if (wdKeysFor(coWordLevels(p)).some((k) => !wdDone((p.word || {})[k])) && !coDoneToday(p, today, 'word')) return { mode: 'word', level: null, reason: '文章題にチャレンジ' };
  // レベル1〜3でやることが無く、接頭語がまだなら接頭語クイズ（八段への道。D-013）
  if (prefixLearned(p.prefix) < prefixKeys().length && !coDoneToday(p, today, 'prefix')) return { mode: 'prefix', level: null, reason: 'キロ・ミリ クイズで次の段へ' };
  // レベル4とタイムチャレンジ: 次の段位に足りないほうを先に。両方足りている・両方足りないときは、今日やった回数が少ないほう（R-007）
  const l4 = coL4Available(p) && pgMasteredKeys(items).length >= PG_SESSION_SIZE;
  const tm = coTimeAvailable(p) && tcCountToday(p.sessions, today) < TC_DAILY_MAX;
  const L4R = { mode: 'l4', level: 4, reason: 'ごちゃまぜで確かめよう' };
  const TMR = { mode: 'time', level: null, reason: 'タイムチャレンジで かせごう' };
  if (l4 && tm) {
    const st = coRankStats(p);
    const needL4 = st.l4perfect < 3;
    const needTm = st.tcBest < 60;
    if (needL4 !== needTm) return needL4 ? L4R : TMR;
    const n = (m) => (p.sessions || []).filter((s) => s.date === today && s.mode === m).length;
    return n('time') < n('l4') ? TMR : L4R;
  }
  if (l4) return L4R;
  if (tm) return TMR;
  return { mode: 'drill', level: 1, reason: '今日はここまで。明日 確かめよう', rest: true };
}

// 回の初め（before）と終わり（after）のプロファイルを比べた出来事（clear・prefix・unlock）。設計 §13.5
// 返す: { events: [{ date, kind, key }], unlock: ['L4'|'time'] }
function coSessionEvents(before, after, today) {
  const events = [];
  const unlock = [];
  const log = after.log || [];
  for (const lv of [1, 2, 3]) {
    const key = 'L' + lv;
    if (coLevelCleared(after, lv) && !log.some((x) => x.kind === 'clear' && x.key === key)) events.push({ date: today, kind: 'clear', key });
  }
  const bp = before.prefix || {};
  const ap = after.prefix || {};
  for (const k of prefixKeys()) {
    const was = bp[k] && bp[k].box >= PREFIX_BOX_MAX;
    const now = ap[k] && ap[k].box >= PREFIX_BOX_MAX;
    if (!was && now) events.push({ date: today, kind: 'prefix', key: k });
  }
  if (coClockCleared(after) && !log.some((x) => x.kind === 'clockclear')) events.push({ date: today, kind: 'clockclear', key: 'clock' });
  const un = after.unlocked || {};
  if (!un.L4 && pgL4Ready(after.items)) { unlock.push('L4'); events.push({ date: today, kind: 'unlock', key: 'L4' }); }
  if (!un.time && tcReady(after.items)) { unlock.push('time'); events.push({ date: today, kind: 'unlock', key: 'time' }); }
  return { events, unlock };
}

// ---------- 段位（設計 §13.16、D-013） ----------
// 条件: mastered（できた の数）、clears（クリアしたレベルの数）、prefix（おぼえた接頭語の数）、l4perfect（レベル4 全問正解の回数）、tcBest（タイムチャレンジ じこベスト）
const CO_RANKS = [
  { name: '初段', need: 'はじめから', ok: () => true },
  { name: '二段', need: 'できた を 4個にしよう', ok: (s) => s.mastered >= 4 },
  { name: '三段', need: 'レベルを 1つ クリアしよう', ok: (s) => s.clears >= 1 },
  { name: '四段', need: 'できた を 14個にしよう', ok: (s) => s.mastered >= 14 },
  { name: '五段', need: 'レベルを 2つ クリアしよう', ok: (s) => s.clears >= 2 },
  { name: '六段', need: 'できた を 28個にしよう', ok: (s) => s.mastered >= 28 },
  { name: '七段', need: 'レベル1〜3を全部 クリアしよう', ok: (s) => s.clears >= 3 },
  { name: '八段', need: 'キロ・ミリ クイズを全部覚えよう', ok: (s) => s.prefix >= s.prefixTotal },
  { name: '師範', need: 'レベル4 で全問正解しよう', ok: (s) => s.l4perfect >= 1 },
  { name: '免許皆伝', need: 'レベル4 で全問正解を 3回、タイムチャレンジで 60点', ok: (s) => s.l4perfect >= 3 && s.tcBest >= 60 },
];

function coRankStats(p) {
  const clearKeys = new Set((p.log || []).filter((x) => x.kind === 'clear').map((x) => x.key));
  for (const lv of [1, 2, 3]) if (coLevelCleared(p, lv)) clearKeys.add('L' + lv);
  return {
    mastered: pgMasteredKeys(p.items).length,
    clears: clearKeys.size,
    prefix: prefixLearned(p.prefix),
    prefixTotal: prefixKeys().length,
    // 全問を最初の1回・ヒントなしで正解した回（clean。R-007）。clean の無い記録は数えない
    l4perfect: (p.sessions || []).filter((s) => s.mode === 'l4' && s.n > 0 && s.clean === s.n).length,
    tcBest: (p.best && p.best.time) || 0,
  };
}

// 今の段位の番号（記録した段位から上へ、条件を満たすだけ上げる。下がらない）
function coRankIndex(p) {
  const st = coRankStats(p);
  let i = p.rank ? p.rank.i : 0;
  while (i + 1 < CO_RANKS.length && CO_RANKS[i + 1].ok(st)) i += 1;
  return i;
}

// ---------- 途中の伸びを見せる（設計 §13.28、D-026） ----------
// たしかめ まち: 段階0・苦手でない・できた でない項目（レベル1〜3と じかん）。今日たしかめられるものと、それ以外
function coCheckWaiting(p, today) {
  const out = { today: 0, later: 0 };
  const add = (st) => {
    if (!st || st.support !== 0 || st.weak || pgMastered(st)) return;
    if (pgIsCheckDue(st, today)) out.today += 1;
    else out.later += 1;
  };
  for (const it of unitItemsAll()) add((p.items || {})[it.key]);
  for (const it of CK_ITEMS) add((p.clock || {})[it.id]);
  return out;
}

// レベルの段階: できた・いきなり（段階0）・ずなし（段階1）・ずあり（段階2で取り組んだ）・まだ
function coLevelStages(items, level) {
  const out = { total: 0, done: 0, direct: 0, nofig: 0, fig: 0, fresh: 0 };
  for (const it of unitItems(level)) {
    const st = (items || {})[it.key];
    out.total += 1;
    if (pgMastered(st)) out.done += 1;
    else if (!st || st.attempts === 0) out.fresh += 1;
    else if (st.support === 0) out.direct += 1;
    else if (st.support === 1) out.nofig += 1;
    else out.fig += 1;
  }
  return out;
}

// こんしゅう できるように なったこと（月曜はじまり）。log は新しい順
const CO_WEEK_KINDS = ['mastered', 'overcome', 'clear', 'clockclear', 'rank', 'word', 'meaning', 'prefix', 'jump'];
function coWeekDone(p, today) {
  const w = mtWeekStart(today);
  return (p.log || []).filter((e) => CO_WEEK_KINDS.includes(e.kind) && e.date && e.date >= w && e.date <= today);
}

// ほかの練習（苦手復習・ドリル1・ドリル2・キロ・ミリ クイズ・文章題）は、それぞれ1日2回まで（D-037）。
// 短い時間でできるので、ポイントの取りすぎを防ぐ。ドリルは 1 と 2 を別に数える。途中でやめた回は数えない（記録が残らないため）
const CO_OTHER_MODES = ['review', 'drill', 'prefix', 'word', 'real', 'anzan']; // anzan は D-046（種類ごとに数える）
// D-045: ちょーじょ以外は3倍（6回）。ちょーじょは学年が上で解くのが速いので 2回のまま
const CO_OTHER_DAILY_MAX = 6;
const CO_OTHER_DAILY_MAX_BY = { p1: 2 };
function coOtherMax(pid) {
  return CO_OTHER_DAILY_MAX_BY[pid] ?? CO_OTHER_DAILY_MAX;
}
function coOtherLeft(sessions, today, mode, level, pid) {
  if (!CO_OTHER_MODES.includes(mode)) return Infinity;
  const n = (sessions || []).filter((s) => s && s.date === today && s.mode === mode && ((mode !== 'drill' && mode !== 'anzan') || s.level === level)).length;
  return Math.max(0, coOtherMax(pid) - n);
}

// 身近なもの クイズ（D-040）で出してよいレベル: レベル1と、1問でも練習したレベル
function coRealLevels(p) {
  const items = p.items || {};
  return [1, 2, 3].filter((lv) => lv === 1 || unitItems(lv).some((it) => items[it.key]));

  uiS.ctx = { ls, tabId: uiTabId, rev: r.data.rev, mode: r.mode };

// 位取り表（10列のうち使う列だけ。D-014 で 0.001 の位まで）
function uiPlaceTable(before, after, op) {
  const cols = (x) => {
    const [i, f = ''] = decToString(x).split('.');
    const m = {};
    for (let j = 0; j < i.length; j++) m[6 - (i.length - 1 - j)] = i[j];
    for (let j = 0; j < f.length && j < 3; j++) m[7 + j] = f[j];
    return m;
  };
  const a = cols(before);
  const b = cols(after);
  const used = Object.keys(a).concat(Object.keys(b)).map(Number);
  const lo = Math.min(...used, 6);
  const hi = Math.max(...used, 6);
  const shift = (op.dir === 'x' ? -1 : 1) * op.k * 36;
  let h = '<table class="place"><tr><th></th>';
  for (let c = lo; c <= hi; c++) h += '<th>' + UI_PLACE_NAMES[c] + '</th>';
  h += '</tr>';
  const row = (m, cls, lab) => {
    let r = '<tr class="' + cls + '" style="--from:' + -shift + 'px"><td class="lab">' + lab + '</td>';
    for (let c = lo; c <= hi; c++) r += '<td class="' + (c === 7 ? 'pt' : '') + '">' + (m[c] !== undefined ? m[c] : '') + '</td>';
    return r + '</tr>';
  };
  h += row(a, 'before', '前') + row(b, 'after', qOpLabel(op) + ' の後') + '</table>';
  const dirText = op.k === 0 ? '動かない' : op.k + 'けた ' + (op.dir === 'x' ? '左' : '右') + 'へ動く';
  return '<div class="figure">' + h + '<div class="muted">' + qOpLabel(op) + ' で、数字が ' + dirText + 'よ（小数点の位置が変わる）。</div></div>';
}

  if (AV_IDS.includes(p.id)) h += '<p class="av-say">' + uiEsc(UI_AV_SAY[avIsFirst(p.sessions) ? 'first' : avMood(p.sessions, pgToday())]) + '</p>';
  if (ri + 1 < CO_RANKS.length) h += '<p class="muted">次の段「' + uiEsc(CO_RANKS[ri + 1].name) + '」: ' + uiEsc(CO_RANKS[ri + 1].need) + '</p>';
  else h += '<p class="fb ok">免許皆伝！ 全部できるようになったね。</p>';
  h += '<div class="row stat"><div>使えるポイント <b>' + p.available + '</b></div><div>これまでの合計 <b>' + p.total + '</b></div></div>';
  if (uiS.mode === 'readonly') h += '<p class="fb hint">この版では練習できません。新しい版で開いてね。</p>';
  const dis = uiS.mode === 'readonly' ? ' disabled' : '';
  const today = pgToday();
  const rec = coRecommend(p, today);
  h += '<div class="rec">';
  if (rec.rest) h += '<p class="fb info">' + uiEsc(rec.reason) + '</p>';
  h += '<button class="primary big rec-btn" data-act="start" data-mode="rec"' + dis + '>今日の練習<br><span class="rec-why">' + uiEsc(rec.rest ? 'ドリルで ウォーミングアップ' : rec.reason) + '</span></button></div>';
  // きおくテスト と 週のスタンプ（D-017）
  {
    const mOk = mtAvailable(p.items, p.clock);
    const mDone = mtDoneToday(p.sessions, today);
    const stamps = Math.min(MT_WEEK_STAMPS, mtWeekStamps(p.sessions, today));
    const mn = mtCandidates(p.items, p.clock).length;
    h += '<div class="memtest-row"><button class="big memtest-btn" data-act="start" data-mode="memtest"' + (mOk && !mDone ? dis : ' disabled') + '>きおくテスト<br><span class="muted">'
      + (mDone ? '今日は受けたよ。また明日！' : mOk ? '1日1回・ヒントなし・満点で ' + MT_POINTS[5] + '点' : 'できた が ' + MT_MIN_MASTERED + '個になったら（今 ' + mn + '個）') + '</span></button>';
    h += '<p class="daily-bar">今週のスタンプ <span class="stamps">' + '●'.repeat(stamps) + '○'.repeat(MT_WEEK_STAMPS - stamps) + '</span> ' + stamps + ' / ' + MT_WEEK_STAMPS + (stamps >= MT_WEEK_STAMPS ? ' <b class="clear">＋' + MT_WEEK_BONUS + '！</b>' : '（5個で ＋' + MT_WEEK_BONUS + '点）') + '</p></div>';
  }
  const weakKeys = pgWeakKeys(p.items).concat(CK_ITEMS.filter((it) => (p.clock || {})[it.id] && p.clock[it.id].weak).map((it) => 'ck:' + it.id));
  if (weakKeys.length) h += '<p>今がんばっていること: ' + weakKeys.map((k) => '<span class="chip weak">' + uiEsc(uiItemLabel(k)) + '</span>').join('') + '</p>';
  // 途中の伸び（D-026）: たしかめ まち と、こんしゅう できるように なったこと
  {
    const cw = coCheckWaiting(p, today);
    if (cw.today || cw.later) {
      h += '<p class="waiting">' + (cw.today ? '<span class="chip learn">今日確かめられる <b>' + cw.today + '</b> 個</span>' : '')
        + (cw.later ? '<span class="chip learn">明日確かめ待ち <b>' + cw.later + '</b> 個</span>' : '')
        + '<span class="muted">（正解すると「できた」になるよ）</span></p>';
    }
    const wk = coWeekDone(p, today);
    h += '<div class="card week"><b>今週できるようになったこと</b>';
    if (!wk.length) h += '<p class="muted">今週はまだこれから。1回やってみよう！</p>';
    else {
      h += '<ul class="list">' + wk.slice(0, 6).map((e) => '<li>' + uiEsc(uiEventText(e)) + '</li>').join('') + '</ul>';
      if (wk.length > 6) h += '<p class="muted">ほか ' + (wk.length - 6) + ' 個</p>';
    }
    h += '</div>';
  }
  h += '<h2>練習</h2><div class="grid2">';
  for (const lv of [1, 2, 3]) h += '<button class="big level-btn" data-act="start" data-mode="normal" data-level="' + lv + '"' + dis + '>' + charaSvg(charaForLevel(lv).id, 'normal', 64) + '<span>レベル' + lv + '<br>' + UNIT_LEVELS[lv].name + '<br><span class="muted">' + charaForLevel(lv).name + '・できた ' + pgLevelProgress(p.items, lv).mastered + '/' + unitItems(lv).length + (coLevelCleared(p, lv) ? ' <b class="clear">クリア</b>' : '') + '</span>' + uiStageBar(coLevelStages(p.items, lv)) + '</span></button>';
  {
    const cm = coClockMastered(p);
    h += '<button class="big level-btn" data-act="start" data-mode="clock"' + dis + '>' + charaSvg('timmy', 'normal', 64) + '<span>時間<br>秒・分・時間・日<br><span class="muted">タイミー・できた ' + cm + '/' + CK_ITEMS.length + (coClockCleared(p) ? ' <b class="clear">クリア</b>' : '') + '</span></span></button>';
  }
  h += '</div><div class="row jump-row">';
  for (const lv of [1, 2, 3]) {
    if (pgJumpKeys(p.items, lv).length) h += '<button class="small" data-act="start" data-mode="jump" data-level="' + lv + '"' + dis + '>レベル' + lv + ' 補助なしでチャレンジ！<br><span class="muted">ポイント ' + SLOT_JUMP_MULT.label + '倍</span></button>';
  }
  h += '</div><div class="grid2">';
  const l4ok = coL4Available(p) && pgMasteredKeys(p.items).length >= PG_SESSION_SIZE;
  h += '<button class="big" data-act="start" data-mode="l4" data-level="4"' + (l4ok ? dis : ' disabled') + '>レベル4<br>ごちゃまぜ<br><span class="muted">' + (l4ok ? 'できた問題を混ぜて' : 'あと ' + Math.max(1, pgL4Need(p.items)) + '個できたら') + '</span></button>';
  const tcok = coTimeAvailable(p);
  const tcLeft = Math.max(0, TC_DAILY_MAX - tcCountToday(p.sessions, today));
  const best = (p.best && p.best.time) || 0;
  h += '<button class="big" data-act="start" data-mode="time"' + (tcok ? dis : ' disabled') + '>タイムチャレンジ<br><span class="muted">' + (tcok ? '自己ベスト ' + best + '・ポイント あと ' + tcLeft + '回' : 'できた が ' + TC_UNLOCK_MASTERED + '個になったら（今 ' + pgMasteredKeys(p.items).length + '個）') + '</span></button>';
  h += '</div><h2>ほかの練習</h2><p class="muted">それぞれ 1日' + coOtherMax(p.id) + '回まで</p><div class="grid2">';
  // 今日の残りの回数（D-037）。0 なら押せない
  const today0 = pgToday();
  const oLeft = (mode, level) => coOtherLeft(p.sessions, today0, mode, level, p.id);
  const oDis = (mode, level) => (oLeft(mode, level) === 0 ? ' disabled' : dis);
  const oNote = (mode, level) => '<br><span class="muted other-left">' + (oLeft(mode, level) === 0 ? '今日はおしまい。明日またできるよ' : '今日はあと ' + oLeft(mode, level) + '回') + '</span>';
  h += '<button data-act="start" data-mode="review"' + (weakN === 0 ? ' disabled' : oDis('review')) + '>苦手復習（' + weakN + '個）<br><span class="muted">ポイント ' + SLOT_REVIEW_MULT + '倍</span>' + (weakN === 0 ? '' : oNote('review')) + '</button>';
  h += '<button data-act="start" data-mode="drill" data-level="1"' + oDis('drill', 1) + '>かけ算・わり算ドリル1<br><span class="muted">×10・×100・×1000</span>' + oNote('drill', 1) + '</button>';
  h += '<button data-act="start" data-mode="drill" data-level="2"' + oDis('drill', 2) + '>かけ算・わり算ドリル2<br><span class="muted">×10000・×1000000 も</span>' + oNote('drill', 2) + '</button>';
  h += '<button data-act="start" data-mode="prefix"' + oDis('prefix') + '>キロ・ミリ クイズ<br><span class="muted">覚えた ' + prefixLearned(p.prefix) + ' / ' + prefixKeys().length + '</span>' + oNote('prefix') + '</button>';
  const wl = coWordLevels(p);
  const wdn = WORD.filter((w) => wdDone((p.word || {})[w.id])).length;
  h += '<button data-act="start" data-mode="word"' + (wl.length ? oDis('word') : ' disabled') + '>文章題<br><span class="muted">' + (wl.length ? '解けた ' + wdn + ' / ' + WORD.length : 'レベル1で できた を 4個にしよう') + '</span>' + (wl.length ? oNote('word') : '') + '</button>';
  h += '<button data-act="start" data-mode="real"' + oDis('real') + '>身近なもの クイズ<br><span class="muted">ベッド・テニスコート・牛乳パック</span>' + oNote('real') + '</button>';
  h += '<button data-act="whyopen">どうして × ・ ÷ ？<br><span class="muted">単位を直すときの考え方</span></button>';
  h += '<button data-act="rewards">ごほうび</button>';
  h += '</div>';
  // 暗算トレーニング（D-046）
  h += '<h2>暗算トレーニング</h2><p class="muted">10問を 速く正しく。全問正解したときのタイムが 自己ベストになるよ。</p><div class="grid2">';
  for (const k of AN_KINDS) {
    const best = ((p.anzan || {})[k.id] || {}).best;
    h += '<button data-act="start" data-mode="anzan" data-level="' + k.id + '"' + oDis('anzan', k.id) + '>' + uiEsc(k.name) + '<br><span class="muted">' + uiEsc(k.sub) + '</span><br><span class="muted">' + (best ? '自己ベスト ' + uiSec(best) : '自己ベスト まだ') + '</span>' + oNote('anzan', k.id) + '</button>';
  }
  h += '</div>';
  if (weakN === 0) h += '<p class="muted">苦手はありません。練習をしてみよう。</p>';
  if (themes.length > 1) {
    h += '<h3>スロットの色</h3><div class="row">';
    for (const th of themes) h += '<button class="small' + (p.theme === th.id ? ' primary' : '') + '" data-act="theme" data-id="' + th.id + '">' + th.name + '</button>';
    h += '</div>';
  }
  h += '<h2>できること マップ</h2>' + uiMap(p);
  const log = (p.log || []).filter((e) => STORE_LOG_KINDS.includes(e.kind)).slice(0, 5);
  if (log.length) {
    h += '<h3>できるように なった ノート</h3><ul class="list note">';
    for (const e of log) h += '<li><span class="muted">' + Number(e.date.slice(5, 7)) + '/' + Number(e.date.slice(8, 10)) + '</span> ' + uiEsc(uiEventText(e)) + '</li>';
    h += '</ul>';
  }
  h += '<p><button data-act="who">← 人を選びなおす</button></p>';
  return h;
}

// ---------- 学習の回 ----------
function uiStart(mode, level, fromRec) {
  const p = uiProfile();
  const today = pgToday();
  if (mode === 'rec') {
    const rec = coRecommend(p, today);
    uiStart(rec.mode, rec.level, true);
    return;
  }
  if (coOtherLeft(p.sessions, today, mode, level, p.id) === 0) return; // ほかの練習の1日の上限（D-037・D-045）
  if (mode === 'time') {
    uiTimeStart();
    return;
  }
  let list;
  if (mode === 'normal') list = pgPickNormal(uiRng, p.items, level, today);
  else if (mode === 'review') list = pgPickReview(uiRng, p.items);
  else if (mode === 'prefix') list = prefixPick(uiRng, p.prefix);
  else if (mode === 'l4') list = pgPickL4(uiRng, p.items, today);
  else if (mode === 'jump') list = pgPickJump(uiRng, p.items, level);
  else if (mode === 'word') list = wdPick(uiRng, p.word, coWordLevels(p), PG_SESSION_SIZE);
  else if (mode === 'real') list = realPick(uiRng, coRealLevels(p), PG_SESSION_SIZE).map((id) => ({ key: 'rl:' + id, isMeaning: true, isReal: true, isCheck: false, isProbe: false })); // 身近なもの クイズ（D-040）
  else if (mode === 'clock') list = ckPick(uiRng, p.clock, today);
  else if (mode === 'memtest') list = mtDoneToday(p.sessions, today) ? [] : mtPick(uiRng, p.items, p.clock, today);
  else if (mode === 'anzan') list = Array.from({ length: AN_SESSION_SIZE }, () => ({ key: 'anzan', isCheck: false })); // D-046
  else list = Array.from({ length: PG_SESSION_SIZE }, () => ({ key: 'drill', isCheck: false }));
  if (!list.length) return;
  // 意味の問題（D-014）: 通常の回で、そのレベルに「わかった」でない問題があり今日まだ答えていなければ、確認でない最後の1問と入れ替える
  if (mode === 'normal') {
    const mid = mnNextFor(p.meaning, level, today);
    let j = list.length - 1;
    while (j > 0 && list[j].isCheck) j -= 1;
    if (mid && !list[j].isCheck) list[j] = { key: 'mn:' + mid, isMeaning: true, isCheck: false, isProbe: false };
  }
  uiS.play = { rec: !!fromRec, before: storeClone(p), events: [], id: uiTabId + '-' + Date.now(), mode, level, list, idx: 0, correct: 0, retried: 0, missed: [], q: null, flow: null, support: 2, placeAid: false, drillTries: 0, drillShow: false };
  uiNextQ();
  uiS.screen = 'play';
}

function uiNextQ() {
  const pl = uiS.play;
  const p = uiProfile();
  const entry = pl.list[pl.idx];
  pl.isMeaning = !!entry.isMeaning;
  pl.isReal = !!entry.isReal;
  pl.why = false;
  pl.isWord = !!entry.isWord;
  pl.isClock = !!entry.isClock;
  uiS.lastInput = 'ans';
  if (pl.isClock) {
    const id = entry.key.slice(3);
    const st = (p.clock || {})[id] || pgNewItem();
    pl.support = st.support;
    pl.q = ckMakeQuestion(uiRng, id, pl.support);
    pl.ck = ckFlowStart(pl.q, pl.support);
    pl.flow = null;
    pl.recorded = false;
    pl.counted = false;
    return;
  }
  if (pl.isWord) {
    pl.q = wdMakeQuestion(uiRng, entry.key.slice(3));
    pl.flow = null;
    pl.drillHint = false;
    pl.wd = { tries: 0, show: false, fb: null };
    return;
  }
  if (pl.isMeaning) {
    pl.q = pl.isReal ? realMakeQuestion(uiRng, entry.key.slice(3)) : mnMakeQuestion(uiRng, entry.key.slice(3));
    pl.flow = null;
    pl.drillHint = false;
    pl.pf = { disabled: [], wrongs: 0, done: false, lastWrong: null };
    return;
  }
  if (pl.mode === 'prefix') {
    pl.q = prefixMakeQuestion(uiRng, entry.key);
    pl.flow = null;
    pl.drillHint = false;
    pl.pf = { disabled: [], wrongs: 0, done: false, lastWrong: null };
    return;
  }
  if (pl.mode === 'anzan') {
    if (!pl.anQs) {
      pl.anQs = anMakeSet(uiRng, pl.level, pl.list.length);
      pl.anStart = Date.now();
    }
    pl.q = pl.anQs[pl.idx];
    pl.flow = null;
    pl.anShow = false;
    pl.anFb = null;
    pl.drillHint = false;
    return;
  }
  if (pl.mode === 'drill') {
    pl.q = qMakeDrill(uiRng, pl.level);
    pl.flow = null;
    pl.drillTries = 0;
    pl.drillShow = false;
    pl.drillFb = null;
    pl.drillHint = false;
    return;
  }
  const item = unitItemByKey(entry.key);
  const st = p.items[entry.key] || pgNewItem();
  pl.isProbe = !!entry.isProbe;
  pl.isJump = !!entry.isJump;
  pl.support = pl.isProbe || pl.isJump ? 0 : st.support; // ためし問題・ほじょなしで チャレンジは段階0で出す（設計 §13.2・13.13）
  pl.placeAid = st.placeAid;
  pl.q = qMakeQuestion(uiRng, item, pl.support);
  pl.flow = qFlowStart(pl.q, pl.support);
  pl.recorded = false;
  pl.placeDone = false;
  pl.counted = false;
}

// flow が変わるたびに呼ぶ。最初の誤答の時点で記録し（途中でやめても残る）、②の成否で位取り表を切り替える
function uiAfterFlow() {
  const pl = uiS.play;
  const f = pl.flow;
  const entry = pl.list[pl.idx];
  const today = pgToday();
  let st = uiProfile().items[entry.key];
  let changed = false;
  if (!pl.recorded) {
    const rec = f.stage === 'done' ? qFlowRecord(f, pl.support) : qFlowFirstRecord(f, pl.support);
    if (rec) {
      if (pl.isJump) {
        const before = st;
        st = pgRecordJump(st, rec, today);
        // ほじょなしで チャレンジは、実際に直接答えて正解したので「いきなり こたえられた」（R-007）
        if (before && before.support > 0 && st.support === 0) pl.events.push({ date: today, kind: 'jump', key: entry.key });
      } else if (pl.isProbe) {
        st = pgRecordProbe(rec, today);
      } else {
        const before = st;
        st = pgRecord(st, rec, today, entry.isCheck);
        for (const kind of pgEvents(before, st)) pl.events.push({ date: today, kind, key: entry.key });
        if (rec.r !== 'ok' && pl.missed) pl.missed.push(entry.key);
      }
      pl.recorded = true;
      changed = true;
    }
  }
  if (!pl.placeDone && (f.s2Errors > 0 || f.stage === 'done')) {
    st = pgPlace(st, f.s2Errors === 0, f.hint);
    pl.placeDone = true;
    changed = true;
  }
  if (changed) uiSave(storeSetItem(uiS.data, uiS.pid, entry.key, st));
  if (f.stage === 'done' && !pl.counted) {
    pl.counted = true;
    // スロットの正解数はヒントありも数える（ヒントを使うことを罰しない）。段位の「全問正解」は clean（最初の1回・ヒントなし）で数える（R-007）
    if (!f.first) pl.correct += 1;
    else if (qFlowRetried(f)) pl.retried += 1;
    if (!f.first && !f.hint) pl.clean = (pl.clean || 0) + 1;
  }
}

function uiQText(q) {
  return '<span>' + decToString(q.value) + '</span> <span class="u">' + uiEsc(q.from) + '</span> は何 <span class="u">' + uiEsc(q.to) + '</span>？';
}

// レベル3で L・dL・mL・cm³ どうしの問題なら、りっぽー（いっぺん 10 cm の りっぽうたい ＝ 1 L）の図を出す（D-007）
const UI_LITER_UNITS = ['L', 'dL', 'mL', 'cm³'];
function uiLiterFig(q) {
  return q.level === 3 && UI_LITER_UNITS.includes(q.from) && UI_LITER_UNITS.includes(q.to) ? '<div class="figure">' + charaLiterSvg() + '</div>' : '';
}

// 問題の画面の「fb ok」「fb hint」の箱に、キャラクターを添える（正解は happy、それ以外は think）
function uiCharaId(pl, q) {
  if (pl.mode === 'prefix') return 'shikaku';
  if (pl.mode === 'drill') return pl.level === 2 ? 'shikaku' : 'naga';
  return charaForLevel(q.level).id;
}
function uiWithChara(h, id) {
  // セリフはキャラクターごとに変える（D-033）。問題の番号で選ぶので、同じ問題の画面では変わらない
  const n = uiS.play ? uiS.play.idx : 0;
  return h
    .replaceAll('<div class="fb ok">', '<div class="fb ok say">' + charaSvg(id, 'happy', 72) + '<b class="line">' + uiEsc(charaLine(id, 'ok', n)) + '</b><br>')
    .replaceAll('<div class="fb hint">', '<div class="fb hint say">' + charaSvg(id, 'think', 72) + '<b class="line">' + uiEsc(charaLine(id, 'hint', n)) + '</b><br>');
}

// 何と何が同じか（D-044）: 「1 m ＝ 1000 mm」。大きい単位 1 つが、小さい単位いくつ分か
function uiEqText(q) {
  const big = q.dir === 'x' ? q.from : q.to;
  const small = q.dir === 'x' ? q.to : q.from;
  return '1 ' + big + ' ＝ ' + whyFactor(q.level, q.from, q.to) + ' ' + small;
}
function uiEqHtml(q) {
  return '<div class="eq-line">' + uiEsc(uiEqText(q)) + '</div>';
}

function uiExplain(q, t) {
  if (t === 'dim' && q.dim) return '<div class="fb hint">おしい！ 長さとちがって、' + (q.level === 3 ? '体積' : '面積') + 'はかけ算を重ねるよ。' + uiEqHtml(q) + uiDimFigure(q) + '</div>';
  if (t === 'dir') return '<div class="fb hint">おしい！ 向きを見てみよう。大きい単位 → 小さい単位は数が大きくなる（×）。小さい単位 → 大きい単位は数が小さくなる（÷）。' + uiEqHtml(q) + '<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>' + uiLiterFig(q) + '</div>';
  return '<div class="fb hint">おしい！ となりどうしの倍率をたどってみよう。' + uiEqHtml(q) + '<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>' + uiLiterFig(q) + '</div>';
}

// 問題の画面の上に、自分のキャラクター（正解で喜ぶ、まちがえたら「がんばるぞー」。D-036）
function uiPlay() {
  const h = uiPlayInner();
  const p = uiProfile();
  if (!p || !AV_IDS.includes(p.id)) return h;
  const mood = h.includes('class="fb hint') ? 'fight' : h.includes('class="fb ok') ? 'happy' : 'normal';
  return h.replace('<span class="progress">', avatarSvg(p.id, mood, 48) + '<span class="progress">');
}
// ---------- どうして ×・÷ なの？（D-042） ----------
// w = { level, from, to, dir: 'x'|'d', v: 元の数（文字）, a: 答え（文字） }
function uiWhy(w) {
  const n = whyFactor(w.level, w.from, w.to);
  const big = w.dir === 'd' ? w.to : w.from; // 大きい単位
  const small = w.dir === 'd' ? w.from : w.to;
  const chain = whyChain(w.level, w.from, w.to);
  let h = '<div class="why"><h3>どうして ' + (w.dir === 'd' ? '÷' : '×') + n + ' なの？</h3>';
  // 1. 大きい単位 1つの中に、小さい単位がいくつ入っているか
  h += '<p class="why-step"><b>① 1 ' + uiEsc(big) + ' の中に、1 ' + uiEsc(small) + ' は いくつ入っている？</b></p><ul class="list">';
  for (const c of chain) h += '<li>1 ' + uiEsc(c.big) + ' ＝ ' + c.n + ' ' + uiEsc(c.small) + '</li>';
  h += '</ul>';
  if (chain.length > 1) h += '<p>だから 1 ' + uiEsc(big) + ' ＝ ' + chain.map((c) => c.n).join(' × ') + ' ＝ <b>' + n + ' ' + uiEsc(small) + '</b></p>';
  else h += '<p>1 ' + uiEsc(big) + ' の中に、1 ' + uiEsc(small) + ' が <b>' + n + 'こ</b> 入っているよ。</p>';
  // 2. その問題の数で
  if (w.dir === 'd') {
    h += '<p class="why-step"><b>② ' + uiEsc(w.v) + ' ' + uiEsc(small) + ' は、1 ' + uiEsc(small) + ' が ' + uiEsc(w.v) + 'こ。</b></p>';
    h += '<p>' + n + 'こ集まるごとに 1 ' + uiEsc(big) + ' になる。<br>' + uiEsc(w.v) + ' の中に ' + n + ' が いくつ分？ → <b>' + uiEsc(w.v) + ' ÷ ' + n + ' ＝ ' + uiEsc(w.a) + '</b>　だから ' + uiEsc(w.a) + ' ' + uiEsc(big) + '</p>';
  } else {
    h += '<p class="why-step"><b>② ' + uiEsc(w.v) + ' ' + uiEsc(big) + ' は、1 ' + uiEsc(big) + ' が ' + uiEsc(w.v) + 'こ。</b></p>';
    h += '<p>1 ' + uiEsc(big) + ' を ' + uiEsc(small) + ' に 分けると ' + n + 'こずつ。<br>→ <b>' + uiEsc(w.v) + ' × ' + n + ' ＝ ' + uiEsc(w.a) + '</b>　だから ' + uiEsc(w.a) + ' ' + uiEsc(small) + '</p>';
  }
  // 3. お金で考える
  const m = whyMoney(n);
  if (m) {
    h += '<p class="why-step"><b>③ お金で考えると</b></p><div class="why-money">' + uiWhyMoneySvg(m) + '</div>';
    if (w.dir === 'd') h += '<p>' + m.small + ' ' + n + 'まいで ' + m.big + ' 1まい。<br>大きいお金（大きい単位）に かえると、まい数（数）は <b>少なく</b> なる。だから <b>÷' + n + '</b>。</p>';
    else h += '<p>' + m.big + ' 1まいを ' + m.small + 'に かえると ' + n + 'まい。<br>小さいお金（小さい単位）に かえると、まい数（数）は <b>多く</b> なる。だから <b>×' + n + '</b>。</p>';
  }
  h += '<p class="muted">大きい単位 → 小さい単位は ×（数が大きくなる）。小さい単位 → 大きい単位は ÷（数が小さくなる）。</p></div>';
  return h;
}

// 1円玉の山 ＝ 大きいお金 1つ の絵
function uiWhyMoneySvg(m) {
  let s = '<svg viewBox="0 0 300 90" width="300" height="90" role="img" aria-label="' + m.small + ' ' + m.n + 'まいで ' + m.big + ' 1まい">';
  for (let i = 0; i < 6; i++) {
    const x = 40 + (i % 3) * 22;
    const y = 62 - Math.floor(i / 3) * 18;
    s += '<circle cx="' + x + '" cy="' + y + '" r="13" fill="#e6e6e6" stroke="#999" stroke-width="2"/><text x="' + x + '" y="' + (y + 5) + '" font-size="12" text-anchor="middle" fill="#666">1</text>';
  }
  s += '<text x="62" y="18" font-size="13" text-anchor="middle" fill="#444">1円 × ' + m.n + '</text>';
  s += '<text x="140" y="56" font-size="26" text-anchor="middle" fill="#444">＝</text>';
  if (m.big.endsWith('札')) s += '<rect x="175" y="25" width="110" height="52" rx="6" fill="#dff0d8" stroke="#5a9a4a" stroke-width="2"/><text x="230" y="58" font-size="18" text-anchor="middle" fill="#2e6b25">' + m.n + '円</text>';
  else s += '<circle cx="230" cy="50" r="26" fill="#f2d48a" stroke="#b8923a" stroke-width="2"/><text x="230" y="56" font-size="16" text-anchor="middle" fill="#7a5a12">' + m.n + '</text>';
  return s + '</svg>';
}

// 問題の画面の「どうして？」ボタンと説明（q は換算の問題）
function uiWhyBlock(pl, q) {
  if (pl.mode === 'memtest') return '';
  // ボタンの文字で × か ÷ かが分からないようにする
  let h = '<p><button class="small" data-act="why">' + (pl.why ? '説明を とじる' : 'どうして？ 考え方を見る') + '</button></p>';
  if (pl.why) h += uiWhy({ level: q.level, from: q.from, to: q.to, dir: q.dir, v: decToString(q.value), a: decToString(q.answer) });
  return h;
}

// ホームからの説明の画面（例: 2500 mm → m と 3 m → mm）
function uiWhyScreen() {
  let h = '<h1>どうして × ・ ÷ なの？</h1>';
  h += uiWhy({ level: 1, from: 'mm', to: 'm', dir: 'd', v: '2500', a: '2.5' });
  h += uiWhy({ level: 1, from: 'm', to: 'mm', dir: 'x', v: '3', a: '3000' });
  h += '<p><button class="primary big" data-act="whyback">もどる</button></p>';
  return h;
}

function uiPlayInner() {
  const pl = uiS.play;
  const q = pl.q;
  let h = '<div class="row"><span class="progress">' + (pl.idx + 1) + ' / ' + pl.list.length + '</span>';
  if (pl.mode === 'review') h += '<span class="tag">苦手復習</span>';
  if (pl.mode === 'memtest') h += '<span class="tag">きおくテスト（ヒントなし）</span>';
  else if (pl.mode === 'l4') h += '<span class="tag">ごちゃまぜ</span>';
  else if (pl.list[pl.idx].isCheck) h += '<span class="tag">確かめ</span>';
  if (pl.list[pl.idx].isProbe) h += '<span class="tag">試し問題</span>';
  if (pl.mode === 'jump') h += '<span class="tag">補助なしでチャレンジ</span><span class="tag">' + (pl.hintUsed ? 'ヒントを使ったので ポイントはふつう' : 'ポイント ' + SLOT_JUMP_MULT.label + '倍') + '</span>';
  h += '<span style="flex:1"></span>';
  if (pl.mode !== 'memtest') h += '<button class="small" data-act="hint">ヒント</button>';
  h += '<button class="small" data-act="quit">やめる</button></div>';
  if (pl.mode === 'drill') return uiWithChara(h + uiDrill(), uiCharaId(pl, q));
  if (pl.mode === 'anzan') return uiWithChara(h + uiAnzan(), 'shikaku');
  if (pl.mode === 'prefix') return uiWithChara(h + uiPrefix(), uiCharaId(pl, q));
  if (pl.isMeaning) return uiWithChara(h + uiMeaning(), charaForLevel(q.level).id);
  if (pl.isWord) return uiWithChara(h + uiWord(), charaForLevel(q.level).id);
  if (pl.isClock) return uiWithChara(h + uiClock(), 'timmy');
  const f = pl.flow;
  const showFig = pl.support === 2 || f.hint;
  h += '<div class="qtext">' + uiQText(q) + '</div>';
  if (f.stage === 's1') {
    h += '<p>① ' + uiEsc(q.from) + ' を ' + uiEsc(q.to) + ' に するには、どれ？</p><div class="options">';
    q.options.forEach((o, i) => {
      h += '<button data-act="choose" data-i="' + i + '"' + (f.disabled.includes(i) ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + o.label + '</button>';
    });
    h += '</div>';
    if (f.feedback && f.feedback.kind === 'ng1') h += uiExplain(q, f.feedback.t);
    else if (f.feedback && f.feedback.kind === 'ng0') h += '<div class="fb hint">おしい！ ①から いっしょに やってみよう。</div>';
    else if (showFig) h += uiEqHtml(q) + '<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>' + uiLiterFig(q);
    if (q.k > 0 && f.feedback) h += uiWhyBlock(pl, q); // D-042: ①で まちがえたあとに出す
  } else if (f.stage === 's2' || f.stage === 'direct') {
    if (f.stage === 's2') {
      h += '<div class="fb ok">① ' + qOpLabel(q.op) + ' で正解！ ' + uiEsc(uiEqText(q)) + ' だからね。</div>';
      h += '<p>② 計算しよう</p><div class="answer-row">' + decToString(q.value) + ' ' + qOpLabel(q.op).replace('（そのまま）', '') + ' ＝ ';
    } else {
      h += '<div class="answer-row">' + decToString(q.value) + ' ' + uiEsc(q.from) + ' ＝ ';
    }
    h += '<input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="答え"> ' + (f.stage === 'direct' ? uiEsc(q.to) : '') + '<button class="primary" data-act="submit">決定</button></div>';
    h += uiTenkey();
    if (f.feedback && f.feedback.kind === 'invalid') h += '<div class="fb info">数字で入れてね。</div>';
    if (f.feedback && f.feedback.kind === 'ng2') h += '<div class="fb hint">おしい！ 位取りの表を見てみよう。' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
    else if (f.stage === 's2' && (pl.support === 2 || pl.placeAid || f.hint)) h += '<div class="fb info">位取りの表' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
    if (f.stage === 'direct' && f.hint) h += uiEqHtml(q) + '<div class="figure">' + uiLadderSvg(q.level, q.from, q.to) + '</div>';
  } else {
    const fb = f.feedback || {};
    if (f.showAnswer) h += '<div class="fb hint">答えは <b>' + decToString(q.answer) + ' ' + uiEsc(q.to) + '</b> だよ。' + uiEqHtml(q) + '表で確かめよう。' + uiPlaceTable(q.value, q.answer, q.op) + '</div>';
    else h += '<div class="fb ok">正解！ ' + decToString(q.value) + ' ' + uiEsc(q.from) + ' ＝ <b>' + decToString(q.answer) + ' ' + uiEsc(q.to) + '</b>' + (f.first ? '（やりなおして できたね）' : '') + uiEqHtml(q) + uiPlaceTable(q.value, q.answer, q.op) + '</div>';
    if (q.k > 0) h += uiWhyBlock(pl, q); // D-042（D-044 で、正解の箱が出なくなっていたのを直した）
    void fb;
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
  }
  return uiWithChara(h, uiCharaId(pl, q));
}

function uiTenkey() {
  const keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', '0', '.', '⌫'];
  // 決定（tk-ok）はスマホのときだけ見せる（答えの欄の 決定 の代わり。D-030）
  return '<div class="tenkey">' + keys.map((k) => '<button data-act="key" data-k="' + k + '">' + k + '</button>').join('') + '<button class="primary tk-ok" data-act="submit">決定</button></div>';
}

// ---------- 暗算トレーニング（D-046） ----------
function uiSec(ms) {
  return (Math.floor(ms / 100) / 10).toFixed(1) + '秒'; // 表示だけ（記録はミリ秒の整数）
}
function uiAnzan() {

  const k = AN_KINDS.find((x) => x.id === pl.level);
  let h = '<p class="an-head">' + uiEsc(k.name) + '　<b class="an-timer" id="an-timer">' + uiSec(Date.now() - pl.anStart) + '</b>' + (pl.anLastOk ? ' <span class="an-ok">○ 正解！</span>' : '') + '</p>';
  h += '<div class="answer-row an-row">' + uiEsc(q.text) + ' ';
  if (pl.anShow) {
    h += '<b>' + q.answer + '</b></div>';
    h += '<div class="fb hint">答えは <b>' + q.answer + '</b> だよ。' + uiEsc(q.hint) + '</div>';
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
    return h;
  }
  h += '<input id="ans" type="text" inputmode="numeric" autocomplete="off" aria-label="答え"> <button class="primary" data-act="submit">決定</button></div>' + uiTenkey();
