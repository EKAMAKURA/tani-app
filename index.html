<title>単位のへんかん</title>
<style>
:root {
  --bg: #fffaf2;
  --fg: #2b2b2b;
  --muted: #6b6b6b;
  --card: #ffffff;
  --line: #e3d9c8;
  --accent: #2f7de1;
  --accent-weak: #e6f0fd;
  --ok: #24914a;
  --ok-weak: #e7f6ec;
  --warn: #c77700;
  --warn-weak: #fff3dd;
  --hl: #ffd34d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
/* ダブルタップでの拡大をしない（テンキーを速く押したとき。二本指の拡大はできる。D-032） */
html { touch-action: manipulation; }
body {
  font-family: "BIZ UDPGothic", "Meiryo", "Yu Gothic UI", "Hiragino Sans", system-ui, sans-serif;
  font-size: 22px; line-height: 1.6;
}
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 34px; margin: 8px 0 16px; }
h2 { font-size: 26px; margin: 20px 0 10px; }
h3 { font-size: 22px; margin: 16px 0 6px; }
button {
  font: inherit; min-height: 52px; min-width: 52px; padding: 8px 18px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 4px solid var(--hl); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.big { font-size: 28px; padding: 16px 28px; }
button.small { min-height: 40px; font-size: 18px; padding: 4px 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 20px; }
.muted { color: var(--muted); font-size: 18px; }
.banner { background: var(--warn-weak); border-bottom: 3px solid var(--warn); padding: 10px 16px; font-size: 18px; }
.ver { text-align: center; color: var(--muted); font-size: 14px; padding: 8px; }
.who button { font-size: 32px; min-height: 120px; }
.who button { display: flex; align-items: center; justify-content: center; gap: 10px; }
.who button svg.avatar { flex: none; }
.av-say { margin: 0 0 8px; font-weight: bold; color: var(--fg); }
.adult-link { position: fixed; right: 12px; bottom: 30px; }
.stat { font-size: 20px; }
.stat b { font-size: 30px; }
.title-badge { display: inline-block; background: var(--hl); border-radius: 999px; padding: 2px 16px; font-weight: bold; }
.qtext { font-size: 40px; font-weight: bold; margin: 12px 0; }
.qtext .u { color: var(--accent); }
.progress { color: var(--muted); }
.options { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 14px; margin: 14px 0; }
.options button { font-size: 34px; min-height: 90px; }
.options button .key { font-size: 16px; color: var(--muted); display: block; }
/* 意味の問題の図つき選択肢（D-039）: 図の横に「1辺 1 cm の」「立方体」を2行で */
.opt-fig { display: flex; align-items: center; justify-content: center; gap: 6px; }
.opt-fig svg { flex: none; }
.opt-txt { display: flex; flex-direction: column; align-items: flex-start; font-size: 22px; line-height: 1.25; text-align: left; }
.opt-txt span { white-space: nowrap; }
.opt-txt span + span { font-size: 28px; font-weight: bold; }
.answer-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 36px; font-weight: bold; }
.answer-row input { font: inherit; width: 7.5em; padding: 6px 12px; border: 3px solid var(--accent); border-radius: 12px; text-align: right; }
.tenkey { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; margin: 12px 0; }
.tenkey button { font-size: 26px; min-height: 60px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.tenkey .tk-ok { display: none; }
.fb { border-radius: 16px; padding: 12px 16px; margin: 14px 0; }
.fb.ok { background: var(--ok-weak); border: 2px solid var(--ok); }
.fb.hint { background: var(--warn-weak); border: 2px solid var(--warn); }
.fb.info { background: var(--accent-weak); border: 2px solid var(--accent); }
.figure { margin: 10px 0; overflow-x: auto; }
.figure svg { max-width: 100%; height: auto; }
table.place { border-collapse: collapse; margin: 8px 0; font-size: 30px; }
table.place th { font-size: 15px; color: var(--muted); font-weight: normal; padding: 2px 6px; border-bottom: 2px solid var(--line); }
table.place td { width: 1.6em; text-align: center; border-left: 1px dashed var(--line); padding: 2px 4px; }
table.place td.pt { border-left: 3px solid var(--fg); }
table.place tr.after td { color: var(--accent); font-weight: bold; animation: slidein .9s ease-out; }
table.place td.lab { border: none; font-size: 18px; text-align: right; width: auto; color: var(--muted); }
@keyframes slidein { from { opacity: 0; transform: translateX(var(--from, 40px)); } to { opacity: 1; transform: none; } }
.slot { display: flex; gap: 14px; justify-content: center; align-items: center; margin: 20px 0; font-size: 26px; }
.reel { width: 130px; height: 130px; border-radius: 18px; border: 4px solid var(--fg); display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: bold; background: #fff; }
.reel.spin { animation: shake .12s linear infinite; }
@keyframes shake { 0% { transform: translateY(-3px); } 50% { transform: translateY(3px); } 100% { transform: translateY(-3px); } }
.slot.basic .reel { border-color: #555; }
.slot.sky .reel { border-color: #2f7de1; background: #eef6ff; }
.slot.forest .reel { border-color: #24914a; background: #effaf2; }
.slot.gold .reel { border-color: #c99a00; background: #fff8dc; }
.formula { text-align: center; font-size: 32px; font-weight: bold; margin: 10px 0; }
.points { text-align: center; font-size: 48px; font-weight: bold; color: var(--ok); }
.list { margin: 4px 0; padding-left: 1.2em; font-size: 19px; }
.tag { display: inline-block; font-size: 15px; border-radius: 8px; padding: 0 8px; margin-left: 6px; background: var(--accent-weak); }
.tag.calc { background: var(--warn-weak); }
.adult input[type=text], .adult input[type=number] { font: inherit; font-size: 18px; padding: 4px 8px; border: 2px solid var(--line); border-radius: 8px; }
.adult input[type=number] { width: 6em; }
.danger { color: #b3261e; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* キャラクター（D-007） */
.level-btn { display: flex; align-items: center; gap: 14px; text-align: left; }
.level-btn .chara { flex: none; }
.fb.say::after { content: ""; display: block; clear: both; }
.fb.say > svg.chara { float: left; margin: 0 12px 4px 0; }
/* どうして ×・÷ なの？（D-042） */
.why { border: 2px solid var(--accent); border-radius: 14px; padding: 10px 14px; margin: 10px 0; background: var(--bg); }
.why h3 { margin: 4px 0 8px; }
.why-step { margin: 12px 0 4px; }
.why-money svg { max-width: 100%; height: auto; }
/* 何と何が同じか（D-044） */
.eq-line { display: inline-block; margin: 6px 0; padding: 2px 12px; border: 2px solid var(--accent); border-radius: 10px; font-size: 1.15em; font-weight: bold; background: var(--bg); }
/* 暗算トレーニング（D-046） */
.an-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.an-timer { font-size: 1.4em; font-variant-numeric: tabular-nums; }
.an-ok { color: var(--ok, #2e8b57); font-weight: bold; }
.an-row { font-size: 40px; }
.chara-row { display: flex; justify-content: center; gap: 18px; margin: 4px 0 8px; }
.chara-cheer { animation: chara-hop .6s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) { .chara-cheer { animation: none; } }
@keyframes chara-hop { from { transform: translateY(0); } to { transform: translateY(-6px); } }
svg.liter { max-width: 100%; height: auto; }
/* 接頭語クイズの表（D-009） */
.prefix-table { border-collapse: collapse; margin: 10px 0; font-size: 18px; background: #fff; }
.prefix-table th, .prefix-table td { border: 2px solid var(--line); padding: 4px 10px; text-align: center; }
.prefix-table .hi { background: var(--hl); font-weight: bold; }
.prefix-table .mark { background: var(--warn-weak); }
/* rev4: きょうの れんしゅう・できること マップ・タイムチャレンジ（D-010） */
.rec { margin: 8px 0 12px; }
.rec-btn { width: 100%; }
.rec-why { font-size: 20px; opacity: .9; }
.chip { display: inline-block; padding: 2px 10px; margin: 2px 4px 2px 0; border-radius: 999px; font-size: 16px; border: 2px solid var(--line); background: #fff; }
.chip.done { background: var(--ok-weak); border-color: var(--ok); }
.chip.weak { background: var(--warn-weak); border-color: var(--warn); }
.chip.learn { background: var(--accent-weak); border-color: var(--accent); }
.chip.fresh { color: var(--muted); }
.map-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 6px 0; }
.map-lv { min-width: 7em; font-weight: bold; }
.clear { color: var(--ok); }
.tc-left { font-size: 48px; font-weight: bold; color: var(--accent); min-width: 2ch; text-align: right; }
button.tc-ng { border-color: var(--warn); }
.daily-bar { font-size: 20px; margin: 4px 0; }
.fb.daily { text-align: center; font-size: 26px; }
.big-reel { margin: 10px auto; width: 220px; height: 110px; font-size: 48px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--line); border-radius: 18px; background: #fff; }
.rs { border-color: var(--hl); }
.qtext.word { font-size: 26px; line-height: 1.7; }
ol.steps { margin: 6px 0 0 1.2em; padding: 0; }
.clock-fig { background: #fff8d6; border: 2px solid #e24b4a; border-radius: 12px; padding: 8px 12px; }
input.ck-in { width: 5em; }
.memtest-row { margin: 8px 0; }
.memtest-btn { width: 100%; }
.stamps { letter-spacing: 4px; color: #e24b4a; font-size: 20px; }
.box-left { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.box-left .chip.gone { opacity: 0.35; text-decoration: line-through; }
.box-left .chip.last { border-color: #e24b4a; color: #e24b4a; font-weight: bold; }
.danger-btn { background: #b3261e; color: #fff; border-color: #b3261e; }
.stage-bar { display: flex; width: 100%; height: 10px; margin-top: 6px; border-radius: 5px; overflow: hidden; background: #eee; }
.stage-bar i { display: block; height: 100%; }
.stage-bar .s-done { background: var(--ok); }
.stage-bar .s-direct { background: var(--accent); }
.stage-bar .s-nofig { background: var(--accent-weak); }
.stage-bar .s-fig { background: #f0d79a; }
.stage-bar .s-fresh { background: #eee; }
.stage-txt { display: block; font-size: 14px; }
.waiting { margin: 6px 0; }
.card.week { margin: 8px 0; }
.level-btn > span { flex: 1; min-width: 0; }
input[id^="ans"]:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
/* スマホでは答えの欄とテンキーを画面の下に固定し、1画面に収める（D-030） */
@media (max-width: 700px) {
  .qtext { font-size: 30px; margin: 6px 0; }
  /* 選択肢が横にはみ出さないように（D-039）。図つきの選択肢は図を上、文字を下に */
  .options { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .options button { font-size: 26px; padding-left: 6px; padding-right: 6px; }
  .opt-fig { flex-direction: column; gap: 2px; }
  .opt-txt { align-items: center; text-align: center; font-size: 17px; }
  .opt-txt span + span { font-size: 22px; }
  .dock { position: sticky; bottom: 0; z-index: 5; background: var(--bg); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); }
  .dock .answer-row { font-size: 26px; gap: 8px; }
  .dock .answer-row input { width: 5em; padding: 4px 8px; }
  .dock .answer-row:has(#ans2) input { width: 3.2em; }
  .dock .answer-row > [data-act="submit"] { display: none; }
  .dock .tenkey { grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 0; }
  .dock .tenkey button { min-height: 46px; font-size: 24px; }
  .dock .tenkey [data-k="⌫"] { grid-column: 4; grid-row: 1; }
  .dock .tenkey .tk-ok { display: block; grid-column: 4; grid-row: 2 / span 3; font-size: 20px; }
  .dock .tenkey [data-k="0"] { grid-column: span 2; }
}
