  if (pl.drillHint) h += '<div class="fb info">ヒント: ' + uiEsc(q.hint) + '<br><span class="muted">ヒントを見た問題は、正解の数に入らないよ。</span></div>';
  return h;
}

function uiDrill() {
  const pl = uiS.play;
  const q = pl.q;
  let h = '<p>かけ算・わり算ドリル' + pl.level + '</p><div class="answer-row">' + decToString(q.value) + ' ' + qOpLabel(q.op) + ' ＝ ';
  if (pl.drillShow) {
    h += '<b>' + decToString(q.answer) + '</b></div>';
    h += '<div class="fb ' + (pl.drillTries === 0 ? 'ok">正解！' : pl.drillFb === 'ok' ? 'ok">できたね！' : 'hint">答えは ' + decToString(q.answer) + ' だよ。') + uiPlaceTable(q.value, q.answer, q.op) + '</div>';
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
    return h;
  }
  h += '<input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="答え"> <button class="primary" data-act="submit">決定</button></div>' + uiTenkey();
  if (pl.drillFb === 'invalid') h += '<div class="fb info">数字で入れてね。</div>';
  if (pl.drillFb === 'ng') h += '<div class="fb hint">おしい！ 位取りの表を見てみよう。' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
  else if (pl.drillHint) h += '<div class="fb info">ヒント: ' + uiPlaceTable(q.value, q.answer, q.op).replace(/<tr class="after"[\s\S]*?<\/tr>/, '') + '</div>';
  return h;
}

// ---------- 接頭語クイズ（D-009） ----------
function uiPrefix() {
  const pl = uiS.play;
  const q = pl.q;
  const pf = pl.pf;
  let h = '<p>キロ・ミリ クイズ</p><div class="qtext">' + uiEsc(q.text) + '</div><div class="options">';
  q.options.forEach((o, i) => {
    const dis = pf.disabled.includes(i) || (pf.done && !o.correct);
    h += '<button data-act="choose" data-i="' + i + '"' + (dis ? ' disabled' : '') + (pf.done && o.correct ? ' class="primary"' : '') + '><span class="key">' + (i + 1) + '</span>' + uiEsc(o.label) + '</button>';
  });
  h += '</div>';
  if (pf.done) {
    h += '<div class="fb ok">' + (pf.wrongs === 0 ? '正解！' : 'できたね！') + prefixTableHtml(q.prefix, null) + '</div>';
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
  } else if (pf.lastWrong) {
    h += '<div class="fb hint">おしい！ 表で確かめよう。' + prefixTableHtml(null, pf.lastWrong) + '</div>';
  } else if (pl.drillHint) {
    h += '<div class="fb info">ヒント' + prefixTableHtml(null, null) + '</div>';
  }
  return h;
}

// ---------- じかん（D-016） ----------
function uiClockFig() {
  return '<div class="figure clock-fig"><b>1日 ＝ 24時間</b>　→　<b>1時間 ＝ 60分</b>　→　<b>1分 ＝ 60秒</b><div class="muted">時間は 60（1日は 24）でくり上がるよ。100 ではないよ。</div></div>';
}

function uiClockInputs(q) {
  return q.fields.map((fd, i) => '<input id="' + (i === 0 ? 'ans' : 'ans' + (i + 1)) + '" type="text" inputmode="numeric" autocomplete="off" aria-label="答え' + (i + 1) + '" class="ck-in"> ' + uiEsc(fd.unit)).join(' ');
}

function uiClock() {
  const pl = uiS.play;
  const q = pl.q;
  const f = pl.ck;
  const steps = (list) => '<ol class="steps">' + list.map((x) => '<li>' + uiEsc(x) + '</li>').join('') + '</ol>';
  const showFig = pl.support === 2 || f.hint;
  let h = '<p>時間</p><div class="qtext">' + uiEsc(q.text) + '</div>';
  if (f.stage === 'done') {
    const ans = q.answers.map((a, i) => a + ' ' + q.fields[i].unit).join(' ');
    if (f.showAnswer) h += '<div class="fb hint">答えは <b>' + uiEsc(ans) + '</b> だよ。' + steps(q.steps) + uiClockFig() + '</div>';
    else h += '<div class="fb ok">' + (f.first ? 'できたね！ ' : '正解！ ') + '<b>' + uiEsc(ans) + '</b>' + steps(q.steps) + '</div>';
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
    return h;
  }
  if (f.stage === 's1') {
    h += '<p>① ' + uiEsc(q.from) + ' を ' + uiEsc(q.to) + ' に するには、どれ？</p><div class="options">';
    q.options.forEach((o, i) => {
      h += '<button data-act="choose" data-i="' + i + '"' + (f.disabled.includes(i) ? ' disabled' : '') + '><span class="key">' + (i + 1) + '</span>' + o.label + '</button>';
    });
    h += '</div>';
    const fb = f.feedback || {};
    if (fb.kind === 'ng1') {
      const msg = fb.t === 'dec' ? '時間は 10 ずつではなく、60（1日は 24）でくり上がるよ。'
        : fb.t === 'mag' ? '60 と 24 を まちがえないでね。1日 ＝ 24時間、1時間 ＝ 60分、1分 ＝ 60秒。'
          : '大きい単位 → 小さい単位は数が大きくなる（×）。逆は ÷。';
      h += '<div class="fb hint">おしい！ ' + msg + uiClockFig() + '</div>';
    } else if (fb.kind === 'ng0') h += '<div class="fb hint">おしい！ ①から いっしょに やってみよう。</div>';
    else if (showFig) h += uiClockFig();
    return h;
  }
  if (f.stage === 's2') {
    h += '<div class="fb ok">① ' + ckOpLabel(q.op) + ' で正解！</div><p>② 計算しよう</p><div class="answer-row">' + q.value + ' ' + ckOpLabel(q.op) + ' ＝ ' + uiClockInputs(q) + ' <button class="primary" data-act="submit">決定</button></div>';
  } else if (f.stage === 'direct') {
    h += '<div class="answer-row">' + q.value + ' ' + uiEsc(q.from) + ' ＝ ' + uiClockInputs(q) + ' <button class="primary" data-act="submit">決定</button></div>';
  } else {
    h += '<div class="answer-row">' + uiClockInputs(q) + ' <button class="primary" data-act="submit">決定</button></div>';
  }
  h += uiTenkey();
  const fb = f.feedback || {};
  if (fb.kind === 'invalid') h += '<div class="fb info">数字で入れてね。</div>';
  else if (fb.kind === 'ng2') h += '<div class="fb hint">おしい！ 解き方を見て、もう一度。' + steps(q.steps.slice(0, -1)) + uiClockFig() + '</div>';
  else if (showFig) h += uiClockFig();
  return h;
}

// flow が変わるたびに呼ぶ。最初の誤りの時点で記録する（途中でやめても残る）
function uiClockAfter() {
  const pl = uiS.play;
  const f = pl.ck;
  const entry = pl.list[pl.idx];
  const id = pl.q.id;
  if (!pl.recorded) {
    const rec = f.stage === 'done' ? ckFlowRecord(f, pl.support) : ckFirstRecord(f, pl.support);
    if (rec) {
      const today = pgToday();
      const before = (uiProfile().clock || {})[id];
      const st = pgRecord(before, rec, today, entry.isCheck);
      if (before) for (const kind of pgEvents(before, st)) pl.events.push({ date: today, kind, key: 'ck:' + id });
      if (rec.r !== 'ok' && pl.missed) pl.missed.push('ck:' + id);
      uiSave(storeSetClock(uiS.data, uiS.pid, id, st));
      pl.recorded = true;
    }
  }
  if (f.stage === 'done' && !pl.counted) {
    pl.counted = true;
    if (!f.first) {
      pl.correct += 1;
      if (!f.hint) pl.clean = (pl.clean || 0) + 1;
    } else if (!f.showAnswer) pl.retried += 1;
  }
}

// ---------- 文章題（D-015） ----------
function uiWord() {
  const pl = uiS.play;
  const q = pl.q;
  const wd = pl.wd;
  const steps = (list) => '<ol class="steps">' + list.map((x) => '<li>' + uiEsc(x) + '</li>').join('') + '</ol>';
  let h = '<p>文章題</p><div class="qtext word">' + uiEsc(q.text) + '</div>';
  if (wd.show) {
    const ans = decToString(q.answer) + ' ' + q.unit;
    if (wd.fb === 'ok') h += '<div class="fb ok">' + (wd.tries === 0 ? '正解！ ' : 'できたね！ ') + '<b>' + uiEsc(ans) + '</b>' + steps(q.steps) + '</div>';
    else h += '<div class="fb hint">答えは <b>' + uiEsc(ans) + '</b> だよ。解き方を見てみよう。' + steps(q.steps) + '</div>';
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
    return h;
  }
  h += '<div class="answer-row"><input id="ans" type="text" inputmode="decimal" autocomplete="off" aria-label="答え"> ' + uiEsc(q.unit) + ' <button class="primary" data-act="submit">決定</button></div>' + uiTenkey();
  if (wd.fb === 'invalid') h += '<div class="fb info">数字で入れてね。</div>';
  if (wd.fb === 'ng') h += '<div class="fb hint">おしい！ 解き方を見て、もう一度。' + steps(q.steps.slice(0, -1)) + '</div>';
  else if (pl.drillHint) h += '<div class="fb info">ヒント: ' + uiEsc(q.steps[0]) + '</div>';
  return h;
}

function uiWordSubmit(val) {
  const pl = uiS.play;
  const q = pl.q;
  const wd = pl.wd;
  const r = qCheck(val, q.answer);
  if (r === 'invalid') {
    wd.fb = 'invalid';
    return;
  }
  const ok = r === 'ok';
  if (wd.tries === 0) {
    // 最初の1回で記録する（ヒントを見て正解したときは進めない）
    if (!(pl.drillHint && ok)) {
      const today = pgToday();
      const before = (uiProfile().word || {})[q.id];
      const after = wdRecord(before, ok, today);
      uiSave(storeSetWord(uiS.data, uiS.pid, q.id, after));
      if (!wdDone(before) && wdDone(after)) pl.events.push({ date: today, kind: 'word', key: q.id });
    }
    if (ok) {
      pl.correct += 1;
      if (!pl.drillHint) pl.clean = (pl.clean || 0) + 1;
    }
  } else if (ok) {
    pl.retried += 1;
  }
  if (ok) {
    wd.fb = 'ok';
    wd.show = true;
  } else {
    wd.tries += 1;
    wd.fb = 'ng';
    if (wd.tries >= 2) wd.show = true;
  }
}

// ---------- 意味の問題（D-014） ----------
// 意味の問題の選択肢「1辺 1 cm の立方体」などに小さい図を添え、「1辺 1 cm の」「立方体」で行を分ける（D-039）
// 図の大きさは長さの目安（1 cm < 10 cm < 1 m < … < 1 km）。正確な縮尺ではない
const UI_SHAPE_RE = /^(1辺|長さ) (\d+) (cm|m|km) の(正方形|立方体|線)$/;
function uiShapeOption(label) {
  const m = UI_SHAPE_RE.exec(label);
  if (!m) return null;
  const cm = Number(m[2]) * { cm: 1, m: 100, km: 100000 }[m[3]];
  const s = cm <= 1 ? 14 : cm <= 10 ? 26 : cm <= 100 ? 36 : cm <= 5000 ? 42 : 48; // 図の一辺（px）
  const kind = m[4];
  let g;
  if (kind === '正方形') {
    g = '<rect x="' + (32 - s / 2) + '" y="' + (32 - s / 2) + '" width="' + s + '" height="' + s + '" fill="#cfe3ff" stroke="#185fa5" stroke-width="2"/>';
  } else if (kind === '立方体') {
    const d = s * 0.4;
    const x = 30 - s / 2 - d / 2;
    const y = 34 - s / 2 + d / 2;
    g = '<path d="M' + x + ' ' + y + ' l' + d + ' ' + -d + ' h' + s + ' l' + -d + ' ' + d + ' z" fill="#e3efff" stroke="#185fa5" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M' + (x + s) + ' ' + y + ' l' + d + ' ' + -d + ' v' + s + ' l' + -d + ' ' + d + ' z" fill="#9cc3f0" stroke="#185fa5" stroke-width="2" stroke-linejoin="round"/>' +
      '<rect x="' + x + '" y="' + y + '" width="' + s + '" height="' + s + '" fill="#cfe3ff" stroke="#185fa5" stroke-width="2"/>';
  } else {
    g = '<path d="M' + (32 - s / 2) + ' 32 h' + s + ' M' + (32 - s / 2) + ' 27 v10 M' + (32 + s / 2) + ' 27 v10" stroke="#185fa5" stroke-width="3" stroke-linecap="round"/>';
  }
  return '<span class="opt-fig"><svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">' + g + '</svg>' +
    '<span class="opt-txt"><span>' + uiEsc(m[1] + ' ' + m[2] + ' ' + m[3] + ' の') + '</span><span>' + uiEsc(kind) + '</span></span></span>';
}

function uiMeaning() {
  const pl = uiS.play;
  const q = pl.q;
  const pf = pl.pf;
  let h = '<p>' + (pl.isReal ? '身近なもの クイズ' : '単位の意味') + '</p><div class="qtext">' + uiEsc(q.text) + '</div><div class="options">';
  q.options.forEach((o, i) => {
    const dis = pf.disabled.includes(i) || (pf.done && !o.correct);
    h += '<button data-act="choose" data-i="' + i + '"' + (dis ? ' disabled' : '') + (pf.done && o.correct ? ' class="primary"' : '') + '><span class="key">' + (i + 1) + '</span>' + (uiShapeOption(o.label) || uiEsc(o.label)) + '</button>';
  });
  h += '</div>';
  const fig = q.level === 3 && /L|cm³|mL/.test(q.text) ? '<div class="figure">' + charaLiterSvg() + '</div>' : '';
  if (pf.done) {
    h += '<div class="fb ok">' + (pf.wrongs === 0 ? '正解！ ' : 'できたね！ ') + uiEsc(q.explain) + fig + '</div>';
    h += '<p><button class="primary big" data-act="next">次へ（Enter）</button></p>';
  } else if (pf.lastWrong !== null) {
    h += '<div class="fb hint">おしい！ ' + (q.hint ? uiEsc(q.hint) : uiEsc(q.explain.split('。')[0]) + '。') + fig + '</div>'; // 身近なもの クイズは答えを言わないヒント（D-040）
  } else if (pl.drillHint) {
    h += '<div class="fb info">ヒント: ' + uiEsc(q.explain) + fig + '</div>';
  }
  return h;
}

function uiMeaningChoose(i) {
  const pl = uiS.play;
  const pf = pl.pf;
  const o = pl.q.options[i];
  if (!o || pf.done || pf.disabled.includes(i)) return;
  // ヒントを見て正解したときは進めない。誤りは記録する（D-014）。身近なもの クイズは記録しない（D-040）
  if (!pl.isReal && pf.wrongs === 0 && !(pl.drillHint && o.correct)) {
    const today = pgToday();
    const before = (uiProfile().meaning || {})[pl.q.id];
    const after = mnRecord(before, o.correct, today);
    uiSave(storeSetMeaning(uiS.data, uiS.pid, pl.q.id, after));
    if (!mnDone(before) && mnDone(after)) pl.events.push({ date: today, kind: 'meaning', key: pl.q.id });
  }
  if (o.correct) {
    if (pf.wrongs === 0) pl.correct += 1;
    else pl.retried += 1;
    pf.done = true;
  } else {
    pf.wrongs += 1;
    pf.disabled.push(i);
    pf.lastWrong = i;
  }
}

// 最初の1回の答えで記録する（途中でやめても残る）
function uiPrefixChoose(i) {
  const pl = uiS.play;
  const pf = pl.pf;
  const o = pl.q.options[i];
  if (!o || pf.done || pf.disabled.includes(i)) return;
  // ヒント（表）を見て正解したときは、箱を進めない（R-007）。誤りは記録する
  if (pf.wrongs === 0 && !(pl.drillHint && o.correct)) {
    const st = (uiProfile().prefix || {})[pl.q.key];
    uiSave(storeSetPrefix(uiS.data, uiS.pid, pl.q.key, prefixRecord(st, o.correct, pgToday())));
  }
  if (o.correct) {
    if (pf.wrongs === 0) pl.correct += 1;
    else pl.retried += 1;
    pf.done = true;
  } else {
    pf.wrongs += 1;
    pf.disabled.push(i);
    pf.lastWrong = o.id;
  }
}

function uiSubmit() {
  const el = document.getElementById('ans');
  const val = el ? el.value : '';
  const pl = uiS.play;
  if (pl.isClock) {
    const vals = pl.q.fields.map((_, i) => { const e = document.getElementById(i === 0 ? 'ans' : 'ans' + (i + 1)); return e ? e.value : ''; });
    pl.ck = ckFlowInput(pl.ck, pl.q, vals);
    uiClockAfter();
    uiRender();
    return;
  }
  if (pl.isWord) {
    uiWordSubmit(val);
    uiRender();
    return;
  }
  if (pl.mode === 'anzan') {
    const r = anCheck(val, pl.q.answer);
    if (r === 'invalid') {
      pl.anFb = 'invalid';
    } else if (r === 'ok') {
      // 正解はすぐ次の問題へ（速さの練習）。ヒントを見た問題は正解の数に入れない
      if (pl.drillHint) pl.retried += 1;
      else pl.correct += 1;
      pl.anLastOk = true;
      uiNext();
    } else {
      pl.anLastOk = false;
      pl.anShow = true;
    }
    uiRender();
    return;
  }
  if (pl.mode === 'drill') {
    const r = qCheck(val, pl.q.answer);
    if (r === 'invalid') pl.drillFb = 'invalid';
    else {
      if (pl.drillTries === 0) {
        uiSave(storeAddDrill(uiS.data, uiS.pid, (pl.q.dir === 'x' ? 'x' : 'd') + pl.q.k, r === 'ok'));
        if (r === 'ok') pl.correct += 1;
      }
      if (r === 'ok') {
        if (pl.drillTries > 0) pl.retried += 1;
        pl.drillFb = 'ok';
        pl.drillShow = true;
      } else {
        pl.drillTries += 1;
        pl.drillFb = 'ng';
        if (pl.drillTries >= 2) pl.drillShow = true;
      }
    }
    uiRender();
    return;
  }
  pl.flow = qFlowInput(pl.flow, pl.q, val);
  uiAfterFlow();
  uiRender();
}

function uiNext() {
  const pl = uiS.play;
  pl.idx += 1;
  if (pl.idx < pl.list.length) {
    uiNextQ();
    return;
  }
  uiFinishSession();
}

function uiFinishSession() {
  const pl = uiS.play;
  const p = uiProfile();
  const before = p.total;
  if (pl.mode === 'drill' && !SLOT_DRILL_GIVES_SLOT) {
    uiS.play = null;
    uiS.screen = 'home';
    return;
  }
  if (pl.mode === 'memtest') {
    uiFinishMemtest();
    return;
  }
  const spin0 = pl.mode === 'anzan' ? slotSpinAnzan(uiRng, pl.correct, uiS.pid) : slotSpin(uiRng, pl.correct); // 暗算はメンバーで倍率が違う（D-046）
  // 苦手ふくしゅうは2倍（D-025）。補助なしは1.5倍、ただしヒントを使った回は ふつう（D-034）
  const spin = pl.mode === 'review' ? slotReviewBonus(spin0) : pl.mode === 'jump' && !pl.hintUsed ? slotJumpBonus(spin0) : spin0;
  const session = {
    id: pl.id, date: pgToday(), mode: pl.mode, level: pl.level || null, n: pl.list.length, correct: pl.correct,
    retried: pl.retried, clean: pl.clean || 0, rec: !!pl.rec, mid: spin.mi, right: spin.ri, points: spin.points, formula: spin.formula, totalBefore: before,
  };
  // アニメーションの前に確定して保存する（途中で閉じても引き直せない）
  const r = storeApplySession(uiS.data, uiS.pid, session);
  // できるようになったこと（設計 §13.5）: 1問ごとの出来事 ＋ 回の終わりの出来事。同じ日の重複は storeAddLog が落とす
  const today = pgToday();
  let d = r.data;
  // 暗算トレーニングのタイム（D-046）。全問正解のときだけ自己ベストにする
  let anRes = null;
  if (pl.mode === 'anzan') {
    const ms = Math.max(1, Math.min(3600000, Date.now() - pl.anStart));
    const perfect = pl.correct === pl.list.length;
    anRes = { ms, perfect, newBest: false, best: ((storeProfile(d, uiS.pid).anzan || {})[pl.level] || {}).best || null };
    if (perfect) {
      const b = storeSetAnzanBest(d, uiS.pid, pl.level, ms);
      d = b.data;
      anRes.newBest = b.newBest;
      anRes.best = b.best;
    }
  }
  const se = coSessionEvents(pl.before, storeProfile(d, uiS.pid), today);
  for (const k of se.unlock) d = storeSetUnlocked(d, uiS.pid, k, today);
  // 段位（設計 §13.16）: 上がったら記録して出来事にする
  {
    const pr = storeProfile(d, uiS.pid);
    const before = pr.rank ? pr.rank.i : 0;
    const ri = coRankIndex(pr);
    if (ri > before || !pr.rank) {
      d = storeSetRank(d, uiS.pid, ri, today);
      for (let k = before + 1; k <= ri; k++) se.events.push({ date: today, kind: 'rank', key: String(k) });
    }
  }
  // ログイン・週のスタンプ（D-017。§13.12 の もくひょう は廃止）
  const bn = uiApplyBonuses(d, today);
  d = bn.data;
  const lg = storeAddLog(d, uiS.pid, pl.events.concat(se.events));
  d = lg.data;
  uiSave(d);
  const shown = lg.added;
  const nextStep = shown.length || !(pl.mode === 'normal' && pl.level) ? null : pgNextStep(storeProfile(d, uiS.pid).items, pl.level);
  uiS.play = null;
  uiS.result = { session, phase: 0, events: shown.filter((e) => e.kind !== 'daily'), nextStep, bonuses: bn.got, anzan: anRes, reel: pl.mode === 'anzan' ? slotAnzanReel(uiS.pid) : null };
  uiS.screen = 'result';
}

// まだもらっていない ログイン・週のスタンプ のボーナスを足す。返す: { data, got: [{ kind, points }] }
function uiApplyBonuses(data, today) {
  let d = data;
  const got = [];
  for (const b of mtDueBonuses(storeProfile(d, uiS.pid).sessions, today)) {
    const r = storeApplyBonus(d, uiS.pid, b.id, today, b.points);
    d = r.data;
    if (r.added) got.push(b);
  }
  return { data: d, got };
}

function uiBonusHtml(list) {
  return (list || []).map((b) => '<div class="fb ok daily">' + (b.kind === 'week' ? '今週のスタンプ ' + MT_WEEK_STAMPS + '個たまった！' : '今日も来てくれてありがとう！ ログインボーナス') + ' <b>＋' + b.points + ' ポイント</b></div>').join('');
}

// きおくテストの終わり（D-017）: 点は正解数で決まる。スロットは回さない
function uiFinishMemtest() {
  const pl = uiS.play;
  const p = uiProfile();
  const today = pgToday();
  const points = mtPoints(pl.correct, pl.list.length);
  const session = { id: pl.id, date: today, mode: 'memtest', level: null, n: pl.list.length, correct: pl.correct, retried: pl.retried, clean: pl.clean || 0, rec: !!pl.rec, mid: null, right: null, points, totalBefore: p.total };
  let d = storeApplyMemtest(uiS.data, uiS.pid, session).data;
  const se = coSessionEvents(pl.before, storeProfile(d, uiS.pid), today);
  for (const k of se.unlock) d = storeSetUnlocked(d, uiS.pid, k, today);
  {
    const pr = storeProfile(d, uiS.pid);
    const before = pr.rank ? pr.rank.i : 0;
    const ri = coRankIndex(pr);
    if (ri > before || !pr.rank) {
      d = storeSetRank(d, uiS.pid, ri, today);
      for (let k = before + 1; k <= ri; k++) se.events.push({ date: today, kind: 'rank', key: String(k) });
    }
  }
  const bn = uiApplyBonuses(d, today);
  d = bn.data;
  const lg = storeAddLog(d, uiS.pid, pl.events.concat(se.events));
  uiSave(lg.data);
  uiS.result = { session, missed: [...new Set(pl.missed)], events: lg.added, bonuses: bn.got, stamps: mtWeekStamps(storeProfile(lg.data, uiS.pid).sessions, today) };
  uiS.play = null;
  uiS.screen = 'mresult';
}

// ---------- タイムチャレンジ（設計 §13.8） ----------
function uiTimeKeys() {
  const p = uiProfile();
  const pk = prefixKeys().filter((k) => p.prefix && p.prefix[k] && p.prefix[k].box >= PREFIX_BOX_MAX);
  return { mk: pgMasteredKeys(p.items), pk };
}

function uiTimeStart() {
  const p = uiProfile();
  if (!coTimeAvailable(p)) return;
  const keys = uiTimeKeys();
  if (!keys.mk.length && !keys.pk.length) return;
  const now = Date.now();
  uiS.tc = { id: uiTabId + '-t' + now, end: now + TC_SECONDS * 1000, results: [], q: null, prevKey: null, wrong: null, timer: null, keys };
  uiTimeNext();
  uiS.screen = 'time';
  uiS.tc.timer = setInterval(uiTimeTick, 200);
}

function uiTimeNext() {
  const tc = uiS.tc;
  tc.q = tcMakeQuestion(uiRng, tc.keys.mk, tc.keys.pk, tc.prevKey);
  tc.prevKey = tc.q.key;
  tc.wrong = null;
}

function uiTimeTick() {
  const tc = uiS.tc;
  if (!tc) return;
  const left = Math.max(0, Math.ceil((tc.end - Date.now()) / 1000));
  const el = document.getElementById('tc-left');
  if (el) el.textContent = String(left);
  if (Date.now() >= tc.end) uiTimeFinish();
}

function uiTimeAnswer(i) {
  const tc = uiS.tc;
  if (!tc || tc.wrong || Date.now() >= tc.end || Date.now() < (tc.lockUntil || 0)) return;
  const o = tc.q.options[i];
  if (!o) return;
  tc.results.push(o.correct);
  if (o.correct) {
    uiTimeNext();
    tc.lockUntil = Date.now() + 200; // 正解の直後の二度押しを次の問題の答えにしない
  } else {
    tc.wrong = { i };
    const q = tc.q;
    setTimeout(() => {
      if (uiS.tc === tc && tc.q === q && Date.now() < tc.end) {
        uiTimeNext();
        uiRender();
      }
    }, TC_WRONG_SHOW_MS);
  }
  uiRender();
}

function uiTimeFinish() {
  const tc = uiS.tc;
  if (!tc) return;
  clearInterval(tc.timer);
  uiS.tc = null;
  const p = uiProfile();
  const today = pgToday();
  const sc = tcScore(tc.results);
  const points = tcPointsFor(sc.score, p.sessions, today);
  const session = {
    id: tc.id, date: today, mode: 'time', level: null, n: sc.n, correct: sc.correct, retried: 0, mid: null, right: null,
    points, score: sc.score, formula: sc.formula, totalBefore: p.total,
  };
  const r = storeApplyTime(uiS.data, uiS.pid, session);
  const bn = uiApplyBonuses(r.data, today);
  uiSave(bn.data);
  uiS.result = { time: true, session, newBest: r.newBest, bonuses: bn.got };
  uiS.screen = 'tresult';
  uiRender();
}

function uiTimeQuit() {
  if (uiS.tc) clearInterval(uiS.tc.timer);

}

// ---------- 画面: おわり（スロット） ----------
function uiResult() {
  const res = uiS.result;
  const s = res.session;
  const p = uiProfile();
  const ph = res.phase; // 0: まわる 1: 中央止まる 2: 右止まる 3: けっか
  const sym = (i) => SLOT_SYMBOLS[i].label;
  let h = '<h1>おつかれさま！</h1>';
  h += uiBonusHtml(res.bonuses);
  if (res.events && res.events.length) {
    h += '<div class="fb ok say">' + charaSvg('shikaku', 'cheer', 72) + '<b>今日できるようになったこと</b><ul class="list">' + res.events.map((e) => '<li>' + uiEsc(uiEventText(e)) + '</li>').join('') + '</ul></div>';
  } else if (res.nextStep) {
    h += '<div class="fb info say">' + charaSvg('shikaku', 'normal', 72) + '<b>次の一歩</b><br>' + uiEsc(uiNextStepText(res.nextStep)) + '</div>';
  }
  h += '<p class="stat">できた: <b>' + s.correct + '</b> 問 / ' + s.n + ' 問' + (s.retried ? '　やり直してできた: <b>' + s.retried + '</b> 問' : '') + '</p>';
  if (res.anzan) {
    const an = res.anzan;
    h += '<p class="stat">タイム <b>' + uiSec(an.ms) + '</b>' + (an.newBest ? ' <b class="clear">自己ベスト！</b>' : an.best ? '（自己ベスト ' + uiSec(an.best) + '）' : '') + (an.perfect ? '' : '<br><span class="muted">全問正解のときに 自己ベストを記録するよ。</span>') + '</p>';
  }
  h += '<div class="chara-row">' + uiMyAvatar(avMoodFromResult(s.correct, s.n), 96) + CHARA_LIST.map((c) => charaSvg(c.id, ph >= 3 ? 'happy' : 'cheer', 80)).join('') + '</div>';
  h += '<div class="slot ' + uiEsc(p.theme) + '"><div class="reel">' + s.correct + '</div><span>×</span>';
  h += '<div class="reel' + (ph < 1 ? ' spin' : '') + '" id="reel-m">' + (ph >= 1 ? sym(s.mid) : '?') + '</div></div>'; // 右（÷）のリールは無くした（D-038）
  if (ph >= 3) {
    h += '<div class="formula">' + uiEsc(s.formula) + '</div><div class="points">+' + s.points + ' ポイント</div>';
    h += '<p style="text-align:center"><button class="primary big" data-act="resultdone">ホームへ（Enter）</button></p>';
    if (s.mode === 'normal' && s.level && pgJumpKeys(p.items, s.level).length) h += '<p style="text-align:center"><button data-act="jumpnow" data-level="' + s.level + '">簡単だった？ レベル' + s.level + ' 補助なしでチャレンジ！</button></p>';
  }
  return h;
}

function uiRunSlot() {
  const res = uiS.result;
  if (!res || res.running) return;
  res.running = true;
  const val = (i) => SLOT_SYMBOLS[i].n / SLOT_SYMBOLS[i].d; // 並べる順だけに使う（点の計算には使わない）
  const reels = [...new Set(res.reel || SLOT_REEL)].sort((a, b) => val(a) - val(b)).map((i) => SLOT_SYMBOLS[i].label); // リールにある目だけ（D-029。暗算は D-046 のリール）
  let tick = 0;
  const iv = setInterval(() => {
    tick += 1;
    const m = document.getElementById('reel-m');
    if (m && res.phase < 1) m.textContent = reels[tick % reels.length];
  }, 90);
  setTimeout(() => { clearInterval(iv); res.phase = 1; uiRender(); }, 1600);
  setTimeout(() => { res.phase = 3; uiRender(); }, 2200);
}

function uiReadRewardSlotForm() {
  const num = (id) => {
    const el = document.getElementById(id);
    const v = el ? el.value.trim() : '';
    return v === '' ? null : Number(v);
  };
  const prizes = [];
  for (let i = 0; i < 10; i++) {
    const yen = num('rs-yen-' + i);
    const w = num('rs-w-' + i);
    const ie = document.getElementById('rs-item-' + i);
    const item = ie ? ie.value.trim() : '';
    if (yen === null && w === null && !item) continue;
    prizes.push(item ? { yen: 0, item, w } : { yen, w });
  }
  return { cost: num('rs-cost'), prizes, last: num('rs-last') || 0 };
}

function uiRunRewardSpin() {
  const sp = uiS.rspin;
  const labels = storeRewardSlot(uiS.data).prizes.map(rsPrizeLabel);
  let t = 0;
  const iv = setInterval(() => {
    t += 1;
    const el = document.getElementById('rs-reel');
    if (el && !sp.shown) el.textContent = labels[t % labels.length];
  }, 90);
  setTimeout(() => {
    clearInterval(iv);
    if (uiS.rspin === sp) {
      sp.shown = true;
      uiRender();
    }
  }, 1800);
}

function uiDownload(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function uiReadRewardsForm() {
  const list = [];
  uiS.data.rewards.forEach((r, i) => {
    const name = document.getElementById('rw-name-' + i).value.trim();
    const cost = Number(document.getElementById('rw-cost-' + i).value);
    list.push({ id: r.id, name, cost });
  });
  return list;
}

function uiSaveRewards(list) {
  const bad = list.find((r) => !r.name || !Number.isInteger(r.cost) || r.cost < 1);
  if (bad) {
    uiS.adult.msg = '名前とポイント（1以上の整数）を入れてください。';
    return;
  }
  if (uiSave(storeSetRewards(uiS.data, list))) uiS.adult.msg = 'ごほうびを保存しました。';
}

// ---------- 描画とイベント ----------
function uiRender() {
  uiShowBanner();
  if (uiSw.reload) uiSwMaybeReload();
  if (uiS.blocked) {
    uiApp.innerHTML = '<h1>ほかの窓で開いています</h1><p>この窓を閉じてね。（2つの窓で使うと、記録が消えることがあります）</p>' +
      '<p class="muted">ほかの窓がないときは、5秒待ってから開き直してね。</p>';
    return;
  }
  if (uiS.mode === 'readonly') {
    uiApp.innerHTML = '<h1>新しい版で開いてね</h1><p>この記録は、このアプリより新しい版で作られています。この版では記録を見たり変えたりできません。</p>' +
      '<p class="muted">おとなの人へ: 今の記録はそのまま残っています。新しい版のファイル（app_v○.html）を開いてください。念のため、元のデータを書き出せます。</p>' +
      '<p><button data-act="exportraw">元のデータを書き出す</button></p>';
    return;
  }
  const scr = uiS.screen;
  let h = '';
  if (scr === 'who') h = uiWho();
  else if (scr === 'home') h = uiHome();
  else if (scr === 'play') h = uiPlay();
  else if (scr === 'result') h = uiResult();
  else if (scr === 'rewards') h = uiRewards();
  else if (scr === 'adult') h = uiAdult();
  else if (scr === 'why') h = uiWhyScreen();
  else if (scr === 'time') h = uiS.tc ? uiTime() : uiHome();
  else if (scr === 'tresult') h = uiTimeResult();
  else if (scr === 'mresult') h = uiS.result ? uiMemtestResult() : uiHome();
  uiApp.innerHTML = h;
  // タッチの端末では端末のキーボードを出さず、画面のテンキーだけで入れる（D-027）
  if (uiTouch) for (const el of uiApp.querySelectorAll('input[id^="ans"]')) { el.readOnly = true; el.setAttribute('inputmode', 'none'); }
  // 答えの欄とテンキーを1つにまとめる（スマホでは画面の下に固定する。D-030）
  {
    const tk = uiApp.querySelector('.tenkey');
    const row = tk && tk.previousElementSibling;
    if (row && row.classList.contains('answer-row')) {
      const dock = document.createElement('div');
      dock.className = 'dock';
      row.before(dock);
      dock.append(row, tk);
    }
  }
  const ans = document.getElementById('ans');
  // 画面をずらさずに入れる欄を選ぶ（iPhone は focus で欄を画面の中ほどへ動かすため。D-031）
  if (ans) ans.focus({ preventScroll: true });
  if (scr === 'result') uiRunSlot();
  const imp = document.getElementById('importfile');
  if (imp) imp.addEventListener('change', uiOnImportFile);
}

function uiOnImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const r = storeParseImport(String(rd.result));
    if (!r.ok) {
      uiS.adult.msg = 'このファイルは よみこめません: ' + uiEsc(r.errors.slice(0, 3).join(' / '));
      uiS.adult.importPlan = null;
    } else {
      uiS.adult.importPlan = { data: r.data, summary: storeImportSummary(uiS.data, r.data) };
      uiS.adult.msg = null;
    }
    uiRender();
  };
  rd.onerror = () => {
    uiS.adult.msg = 'ファイルを読めませんでした。';
    uiRender();
  };
  rd.readAsText(file);
}

function uiGoPick(pid) {
  uiS.pid = pid;
  const p = uiProfile();
  if (p.pending) {
    uiS.result = { session: p.pending, phase: 0 };
    uiS.screen = 'result';
  } else {
    uiS.screen = 'home';
  }
}

function uiOnClick(e) {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const a = uiS.adult;
  switch (act) {
    case 'pick': uiGoPick(b.dataset.id); break;
    case 'who': uiS.screen = 'who'; uiS.pid = null; a.ok = false; a.msg = null; a.importPlan = null; a.askSaved = false; break;
    case 'home': uiS.screen = 'home'; a.msg = null; break;
    case 'adult': uiS.screen = 'adult'; a.ok = false; break;
    case 'adultyes': a.ok = true; break;
    case 'start': uiStart(b.dataset.mode, Number(b.dataset.level) || null); break;
    case 'theme': uiSave(storeSetTheme(uiS.data, uiS.pid, b.dataset.id)); break;
    case 'why':
      if (uiS.play && uiS.play.mode === 'memtest') break;
      if (uiS.play) {
        uiS.play.why = !uiS.play.why;
        if (uiS.play.mode === 'jump' && uiS.play.why) uiS.play.hintUsed = true; // 説明を見たらヒントと同じ（D-034）
        // 答える前に説明を見たら、ヒントを使ったのと同じに記録する
        if (uiS.play.why && uiS.play.flow && uiS.play.flow.stage === 's1') uiS.play.flow = qFlowHint(uiS.play.flow);
      }
      break;
    case 'whyopen': uiS.screen = 'why'; break;
    case 'whyback': uiS.screen = 'home'; break;
    case 'hint':
      if (uiS.play && uiS.play.mode === 'memtest') break;
      if (uiS.play && uiS.play.mode === 'jump') uiS.play.hintUsed = true; // 補助なしの1.5倍が ふつうに戻る（D-034）
      if (uiS.play && uiS.play.isClock) uiS.play.ck = ckFlowHint(uiS.play.ck);
      else if (uiS.play && uiS.play.flow) uiS.play.flow = qFlowHint(uiS.play.flow);
      else if (uiS.play) uiS.play.drillHint = true;
      break;
    case 'quit':
      if (uiS.play && uiS.play.events && uiS.play.events.length) uiSave(storeAddLog(uiS.data, uiS.pid, uiS.play.events).data);
      uiS.play = null;
      uiS.screen = 'home';
      break;
    case 'choose': {
      const pl = uiS.play;
      if (pl.isClock) { pl.ck = ckFlowChoose(pl.ck, pl.q, Number(b.dataset.i)); uiClockAfter(); break; }
      if (pl.isMeaning) { uiMeaningChoose(Number(b.dataset.i)); break; }
      if (pl.mode === 'prefix') { uiPrefixChoose(Number(b.dataset.i)); break; }
      pl.flow = qFlowChoose(pl.flow, pl.q, Number(b.dataset.i));
      uiAfterFlow();
      break;
    }
    case 'key': {
      const el = document.getElementById(uiS.lastInput || 'ans') || document.getElementById('ans');
      if (el) {
        const k = b.dataset.k;
        el.value = k === '⌫' ? el.value.slice(0, -1) : el.value + k;
        if (document.activeElement !== el) el.focus({ preventScroll: true });
      }
      return;
    }
    case 'submit': uiSubmit(); return;
    case 'tcans': uiTimeAnswer(Number(b.dataset.i)); return;
    case 'tcquit': uiTimeQuit(); break;
    case 'tresultdone': uiS.result = null; uiS.screen = 'home'; break;
    case 'jumpnow': uiSave(storeClearPending(uiS.data, uiS.pid)); uiS.result = null; uiS.screen = 'home'; uiStart('jump', Number(b.dataset.level)); break;
    case 'next': uiNext(); break;
    case 'mresultdone': uiS.result = null; uiS.screen = 'home'; break;
    case 'resultdone': uiSave(storeClearPending(uiS.data, uiS.pid)); uiS.result = null; uiS.screen = 'home'; break;
    case 'rewards': uiS.screen = 'rewards'; uiS.exchange = null; uiS.rsAsk = false; uiS.rspin = null; a.msg = null; break;
    case 'exchange': uiS.exchange = b.dataset.id; break;
    case 'excancel': uiS.exchange = null; break;
    case 'rsask': uiS.rsAsk = true; a.msg = null; break;
    case 'rscancel': uiS.rsAsk = false; break;
    case 'rsok': {
      uiS.rsAsk = false;
      const draw = rsDraw(uiRng, storeRewardSlot(uiS.data), uiProfile().rbox);
      const r = storeSpinReward(uiS.data, uiS.pid, draw, uiNowIso());
      // 保存できたときだけ回す（atomic）
      if (r.ok && uiSave(r.data, { atomic: true })) {
        uiS.rspin = { prize: r.prize, shown: false };
        uiRunRewardSpin();
      } else if (r.ok) a.msg = '保存できなかったので、回すのをやめました。';
      break;
    }
    case 'rsdone': uiS.rspin = null; break;
    case 'rssave': {
      const cfg = uiReadRewardSlotForm();
      try {
        let nd = storeSetRewardSlot(uiS.data, cfg);
        for (const pr of nd.profiles) {
          const el = document.getElementById('rs-pcost-' + pr.id);
          if (!el) continue;
          const v = el.value.trim();
          nd = storeSetRsCost(nd, pr.id, v === '' ? null : Number(v));
        }
        if (uiSave(nd, { atomic: true })) a.msg = 'ごほうびくじを保存しました。';
        else a.msg = '保存できませんでした。';
      } catch (err) {
        a.msg = 'ごほうびくじの入力を確かめてください（' + uiEsc(err.message) + '）';
      }
      break;
    }
    case 'exok': {
      const r = storeExchange(uiS.data, uiS.pid, uiS.exchange, uiNowIso());
      if (r.ok && uiSave(r.data, { atomic: true })) a.msg = 'こうかん しました！';
      else if (r.ok) a.msg = '保存できなかったので、こうかんをやめました。';
      uiS.exchange = null;
      break;
    }
    case 'export': {
      uiDownload('keisan_backup_' + pgToday().replace(/-/g, '') + '.json', storeExportText(uiS.data));
      a.askSaved = true;
      break;
    }
    case 'savedyes': a.askSaved = false; if (uiSave(storeMarkExported(uiS.data, uiNowIso()))) a.msg = '保存を確かめた日を記録しました。'; break;
    case 'savedno': a.askSaved = false; a.msg = '保存できなかった場合は、もう一度書き出してください。'; break;
    case 'exportbroken': uiDownload('keisan_broken_' + pgToday().replace(/-/g, '') + '.txt', uiS.rawBroken || ''); break;
    case 'importcancel': a.importPlan = null; break;
    case 'importgo': {
      if (!a.importPlan) break;
      if (uiS.mode === 'normal' && !storeBackupBeforeImport(uiS.ctx.ls, uiS.data, Date.now())) {
        a.msg = '今の記録を とっておけなかったので、よみこみをやめました。';
        a.importPlan = null;
        break;
      }
      const prev = uiS.data;
      const next = storeAdoptImported(a.importPlan.data, uiS.ctx.rev);
      if (uiSave(next, { atomic: true })) {
        a.msg = uiS.mode === 'normal' ? 'よみこみました。24時間以内なら「取り消す」で もどせます。' : 'よみこみました。ただし このブラウザでは記録が残りません。';
      } else {
        uiS.data = prev;
        if (uiS.mode === 'normal') storeClearBeforeImport(uiS.ctx.ls);
        a.msg = 'よみこみを保存できませんでした。元の記録のままです。';
      }
      a.importPlan = null;
      break;
    }
    case 'undoplan': {
      const old = storeReadBeforeImport(uiS.ctx.ls, Date.now());
      a.undoPlan = old ? { data: old, summary: storeImportSummary(uiS.data, old) } : null;
      break;
    }
    case 'undocancel': a.undoPlan = null; break;
    case 'resetask': a.resetAsk = b.dataset.id; a.msg = null; break;
    case 'resetcancel': a.resetAsk = null; break;
    case 'resetgo': {
      const target = a.resetAsk;
      a.resetAsk = null;
      if (!target) break;
      // 直前の状態を控える（読み込みと同じ場所。D-023）。控えられなければ消さない
      if (uiS.mode === 'normal' && !storeBackupBeforeImport(uiS.ctx.ls, uiS.data, Date.now())) {
        a.msg = '今の記録を とっておけなかったので、リセットをやめました。';
        break;
      }
      const next = target === 'all' ? storeResetAll(uiS.data) : storeResetProfile(uiS.data, target);
      if (uiSave(next, { atomic: true })) a.msg = 'リセットしました。24時間以内なら「取り消す」で もどせます。';
      else {
        if (uiS.mode === 'normal') storeClearBeforeImport(uiS.ctx.ls);
        a.msg = 'リセットを保存できませんでした。元の記録のままです。';
      }
      break;
    }
    case 'undogo': {
      if (!a.undoPlan) break;
      if (uiSave(storeAdoptImported(a.undoPlan.data, uiS.ctx.rev), { atomic: true })) {
        storeClearBeforeImport(uiS.ctx.ls);
        a.msg = 'よみこみ・リセットの前に もどしました。';
      } else {
        a.msg = 'もどせませんでした。今の記録のままです。';
      }
      a.undoPlan = null;
      break;
    }
    case 'exportraw': uiDownload('keisan_original_' + pgToday().replace(/-/g, '') + '.json', uiS.rawOriginal || ''); break;
    case 'rename': {
      const v = document.getElementById('name-' + b.dataset.id).value;
      try {
        if (uiSave(storeRename(uiS.data, b.dataset.id, v))) a.msg = '名前を変えました。';
      } catch (err) {
        a.msg = '名前は 1〜20文字で入れてください。';
      }
      break;
    }
    case 'rwdel': {
      const list = uiReadRewardsForm();
      list.splice(Number(b.dataset.i), 1);
      uiSaveRewards(list);
      break;
    }
    case 'rwadd': {
      const list = uiReadRewardsForm();
      const name = document.getElementById('rw-name-new').value.trim();
      const cost = Number(document.getElementById('rw-cost-new').value);
      list.push({ id: 'r' + Date.now().toString(36), name, cost });
      uiSaveRewards(list);
      break;
    }
    case 'rwsave': uiSaveRewards(uiReadRewardsForm()); break;
    default: throw new Error('未知の操作 ' + act);
  }
  uiRender();
}

function uiOnKey(e) {
  if (uiS.blocked) return;
  const scr = uiS.screen;
  if (scr === 'play') {
    const pl = uiS.play;
    const inInput = e.target && /^ans\d*$/.test(e.target.id || '');
    if (inInput && e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) uiSubmit();
      return;
    }
    const done = pl.isClock ? pl.ck.stage === 'done' : pl.isWord ? pl.wd.show : pl.mode === 'anzan' ? pl.anShow : pl.mode === 'drill' ? pl.drillShow : pl.mode === 'prefix' || pl.isMeaning ? pl.pf.done : pl.flow.stage === 'done';
    if (done && e.key === 'Enter') {
      if (e.repeat) return; // 押しっぱなしで答えを見ずに進まないようにする
      e.preventDefault();
      uiNext();
      uiRender();
      return;
    }
    if (pl.isClock && pl.ck.stage === 's1' && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      pl.ck = ckFlowChoose(pl.ck, pl.q, Number(e.key) - 1);
      uiClockAfter();
      uiRender();
      return;
    }
    if ((pl.mode === 'prefix' || pl.isMeaning) && /^[1-4]$/.test(e.key)) {
      e.preventDefault();
      if (pl.isMeaning) uiMeaningChoose(Number(e.key) - 1);
      else uiPrefixChoose(Number(e.key) - 1);
      uiRender();
      return;
    }
    if (pl.flow && pl.flow.stage === 's1' && /^[1-4]$/.test(e.key)) {
      // 押した数字が、次に出る②の入力欄に入らないようにする
      e.preventDefault();
      const i = Number(e.key) - 1;
      if (!pl.flow.disabled.includes(i)) {
        pl.flow = qFlowChoose(pl.flow, pl.q, i);
        uiAfterFlow();
        uiRender();
      }
    }
  } else if (scr === 'time' && uiS.tc && /^[1-4]$/.test(e.key) && !e.repeat) {
    e.preventDefault();
    uiTimeAnswer(Number(e.key) - 1);
  } else if ((scr === 'tresult' || scr === 'mresult') && e.key === 'Enter' && !e.repeat) {
    e.preventDefault();
    uiS.result = null;
    uiS.screen = 'home';
    uiRender();
  } else if (scr === 'result' && uiS.result && uiS.result.phase >= 3 && e.key === 'Enter' && !e.repeat) {
    e.preventDefault();
    uiSave(storeClearPending(uiS.data, uiS.pid));
    uiS.result = null;
    uiS.screen = 'home';
    uiRender();
  }
}

uiApp.addEventListener('click', (e) => {
  try {
    uiOnClick(e);
  } catch (err) {
    uiS.warnings.push('エラーが起きました: ' + uiEsc(String(err && err.message ? err.message : err)));
    uiShowBanner();
    throw err;
  }
});
document.addEventListener('keydown', uiOnKey);
// 暗算トレーニングのタイマーの表示（D-046）。画面を描き直さず、数字だけ書きかえる
setInterval(() => {
  const pl = uiS.play;
  if (uiS.screen !== 'play' || !pl || pl.mode !== 'anzan' || !pl.anStart) return;
  const el = document.getElementById('an-timer');
  if (el) el.textContent = uiSec(Date.now() - pl.anStart);
}, 200);
// テンキーで入れる欄（じかん の 答えが2つの問題）: 最後に触った欄
// タッチの端末: 欄をタップしても画面を動かさない（選ぶだけ。D-031）
document.addEventListener('touchend', (e) => {
  const t = e.target;
  if (!uiTouch || !t || !/^ans\d*$/.test(t.id || '')) return;
  e.preventDefault();
  uiS.lastInput = t.id;
  t.focus({ preventScroll: true });
}, { passive: false });
document.addEventListener('focusin', (e) => {
  if (e.target && /^ans\d*$/.test(e.target.id || '')) uiS.lastInput = e.target.id;
});
// 日をまたいで開いたままでも、ホームの「きょうの れんしゅう」・もくひょうを今日の内容にする（D-014 の確認で発見）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && uiS.screen === 'home' && !uiS.blocked) uiRender();
});
window.addEventListener('focus', () => {
  if (uiS.screen === 'home' && !uiS.blocked) uiRender();
});
// iPad・iPhone 用（PWA）: サービスワーカーの登録と、新しい版への切り替え（D-024）。http/https のときだけ
const uiSw = { reg: null, reload: false };
function uiSwSetup() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  if (!document.querySelector('link[rel="manifest"]')) return; // PWA 版（dist/pwa）だけ。PC 用の HTML では登録しない
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => { uiSw.reg = reg; }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return; // はじめて入ったときは読み込み直さない
    uiSw.reload = true;
    uiSwMaybeReload();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && uiSw.reg) uiSw.reg.update().catch(() => {});
  });
}
// 新しい版が入っていて、最初の画面かホームなら読み込み直す（学習の途中では読み込み直さない）
function uiSwMaybeReload() {
  if (uiSw.reload && (uiS.screen === 'who' || uiS.screen === 'home') && !uiS.play && !uiS.tc) location.reload();
}

uiInitStore();
uiRender();
uiSwSetup();

}
})();
</script>
